  if(S.pcal===undefined){try{S.pcal=!!localStorage.getItem('adm_pcal')}catch(e){S.pcal=false}}
  if(!S.panels){$('#app').innerHTML='<div class="load">Se încarcă panourile…</div>';
    call('getPanels').then(p=>{S.panels=p;renderPan();}).catch(e=>{const m=String(e.message||e);
      $('#app').innerHTML='<div class="load msg err">'+(/getPanels|not found|nu a fost găsit|Script function/i.test(m)?'Panourile cer versiunea nouă a scriptului (Code.gs). Cere-i lui Alex să o publice.':esc(m))+'</div>';});return;}
  const f=S.pf||'act',d=today();
  const groups={act:p=>['on','pl','pr'].indexOf(pStat(p)[0])>=0,pr:isPropOpen,on:p=>pStat(p)[0]==='on',pl:p=>pStat(p)[0]==='pl',off:p=>!p.active&&!isProp(p),ex:p=>pStat(p)[0]==='ex',all:()=>true};
  const lab={act:'Pe site, programate și propuneri',pr:'Propuneri',on:'Pe site acum',pl:'Programate',off:'Oprite',ex:'Expirate',all:'Toate'};
  const kinds=[...new Set(S.panels.map(p=>p.kind).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ro'));
  const q=norm(S.pq||''),ws=q.split(/\s+/).filter(Boolean);
  const srt=S.ps||'date';const key=p=>p.date||p.from||'';const upd=p=>{const m=String(p.updated||'').match(/(\d{2})\.(\d{2})\.(\d{4})(?: (\d{2}):(\d{2}))?/);return m?m[3]+m[2]+m[1]+(m[4]||'00')+(m[5]||'00'):'';};
  const sorters={date:(a,b)=>(key(a)||'9').localeCompare(key(b)||'9'),date_desc:(a,b)=>(key(b)||'0').localeCompare(key(a)||'0'),upd:(a,b)=>upd(b).localeCompare(upd(a)),kind:(a,b)=>(a.kind||'').localeCompare(b.kind||'','ro')||(key(a)||'9').localeCompare(key(b)||'9'),title:(a,b)=>(a.title||a.guest||'').localeCompare(b.title||b.guest||'','ro')};
  const L=S.panels.filter(groups[f]).filter(p=>!S.pk||p.kind===S.pk).filter(p=>!ws.length||ws.every(w=>norm([p.kind,p.title,p.guest,p.when,p.text,p.id].join(' ')).includes(w))).sort((a,b)=>((pStat(a)[0]==='ex')-(pStat(b)[0]==='ex'))||(sorters[srt]||sorters.date)(a,b));
  const sel=(S.psel||[]).filter(id=>L.some(p=>p.id===id));S.psel=sel;
  $('#app').innerHTML=`<div class="stats">${Object.keys(lab).map(k=>`<span data-pf="${k}" class="${f===k?'on':''}" title="Arată doar: ${lab[k]}">${lab[k]} · ${S.panels.filter(groups[k]).length}</span>`).join('')}</div>
  <div class="tools"><h2 class="pg" style="margin:0">Editorial</h2><span class="sub">Panourile de pe prima pagină: evenimente, cartea săptămânii, cărți noi. Pe site în câteva minute.</span>${canPan()?'<button class="btn" id="padd" style="margin-left:auto">+ Panou nou</button>':''}</div>
  <div class="tools"><input type="search" id="pq" placeholder="Caută în panouri: titlu, invitat, tip…" value="${esc(S.pq||'')}" style="flex:1 1 220px"><select id="pf">${Object.keys(lab).map(k=>`<option value="${k}" ${f===k?'selected':''}>${lab[k]} · ${S.panels.filter(groups[k]).length}</option>`).join('')}</select><select id="pk"><option value="">Toate tipurile</option>${kinds.map(k=>`<option ${S.pk===k?'selected':''}>${esc(k)}</option>`).join('')}</select><select id="ps"><option value="date" ${srt==='date'?'selected':''}>După dată, cele apropiate întâi</option><option value="date_desc" ${srt==='date_desc'?'selected':''}>După dată, cele îndepărtate întâi</option><option value="upd" ${srt==='upd'?'selected':''}>Modificate recent întâi</option><option value="kind" ${srt==='kind'?'selected':''}>După tip</option><option value="title" ${srt==='title'?'selected':''}>După titlu</option></select><div class="vtog"><button data-pv="l" aria-pressed="${!S.pcal}">Listă</button><button data-pv="c" aria-pressed="${!!S.pcal}">Calendar</button></div><span class="sub">${L.length} panouri</span></div>
  ${S.pcal?renderPanCal(L):`${sel.length&&canPan()?`<div class="bulk"><label><input type="checkbox" id="pall" checked> ${sel.length} selectate</label> · <button class="linkbtn" data-pb="on">Pornește</button> <button class="linkbtn" data-pb="off">Oprește</button> <select id="pbm" style="padding:2px 6px;font-size:13px"><option value="">Mută cu…</option><option value="7">+1 săptămână</option><option value="14">+2 săptămâni</option><option value="-7">−1 săptămână</option><option value="-14">−2 săptămâni</option><option value="1">+1 zi</option><option value="-1">−1 zi</option><option value="x">alt număr de zile…</option></select>${S.data.user.role==='admin'?' <button class="linkbtn" data-pb="del">Șterge</button>':''} <button class="linkbtn" data-pb="none" style="margin-left:auto">Deselectează</button></div>`:''}
  <table><thead><tr>${canPan()?'<th></th>':''}<th>Stare</th><th>Panou</th><th class="hide-m">Când</th><th class="hide-m">Cărți</th><th class="hide-m">Modificat</th><th></th></tr></thead><tbody>
  ${L.map(p=>{const [c,t]=pStat(p);return `<tr class="pr">${canPan()?`<td class="ck"><input type="checkbox" data-psel="${esc(p.id)}" ${sel.indexOf(p.id)>=0?'checked':''}></td>`:''}<td><span class="pst ${c}">${t}</span></td>
   <td><div class="pk">${esc(p.kind)} · ${esc(p.id)}</div><div class="t">${esc(p.title||p.guest||'(fără titlu)')}</div>${p.title&&p.guest?`<div class="sub">cu ${esc(p.guest)}</div>`:''}<div class="sub">${esc(pWin(p))}</div></td>
   <td class="hide-m sub">${esc(p.when)}</td><td class="hide-m sub">${p.books.length}</td><td class="hide-m sub">${esc(String(p.updated||'').replace(/, .*$/,''))}</td>
   <td style="white-space:nowrap;text-align:right">${canPan()&&isProp(p)?`<button class="linkbtn" data-pok="${esc(p.id)}">Aprobă</button> · <button class="linkbtn" data-pe="${esc(p.id)}">Editează</button> · <button class="linkbtn" data-pno="${esc(p.id)}">Respinge</button>`:canPan()?`<button class="linkbtn" data-pt="${esc(p.id)}">${p.active?'Oprește':'Pornește'}</button> · <button class="linkbtn" data-pe="${esc(p.id)}">Editează</button> · <button class="linkbtn" data-pd="${esc(p.id)}">Duplică</button>`:`<button class="linkbtn" data-pe="${esc(p.id)}">Vezi</button>`}</td></tr>`;}).join('')||'<tr><td colspan="7" class="sub">Niciun panou aici.</td></tr>'}</tbody></table>`}`;
  document.querySelectorAll('[data-pf]').forEach(b=>b.onclick=()=>{S.pf=b.dataset.pf;renderPan();});
  document.querySelectorAll('[data-pv]').forEach(b=>b.onclick=()=>{S.pcal=b.dataset.pv==='c';try{localStorage.setItem('adm_pcal',S.pcal?'1':'')}catch(e){}renderPan();});
  if(S.pcal){const sc=$('.cl-scroll'),now=$('.cl-col.now');if(sc&&now)sc.scrollLeft=Math.max(0,parseInt(now.style.left)-112);if(canPan())calDrag(56);}
  const pq=$('#pq');pq.addEventListener('input',()=>{S.pq=pq.value;const c=pq.selectionStart;renderPan();const n=$('#pq');n.focus();n.setSelectionRange(c,c);});
  $('#pf').onchange=e=>{S.pf=e.target.value;renderPan();};$('#pk').onchange=e=>{S.pk=e.target.value;renderPan();};$('#ps').onchange=e=>{S.ps=e.target.value;renderPan();};
  document.querySelectorAll('[data-psel]').forEach(c=>c.onchange=()=>{const id=c.dataset.psel;S.psel=c.checked?S.psel.concat([id]):S.psel.filter(x=>x!==id);renderPan();});
  const pa=$('#pall');if(pa)pa.onchange=()=>{S.psel=[];renderPan();};
  const pbm=$('#pbm');if(pbm)pbm.onchange=()=>{let v=pbm.value;pbm.value='';if(!v)return;if(v==='x'){v=prompt('Cu câte zile? (negativ = mai devreme)','');if(v==null)return;}const n=parseInt(v,10);if(!n)return;shiftDialog(S.psel.map(id=>S.panels.find(p=>p.id===id)).filter(Boolean),n);};
  document.querySelectorAll('[data-pb]').forEach(b=>b.onclick=()=>{const k=b.dataset.pb,ids=S.psel.slice();if(k==='none'){S.psel=[];renderPan();return;}
    if(k==='del'){if(!confirm('Ștergi definitiv '+ids.length+' panouri?'))return;Promise.all(ids.map(id=>call('deletePanel',id))).then(()=>{S.panels=S.panels.filter(p=>ids.indexOf(p.id)<0);S.psel=[];renderPan();toast('Șterse: '+ids.length);}).catch(e=>{alert(e.message||e);S.panels=null;renderPan();});return;}
    const on=k==='on';const todo=ids.map(id=>JSON.parse(JSON.stringify(S.panels.find(p=>p.id===id)))).filter(p=>p.active!==on);
    Promise.all(todo.map(p=>{p.active=on;if(on)p.src=String(p.src||'').replace(/^propunere\s*·?\s*/i,'')||'manual';return call('savePanel',p);})).then(rs=>{rs.forEach(r=>{S.panels=S.panels.map(x=>x.id===r.id?r:x);});S.psel=[];renderPan();toast((on?'Pornite: ':'Oprite: ')+rs.length);}).catch(e=>{alert(e.message||e);S.panels=null;renderPan();});});
  const P=id=>S.panels.find(p=>p.id===id);
  document.querySelectorAll('[data-pe]').forEach(b=>b.onclick=()=>{if(b._drag)return;openPan(JSON.parse(JSON.stringify(P(b.dataset.pe))));});
  document.querySelectorAll('[data-pd]').forEach(b=>b.onclick=()=>{const c=JSON.parse(JSON.stringify(P(b.dataset.pd)));c.id='';c.active=false;c.src='manual';c.when='';c.date='';c.end='';c.from='';c.to='';openPan(c);toast('Copie fără date: pune data și salvează');});
  document.querySelectorAll('[data-pt]').forEach(b=>b.onclick=()=>{const p=JSON.parse(JSON.stringify(P(b.dataset.pt)));p.active=!p.active;b.disabled=true;
    call('savePanel',p).then(r=>{S.panels=S.panels.map(x=>x.id===r.id?r:x);renderPan();toast(r.active?'Pornit':'Oprit');}).catch(e=>{alert(e.message||e);renderPan();});});
  document.querySelectorAll('[data-pok]').forEach(b=>b.onclick=()=>{const p=JSON.parse(JSON.stringify(P(b.dataset.pok)));p.active=true;p.src=String(p.src||'').replace(/^propunere\s*·?\s*/i,'')||'manual';b.disabled=true;
    call('savePanel',p).then(r=>{S.panels=S.panels.map(x=>x.id===r.id?r:x);renderPan();toast('Aprobat · '+pStat(r)[1].toLowerCase());}).catch(e=>{alert(e.message||e);renderPan();});});
  document.querySelectorAll('[data-pno]').forEach(b=>b.onclick=()=>{if(!confirm('Respingi propunerea? Se șterge din listă.'))return;b.disabled=true;
    call('deletePanel',b.dataset.pno).then(()=>{S.panels=S.panels.filter(x=>x.id!==b.dataset.pno);renderPan();toast('Propunere respinsă');}).catch(e=>{alert(e.message||e);renderPan();});});
  const a=$('#padd');if(a)a.onclick=()=>openPan({id:'',active:true,kind:'Meet the Book',title:'',guest:'',when:'',date:'',end:'',from:'',to:'',books:[],text:'',src:'manual',logo:''});
}
function openPan(p){S.pe=p;S.peOrig=JSON.stringify(p);renderPan();window.scrollTo(0,0);}
function bchip(id){const r=bookRow(id);const u=r?coverUrl(r[C('Copertă')]):'';return `<div class="bchip" data-b="${esc(id)}">${u?`<img src="${esc(u)}" alt="">`:''}<span>${r?esc(r[C('Titlu')]):'ID '+esc(id)+' (nu există)'}${r&&r[C('Stare')]!=='Publicată'?' <span class=flag>nu e pe site</span>':''}</span>${canPan()?'<button type="button" class="x" title="Scoate">×</button>':''}</div>`;}
function renderPanEdit(){
  const p=S.pe,ro=!canPan(),dis=ro?'disabled':'',adm=S.data.user.role==='admin';
  const inp=(k,lab,type,hint)=>`<label class="f">${lab}${hint?' · '+hint:''}<input data-p="${k}" type="${type||'text'}" value="${esc(p[k]||'')}" ${dis}></label>`;
  $('#app').innerHTML=`<p><button class="linkbtn" id="pback">← Înapoi la Editorial</button></p>
  <h2 style="font-weight:600;margin:6px 0 2px">${p.id?esc(p.title||p.guest||p.kind):'Panou nou'}</h2><p class="sub">${p.id?esc(p.id)+' · ':''}<span id="pstat"></span>${isProp(p)?' · propunere ('+esc(String(p.src).replace(/^propunere\s*·?\s*/i,'')||'automată')+'): verifică textul și cărțile, apoi pune „Pornit” și salvează':''}</p>
  <div class="sub" style="margin-top:10px">Așa arată pe prima pagină:</div><div id="pview"></div>
  <fieldset><legend>Pe site</legend><div class="seg" id="pact"><button type="button" data-a="1" aria-pressed="${!!p.active}" ${dis}>Pornit</button><button type="button" data-a="0" aria-pressed="${!p.active}" ${dis}>Oprit</button></div>
   <div class="grid" style="margin-top:10px">${inp('from','Afișare de la','date','gol = de acum')}${inp('to','Afișare până la','date','gol = până la eveniment')}</div>
   ${ro?'':`<div class="quick"><button type="button" class="linkbtn" data-q="w1">o săptămână de la început</button><button type="button" class="linkbtn" data-q="w2">două săptămâni</button><button type="button" class="linkbtn" data-q="ev">cu 2 săptămâni înainte, până la eveniment</button><button type="button" class="linkbtn" data-q="clr">golește</button></div>`}</fieldset>
  <fieldset><legend>Panou</legend><div class="grid">
   <label class="f">Tip<input data-p="kind" list="kinds" value="${esc(p.kind)}" ${dis}><datalist id="kinds">${KINDS.concat((S.panels||[]).map(x=>x.kind)).filter((v,i,a)=>v&&a.indexOf(v)===i).map(k=>`<option value="${esc(k)}">`).join('')}</datalist></label>
   <label class="f w">Titlu · la Meet the Book poate rămâne gol<input data-p="title" value="${esc(p.title)}" ${dis}></label>
   ${inp('guest','Invitat','text','apare ca „cu …”')}
   <label class="f w">Când · textul afișat, ex. „Duminică, 8 noiembrie, ora 12:00”<input data-p="when" value="${esc(p.when)}" ${dis}></label>
   ${inp('date','Data evenimentului','date')}${inp('end','Ultima zi','date','dacă ține mai multe zile')}
   <label class="f w">Text scurt (opțional)<textarea data-p="text" style="min-height:80px" ${dis}>${esc(p.text)}</textarea></label>
   <label class="f">Siglă finanțator · apare mică în panou<select data-p="logo" ${dis}><option value="">fără</option><option value="afcn" ${p.logo==='afcn'?'selected':''}>AFCN · proiect co-finanțat</option></select></label></div></fieldset>
  <fieldset><legend>Cărți din bibliotecă</legend><p class="sub" style="margin:0 0 6px" id="blim"></p>
   ${ro?'':'<div class="bsr"><input type="search" id="bq" placeholder="Caută după titlu, autor sau ID…" style="width:100%;padding:8px 10px;border:1px solid var(--rule);border-radius:9px"><div class="dd" id="bdd" hidden></div></div>'}
   <div class="bchips" id="bch">${p.books.map(bchip).join('')}</div></fieldset>
  <div class="savebar">${ro?'':'<button class="btn" id="psave">Salvează</button><button class="btn sec" id="pcancel">Renunță</button>'}${adm&&p.id?'<button class="linkbtn" id="pdel" style="margin-left:auto;color:var(--red)">Șterge panoul</button>':''}<span class="msg" id="pmsg"></span></div>`;
  const upd=()=>{readPan();const [c,t]=pStat(S.pe);$('#pstat').innerHTML=`<span class="pst ${c}">${t}</span> ${esc(pWin(S.pe))}`;$('#pview').innerHTML=pView(S.pe);const bl=$('#blim');if(bl)bl.textContent=bMax(S.pe)===0?'Fără cărți: cuvintele se scriu în „Text”.':S.pe.kind==='Cărți noi'?'Până la 12 cărți, în ordinea de aici.':bMax(S.pe)===1?'O singură carte.':'Cel mult 4. Apar cu coperta, în ordinea de aici.';};upd();
  document.querySelectorAll('[data-p]').forEach(i=>i.addEventListener('input',upd));
  $('#pback').onclick=()=>{if(!leaveOk())return;S.pe=null;renderPan();};
  if(ro)return;
  document.querySelectorAll('#pact button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#pact button').forEach(x=>x.setAttribute('aria-pressed',x===b));upd();});
  document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{readPan();const P=S.pe,st=P.date||P.from||today(),q=b.dataset.q;
    if(q==='w1'){P.from=P.from||st;P.to=addDays(P.from,6);}if(q==='w2'){P.from=P.from||st;P.to=addDays(P.from,13);}
    if(q==='ev'){if(!P.date){alert('Pune întâi data evenimentului.');return;}P.from=addDays(P.date,-14);P.to=P.end||P.date;}
    if(q==='clr'){P.from='';P.to='';}
    $('[data-p=from]').value=P.from;$('[data-p=to]').value=P.to;upd();});
  const bq=$('#bq'),dd=$('#bdd');
  const pick=id=>{readPan();if(S.pe.books.indexOf(id)<0){if(S.pe.books.length>=bMax(S.pe)){alert('Cel mult '+bMax(S.pe)+(bMax(S.pe)===1?' carte.':' cărți.'));return;}S.pe.books.push(id);}$('#bch').innerHTML=S.pe.books.map(bchip).join('');bindChips();upd();bq.value='';dd.hidden=true;bq.focus();};
  bq.addEventListener('input',()=>{const ws=norm(bq.value).split(/\s+/).filter(Boolean);if(!ws.length){dd.hidden=true;return;}
    const m=S.data.rows.filter(r=>{const h=norm([r[C('ID')],r[C('Titlu')],r[C('Fotograf / autor')]].join(' '));return ws.every(w=>h.includes(w));}).slice(0,12);
    dd.innerHTML=m.map(r=>{const u=coverUrl(r[C('Copertă')]);return `<button type="button" data-id="${esc(r[C('ID')])}">${u?`<img src="${esc(u)}" alt="">`:'<span style="width:26px"></span>'}<span><b>${esc(r[C('Titlu')])}</b> <span class="sub">${esc(r[C('Fotograf / autor')])} · ID ${esc(r[C('ID')])}${r[C('Stare')]!=='Publicată'?' · nu e pe site':''}</span></span></button>`;}).join('')||'<div class="sub" style="padding:8px 10px">Nimic găsit.</div>';
    dd.hidden=false;dd.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>pick(b.dataset.id));});
  bq.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const f=dd.querySelector('[data-id]');if(f)pick(f.dataset.id);}if(e.key==='Escape')dd.hidden=true;});

  bindChips();
  $('#pcancel').onclick=()=>{S.pe=JSON.parse(S.peOrig);renderPanEdit();};
  $('#psave').onclick=()=>{readPan();const P=S.pe;if(P.active&&/^propunere/i.test(P.src||''))P.src=String(P.src).replace(/^propunere\s*·?\s*/i,'')||'manual';
    if(P.from&&P.to&&P.to<P.from){$('#pmsg').className='msg err';$('#pmsg').textContent='„Afișare până la” e înainte de „Afișare de la”.';return;}

    $('#psave').disabled=true;$('#pmsg').className='msg';$('#pmsg').textContent='Se salvează…';
    call('savePanel',P).then(r=>{const i=S.panels.findIndex(x=>x.id===r.id);if(i>=0)S.panels[i]=r;else S.panels.push(r);S.pe=null;renderPan();toast('Salvat · pe site în câteva minute');})
    .catch(e=>{$('#psave').disabled=false;$('#pmsg').className='msg err';$('#pmsg').textContent=e.message||String(e);});};
  const del=$('#pdel');if(del)del.onclick=()=>{if(!confirm('Ștergi definitiv panoul? Dacă vrei doar să nu mai apară, apasă „Oprit”.'))return;
    call('deletePanel',S.pe.id).then(()=>{S.panels=S.panels.filter(x=>x.id!==S.pe.id);S.pe=null;renderPan();toast('Panou șters');}).catch(e=>alert(e.message||e));};

const bMax=p=>p.kind==='Sugestii căutare'?0:p.kind==='Cărți noi'?12:(p.kind==='Meet the Book'||p.kind==='Cartea săptămânii')?1:4;
function pView(p){

    return `<div class="pv" style="grid-template-columns:1fr;background:#fff"><div><span class="w">Încearcă:</span> ${w.map(x=>`<span style="display:inline-block;border:1px solid var(--ink);border-radius:999px;padding:3px 12px;margin:4px 4px 0 0;font-size:14px">${esc(x)}</span>`).join('')||'<span class=sub>scrie cuvintele în „Text”, despărțite prin virgulă</span>'}<p class="sub" style="font-size:13px">Apar primele în „Încearcă”, pe calculator, cât e pornit panoul. Restul se completează singur din panouri și din catalog.</p></div></div>`;}
  if(p.kind==='Cartea săptămânii'||p.kind==='Cărți noi'){const bks=(p.books||[]).map(bookRow).filter(Boolean).slice(0,bMax(p));
    return `<div class="pv" style="grid-template-columns:1fr;background:#fff"><div><div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px"><h3 style="margin:0">${esc(p.kind)}</h3><span class="w">${esc(p.when||'')}</span></div>
      ${p.text?`<p>${esc(p.text)}</p>`:''}${bks.length?'':'<div class="bl sub">Alege '+(p.kind==='Cărți noi'?'cărțile':'cartea')+'</div>'}</div>
      <div class="cv" style="flex-wrap:wrap">${bks.map(r=>{const u=coverUrl(r[C('Copertă')]);return `<div style="width:${p.kind==='Cărți noi'?96:150}px;font-size:12px">${u?`<img src="${esc(u)}" alt="" style="height:${p.kind==='Cărți noi'?120:200}px;max-width:100%">`:''}<div style="margin-top:6px">${esc(r[C('Titlu')])}</div></div>`;}).join('')}</div></div>`;}
const bks=(p.books||[]).map(bookRow).filter(Boolean).slice(0,p.kind==='Meet the Book'?1:4);
  const head=p.title||String(p.kind||'').split(' · ')[0];
  return `<div class="pv"><div><div>${p.title?`<span class="k">${esc(p.kind)}</span>`:''}<span class="w">${esc(p.when||'')}</span></div>
   <h3>${esc(head)||'<span class=sub>(titlu)</span>'}</h3>${p.guest?`<div class="g">cu ${esc(p.guest)}</div>`:''}${p.text?`<p>${esc(p.text)}</p>`:''}
   ${bks.length?`<div class="bl"><span class="sub">${p.kind==='Meet the Book'?'Cartea prezentată':'Din bibliotecă'}</span>${bks.map(r=>`<div>${esc(r[C('Titlu')])} <span class="sub">${esc(String(r[C('Fotograf / autor')]).split(';')[0])}${r[C('Raft')]?' · raft '+esc(r[C('Raft')]):''}</span></div>`).join('')}</div>`:'<div class="bl sub">Fără cărți legate</div>'}</div>
   <div class="cv">${bks.map(r=>{const u=coverUrl(r[C('Copertă')]);return u?`<img src="${esc(u)}" alt="">`:'';}).join('')}</div></div>`;}
function readPan(){if(!S.pe||!$('[data-p=kind]'))return;document.querySelectorAll('[data-p]').forEach(i=>S.pe[i.dataset.p]=i.value.trim());
  const a=document.querySelector('#pact button[aria-pressed=true]');if(a)S.pe.active=a.dataset.a==='1';
  S.pe.books=[...document.querySelectorAll('#bch [data-b]')].map(x=>x.dataset.b);}

/* ---------- selecții ---------- */
function selDirty(){if(!S.se||!$('#ssave'))return false;readSel();return JSON.stringify(S.se)!==S.seOrig;}
function readSel(){if(!S.se||!$('[data-s=title]'))return;document.querySelectorAll('[data-s]').forEach(i=>S.se[i.dataset.s]=i.value.trim());
  const a=document.querySelector('#sact button[aria-pressed=true]');if(a)S.se.show=a.dataset.a==='1';
  S.se.books=[...document.querySelectorAll('#sch [data-b]')].map(x=>x.dataset.b);}
function selCover(id){const r=bookRow(id);return r?coverUrl(r[C('Copertă')]):'';}
function renderSel(){
  if(S.se)return renderSelEdit();
  if(!S.sels){$('#app').innerHTML='<div class="load">Se încarcă selecțiile…</div>';
    call('getSelections').then(p=>{S.sels=p;renderSel();}).catch(e=>{const m=String(e.message||e);
      $('#app').innerHTML='<div class="load msg err">'+(/getSelections|not found|nu a fost găsit|Script function/i.test(m)?'Selecțiile cer versiunea nouă a scriptului. Cere-i lui Alex să o publice.':esc(m))+'</div>';});return;}
  const L=S.sels;
  $('#app').innerHTML=`<div class="tools"><h2 class="pg" style="margin:0">Selecții</h2><span class="sub">Grupurile de cărți de pe prima pagină, în ordinea de aici. Pe site în câteva minute.</span>${canPan()?'<button class="btn" id="sadd" style="margin-left:auto">+ Selecție nouă</button>':''}</div>
  <table><thead><tr><th>Stare</th><th>Selecție</th><th class="hide-m">Coperți</th><th>Cărți</th><th></th></tr></thead><tbody>
  ${L.map((p,k)=>`<tr class="selrow"><td><span class="pst ${p.show?'on':'off'}">${p.show?'Pe site':'Ascunsă'}</span></td>
   <td><div class="t">${esc(p.title)}</div><div class="sub">${esc(p.sub)} · ${esc(p.id)}</div></td>
   <td class="hide-m"><div class="cv">${p.books.slice(0,3).map(id=>{const u=selCover(id);return u?`<img src="${esc(u)}" alt="">`:'';}).join('')}</div></td>
   <td class="sub">${p.books.length}${p.books.filter(id=>{const r=bookRow(id);return !r||r[C('Stare')]!=='Publicată';}).length?' <span class="flag">unele nu sunt pe site</span>':''}</td>
   <td style="white-space:nowrap;text-align:right">${canPan()?`<button class="linkbtn" data-su="${k}" ${k?'':'disabled'}>↑</button> <button class="linkbtn" data-sd="${k}" ${k<L.length-1?'':'disabled'}>↓</button> · <button class="linkbtn" data-st="${esc(p.id)}">${p.show?'Ascunde':'Arată'}</button> · <button class="linkbtn" data-se="${esc(p.id)}">Editează</button>`:`<button class="linkbtn" data-se="${esc(p.id)}">Vezi</button>`}</td></tr>`).join('')||'<tr><td colspan="5" class="sub">Nicio selecție.</td></tr>'}</tbody></table>`;
  const P=id=>S.sels.find(p=>p.id===id);
  document.querySelectorAll('[data-se]').forEach(b=>b.onclick=()=>openSel(JSON.parse(JSON.stringify(P(b.dataset.se)))));
  document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{const p=JSON.parse(JSON.stringify(P(b.dataset.st)));p.show=!p.show;b.disabled=true;
    call('saveSelection',p).then(r=>{S.sels=S.sels.map(x=>x.id===r.id?r:x);renderSel();toast(r.show?'Pe site':'Ascunsă');}).catch(e=>{alert(e.message||e);renderSel();});});
  const mv=(k,d)=>{const L2=S.sels.slice();const [x]=L2.splice(k,1);L2.splice(k+d,0,x);S.sels=L2;renderSel();
    call('orderSelections',L2.map(x=>x.id)).then(r=>{S.sels=r;renderSel();}).catch(e=>{alert(e.message||e);S.sels=null;renderSel();});};
  document.querySelectorAll('[data-su]').forEach(b=>b.onclick=()=>mv(+b.dataset.su,-1));
  document.querySelectorAll('[data-sd]').forEach(b=>b.onclick=()=>mv(+b.dataset.sd,1));
  const a=$('#sadd');if(a)a.onclick=()=>openSel({id:'',show:true,title:'',sub:'',books:[],order:0});
}
function openSel(p){S.se=p;S.seOrig=JSON.stringify(p);renderSel();window.scrollTo(0,0);}
function schip(id){const r=bookRow(id);const u=r?coverUrl(r[C('Copertă')]):'';return `<div class="bchip" data-b="${esc(id)}">${u?`<img src="${esc(u)}" alt="">`:''}<span>${r?esc(r[C('Titlu')]):'ID '+esc(id)+' (nu există)'}${r&&r[C('Stare')]!=='Publicată'?' <span class=flag>nu e pe site</span>':''}</span>${canPan()?'<span class="mv"><button type="button" class="up" title="Mai sus">▲</button><button type="button" class="dn" title="Mai jos">▼</button></span><button type="button" class="x" title="Scoate">×</button>':''}</div>`;}
function renderSelEdit(){
  const p=S.se,ro=!canPan(),dis=ro?'disabled':'',adm=S.data.user.role==='admin';
  $('#app').innerHTML=`<p><button class="linkbtn" id="sback">← Înapoi la Selecții</button></p>
  <h2 style="font-weight:600;margin:6px 0 2px">${p.id?esc(p.title):'Selecție nouă'}</h2><p class="sub">${p.id?esc(p.id)+' · ':''}Primele trei cărți apar pe coperta selecției de pe prima pagină.</p>
  <fieldset><legend>Pe site</legend><div class="seg" id="sact"><button type="button" data-a="1" aria-pressed="${!!p.show}" ${dis}>Vizibilă</button><button type="button" data-a="0" aria-pressed="${!p.show}" ${dis}>Ascunsă</button></div></fieldset>
  <fieldset><legend>Selecție</legend><div class="grid">
   <label class="f w">Titlu<input data-s="title" value="${esc(p.title)}" ${dis}></label>
   <label class="f w">Subtitlu · o explicație scurtă, ex. „Albume apărute în România”<input data-s="sub" value="${esc(p.sub)}" ${dis}></label></div></fieldset>
  <fieldset><legend>Cărți</legend><p class="sub" style="margin:0 0 6px">În ordinea de aici. Primele trei dau coperta selecției; evită să începi cu aceleași cărți ca selecția vecină.</p>
   ${ro?'':'<div class="bsr"><input type="search" id="sq" placeholder="Caută după titlu, autor sau ID…" style="width:100%;padding:8px 10px;border:1px solid var(--rule);border-radius:9px"><div class="dd" id="sdd" hidden></div></div>'}
   <div class="bchips" id="sch">${p.books.map(schip).join('')}</div></fieldset>
  <div class="savebar">${ro?'':'<button class="btn" id="ssave">Salvează</button><button class="btn sec" id="scancel">Renunță</button>'}${adm&&p.id?'<button class="linkbtn" id="sdel" style="margin-left:auto;color:var(--red)">Șterge selecția</button>':''}<span class="msg" id="smsg"></span></div>
  <div class="rail" style="margin-top:16px"><div class="box" id="selwarn" hidden></div></div>`;
  $('#sback').onclick=()=>{if(!leaveOk())return;S.se=null;renderSel();};
  if(ro)return;
  document.querySelectorAll('#sact button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#sact button').forEach(x=>x.setAttribute('aria-pressed',x===b));});
  const bq=$('#sq'),dd=$('#sdd');
  const warn=()=>{const w=$('#selwarn');if(!w)return;readSel();const me=S.se,L=(S.sels||[]).filter(x=>x.show&&x.id!==me.id),i=S.sels?S.sels.findIndex(x=>x.id===me.id):-1,nb=[S.sels&&S.sels[i-1],S.sels&&S.sels[i+1]].filter(Boolean);
    const top=me.books.slice(0,3),hits=nb.map(x=>({t:x.title,c:x.books.slice(0,3).filter(b=>top.indexOf(b)>=0)})).filter(x=>x.c.length);
    if(!hits.length){w.hidden=true;return;}w.hidden=false;w.innerHTML='<h3 class="sec">Atenție</h3>'+hits.map(h=>`Selecția vecină „${esc(h.t)}” arată pe copertă aceleași cărți: ${h.c.map(id=>{const r=bookRow(id);return '<i>'+esc(r?r[C('Titlu')]:id)+'</i>';}).join(', ')}. Site-ul le sare automat, dar mai bine mută-le mai jos aici.`).join('<br>');};
  const redraw=()=>{$('#sch').innerHTML=S.se.books.map(schip).join('');bindChips();warn();};warn();
  const pick=id=>{readSel();if(S.se.books.indexOf(id)<0)S.se.books.push(id);redraw();bq.value='';dd.hidden=true;bq.focus();};
  bq.addEventListener('input',()=>{const ws=norm(bq.value).split(/\s+/).filter(Boolean);if(!ws.length){dd.hidden=true;return;}
    const m=S.data.rows.filter(r=>{const h=norm([r[C('ID')],r[C('Titlu')],r[C('Fotograf / autor')]].join(' '));return ws.every(w=>h.includes(w));}).slice(0,12);
    dd.innerHTML=m.map(r=>{const u=coverUrl(r[C('Copertă')]);return `<button type="button" data-id="${esc(r[C('ID')])}">${u?`<img src="${esc(u)}" alt="">`:'<span style="width:26px"></span>'}<span><b>${esc(r[C('Titlu')])}</b> <span class="sub">${esc(r[C('Fotograf / autor')])} · ID ${esc(r[C('ID')])}${r[C('Stare')]!=='Publicată'?' · nu e pe site':''}</span></span></button>`;}).join('')||'<div class="sub" style="padding:8px 10px">Nimic găsit.</div>';
    dd.hidden=false;dd.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>pick(b.dataset.id));});
  bq.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const f=dd.querySelector('[data-id]');if(f)pick(f.dataset.id);}if(e.key==='Escape')dd.hidden=true;});
  function bindChips(){document.querySelectorAll('#sch .x').forEach(x=>x.onclick=()=>{readSel();const id=x.closest('[data-b]').dataset.b;S.se.books=S.se.books.filter(b=>b!==id);redraw();});
    document.querySelectorAll('#sch .up,#sch .dn').forEach(x=>x.onclick=()=>{readSel();const id=x.closest('[data-b]').dataset.b,B=S.se.books,i=B.indexOf(id),j=x.classList.contains('up')?i-1:i+1;if(j<0||j>=B.length)return;B.splice(i,1);B.splice(j,0,id);redraw();});}
  bindChips();
  $('#scancel').onclick=()=>{S.se=JSON.parse(S.seOrig);renderSelEdit();};
  $('#ssave').onclick=()=>{readSel();const P=S.se;
    if(!P.title){$('#smsg').className='msg err';$('#smsg').textContent='Pune un titlu.';return;}
    if(P.show&&P.books.length<3){$('#smsg').className='msg err';$('#smsg').textContent='O selecție vizibilă are nevoie de cel puțin 3 cărți.';return;}
    $('#ssave').disabled=true;$('#smsg').className='msg';$('#smsg').textContent='Se salvează…';
    call('saveSelection',P).then(r=>{const i=S.sels.findIndex(x=>x.id===r.id);if(i>=0)S.sels[i]=r;else S.sels.push(r);S.se=null;renderSel();toast('Salvat · pe site în câteva minute');})
    .catch(e=>{$('#ssave').disabled=false;$('#smsg').className='msg err';$('#smsg').textContent=e.message||String(e);});};
  const del=$('#sdel');if(del)del.onclick=()=>{if(!confirm('Ștergi definitiv selecția? Dacă vrei doar să nu mai apară, pune „Ascunsă”.'))return;
    call('deleteSelection',S.se.id).then(()=>{S.sels=S.sels.filter(x=>x.id!==S.se.id);S.se=null;renderSel();toast('Selecție ștearsă');}).catch(e=>alert(e.message||e));};
}


function inviteMail(u){const me=S.data.user,app=S.data.app||location.href.split('?')[0],first=(u.name||'').split(' ')[0];
  const can=(ROLE_CAN[u.role]||[]).map(x=>x.charAt(0)==='§'?'\n'+x.slice(1).toUpperCase():'- '+x).join('\n').replace(/^\n/,'');
  const body=`Bună, ${first},

Ți-am făcut cont în adminul bibliotecii CdRF, cu rol de ${u.role}.

Intri de aici, cu contul Google ${u.email}:
${app}

Apeși „Intră cu Google” și alegi contul de mai sus. Prima dată Google îți cere să confirmi accesul aplicației „Biblioteca CdRF”.

Ce poți face cu contul tău:
${can}

Dacă nu merge ceva, scrie-mi.

${me.name}`;
  const subj='Acces la adminul bibliotecii CdRF';
  const url='https:'+DS+'mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(u.email)+'&su='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);
  const w=window.open(url,'_blank');if(!w){prompt('Browserul a blocat fereastra. Copiază adresa și deschide-o tu:',url);}
}

/* sigla și fontul Inter vin de pe site (adresele se compun aici, nu în CSS: Apps Script taie textul de după două bare oblice) */
function brandInit(site){const lg=$('#logo');if(lg&&!lg.src)lg.src=site+'brand/logo-negru.png';if($('#ffont'))return;
  const st=document.createElement('style');st.id='ffont';
  st.textContent='@font-face{font-family:"Inter";src:url('+site+'fonts/inter-latin-ext-opsz-normal.woff2) format("woff2");font-weight:100 900;font-display:swap;unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0}@font-face{font-family:"Inter";src:url('+site+'fonts/inter-latin-opsz-normal.woff2) format("woff2");font-weight:100 900;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}';
  document.head.appendChild(st);}
/* ---------- utilizatori ---------- */
const ROLE_LAB={admin:'Admin · vede tot, publică, aprobă modificările, administrează utilizatorii',editor:'Editor · adaugă și editează cărți nepublicate, propune modificări la cele publicate, lucrează la panouri și selecții',vizitator:'Vizitator · doar vede catalogul în admin, nu poate schimba nimic'};
function renderUsers(){
  if(!S.users){$('#app').innerHTML='<div class="load">Se încarcă utilizatorii…</div>';call('getUsers').then(u=>{S.users=u;renderUsers();}).catch(e=>{$('#app').innerHTML='<div class="load msg err">'+esc(e.message||e)+'</div>';});return;}
  const U=S.users,ed=S.ue;
  $('#app').innerHTML=`<div class="tools"><h2 class="pg" style="margin:0">Utilizatori</h2><span class="sub">Cine intră în admin, cu contul Google, și ce poate face.</span><button class="btn" id="uadd" style="margin-left:auto">+ Utilizator nou</button></div>
  <div class="two"><div><table><thead><tr><th>Nume</th><th>E-mail (cont Google)</th><th>Rol</th><th>Stare</th><th></th></tr></thead><tbody>${U.map(u=>`<tr style="${u.active?'':'opacity:.55'}"><td><div class="t">${esc(u.name)}${u.me?' <span class="sub">(tu)</span>':''}</div></td><td class="sub">${esc(u.email)}</td><td><span class="pst ${u.role==='admin'?'on':u.role==='editor'?'pl':'off'}">${esc(u.role)}</span></td><td class="sub" style="white-space:nowrap">${u.active?(u.online?'<span class="pst on">conectat</span>':'activ'):'<span class="pst off">dezactivat</span>'}${u.last?`<div class="sub">ultima intrare ${esc(u.last)}</div>`:'<div class="sub">n-a intrat încă</div>'}</td><td style="text-align:right;white-space:nowrap">${u.me?'':`<button class="linkbtn" data-ui="${esc(u.email)}">Trimite invitația</button> · `}<button class="linkbtn" data-ue="${esc(u.email)}">Editează</button>${u.me?'':` · <button class="linkbtn" data-ua="${esc(u.email)}" data-on="${u.active?'0':'1'}">${u.active?'Dezactivează':'Reactivează'}</button> · <button class="linkbtn" data-ud="${esc(u.email)}">Șterge</button>`}</td></tr>`).join('')}</tbody></table><p class="sub">Dezactivat = rămâne în listă, dar nu mai poate intra; îl poți reactiva oricând. „Conectat” = are o sesiune deschisă acum.</p></div>
  <div>${ed?`<div class="rail"><div class="box"><h3 class="sec">${ed.isNew?'Utilizator nou':'Editează'}</h3><div class="grid" style="grid-template-columns:1fr">
   <label class="f">Nume<input id="uname" value="${esc(ed.name||'')}"></label>
   <label class="f">E-mail · exact contul Google cu care intră<input id="uemail" value="${esc(ed.email||'')}" ${ed.isNew?'':'readonly'}></label>
   <div class="f">Rol<div class="seg" id="urole" style="margin-top:4px">${Object.keys(ROLE_LAB).map(r=>`<button type="button" data-r="${r}" aria-pressed="${(ed.role||'editor')===r}">${r}</button>`).join('')}</div></div>
   <div class="sub" id="uhint">${ROLE_LAB[ed.role||'editor']}</div></div>
   <div class="savebar" style="position:static;border:0;padding:8px 0 0"><button class="btn" id="usave">Salvează</button><button class="btn sec" id="ucancel">Renunță</button><span class="msg" id="umsg"></span></div></div></div>`:`<div class="rail"><div class="box"><h3 class="sec">Roluri</h3>${Object.keys(ROLE_CAN).map(r=>`<div style="padding:6px 0"><b>${r}</b><ul style="margin:4px 0 0;padding-left:18px;font-size:13px">${roleLines(ROLE_CAN[r])}</ul></div>`).join('')}<div class="sub" style="margin-top:8px">Un utilizator nou intră cu „Intră cu Google”, cu adresa de aici. Dacă nu are cont Google pe acea adresă, nu poate intra.</div></div></div>`}</div></div>`;
  $('#uadd').onclick=()=>{S.ue={isNew:true,role:'editor'};renderUsers();};
  document.querySelectorAll('[data-ue]').forEach(b=>b.onclick=()=>{S.ue=Object.assign({},U.find(u=>u.email===b.dataset.ue));renderUsers();});
  document.querySelectorAll('[data-ui]').forEach(b=>b.onclick=()=>inviteMail(U.find(u=>u.email===b.dataset.ui)));
  document.querySelectorAll('[data-ua]').forEach(b=>b.onclick=()=>{const on=b.dataset.on==='1';if(!on&&!confirm('Dezactivezi contul '+b.dataset.ua+'? Nu va mai putea intra până nu îl reactivezi.'))return;call('setUserActive',b.dataset.ua,on).then(u=>{S.users=u;renderUsers();toast(on?'Reactivat':'Dezactivat');}).catch(e=>alert(e.message||e));});
  document.querySelectorAll('[data-ud]').forEach(b=>b.onclick=()=>{if(!confirm('Scoți accesul pentru '+b.dataset.ud+'?'))return;call('deleteUser',b.dataset.ud).then(u=>{S.users=u;S.ue=null;renderUsers();toast('Acces scos');}).catch(e=>alert(e.message||e));});
  if(!ed)return;
  document.querySelectorAll('#urole button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#urole button').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#uhint').textContent=ROLE_LAB[b.dataset.r];});
  $('#ucancel').onclick=()=>{S.ue=null;renderUsers();};
  $('#usave').onclick=()=>{const u={name:$('#uname').value.trim(),email:$('#uemail').value.trim(),role:document.querySelector('#urole button[aria-pressed=true]').dataset.r};
    $('#usave').disabled=true;$('#umsg').className='msg';$('#umsg').textContent='Se salvează…';
    call('saveUser',u).then(list=>{const isNew=!!S.ue.isNew;S.users=list;S.ue=null;renderUsers();toast('Salvat');if(isNew&&confirm('Cont făcut. Îi trimiți acum invitația prin Gmail?'))inviteMail(list.find(x=>x.email===u.email)||u);}).catch(e=>{$('#usave').disabled=false;$('#umsg').className='msg err';$('#umsg').textContent=e.message||String(e);});};
}
</script>
