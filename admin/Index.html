<!DOCTYPE html>
<html lang="ro">
<head>
<base target="_top">
<!--BOOT-->
<meta charset="utf-8">
<style>
:root{--ink:#111;--muted:#6b6b70;--rule:#e4e4e7;--soft:#f5f5f6;--red:#dc0b1c;--ok:#1b7f3b;--warn:#b26b00;--f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--f);color:var(--ink);background:#fff;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--rule)}
.bar{display:flex;align-items:center;gap:14px;padding:10px 18px;max-width:1280px;margin:0 auto}
.logo{width:22px;height:22px;border:4px solid var(--red);flex:none}
.bar b{font-weight:600}
.tabs{display:flex;gap:4px;margin-left:12px}
.tabs button{border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--muted)}
.tabs button[aria-current=true]{background:var(--soft);color:var(--ink);font-weight:600}
.who{margin-left:auto;color:var(--muted);font-size:13px;text-align:right}
main{max-width:1280px;margin:0 auto;padding:18px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.tools input[type=search]{flex:1 1 260px;padding:9px 12px;border:1px solid var(--rule);border-radius:10px}
select{padding:8px 10px;border:1px solid var(--rule);border-radius:10px;background:#fff}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:8px 14px;border-radius:10px;cursor:pointer}
.btn.sec{background:#fff;color:var(--ink);border-color:var(--rule)}
.btn:disabled{opacity:.4;cursor:default}
.count{color:var(--muted);font-size:13px;margin-left:auto}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.stats span{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--soft);cursor:pointer}
.stats span.on{background:var(--ink);color:#fff}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule)}
td{padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:middle}
tr.rw{cursor:pointer}
tr.rw:hover{background:var(--soft)}
td.th img{width:44px;height:56px;object-fit:contain;display:block;background:#fff}
.t{font-weight:500}
.sub{color:var(--muted);font-size:13px}
.st{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap}
.st.c{background:#eee;color:#555}.st.l{background:#fff4e0;color:var(--warn)}.st.g{background:#e7f0ff;color:#1d4fb8}.st.p{background:#e6f5ea;color:var(--ok)}
.ok{color:var(--ok);font-size:13px}
.flag{color:var(--red);font-size:12px}
@media(max-width:760px){.hide-m{display:none}.bar{flex-wrap:wrap}.who{width:100%;text-align:left;margin:0}.tabs{margin-left:0}}
/* fișa */
.rec{display:grid;grid-template-columns:260px 1fr;gap:28px}
@media(max-width:860px){.rec{grid-template-columns:1fr}}
.cov{position:sticky;top:76px;align-self:start}
.cov img{width:100%;max-height:360px;object-fit:contain;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.cov .ph{height:260px;border:1px dashed var(--rule);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;text-align:center;padding:12px}
fieldset{border:0;border-top:1px solid var(--rule);margin:0 0 6px;padding:14px 0 6px}
legend{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding-right:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 14px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
label.f.w{grid-column:1/-1}
label.f input,label.f select,label.f textarea{font-size:15px;color:var(--ink);padding:8px 10px;border:1px solid var(--rule);border-radius:9px;background:#fff;width:100%}
label.f textarea{min-height:150px;resize:vertical;line-height:1.5}
label.f input[readonly]{background:var(--soft)}
.chg{border-color:#e8a33d!important;background:#fffaf0!important}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--rule);background:#fff;padding:6px 12px;border-radius:999px;cursor:pointer;font-size:14px}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.contrib .r{display:flex;gap:6px;margin-bottom:6px}
.contrib input{flex:1;padding:7px 10px;border:1px solid var(--rule);border-radius:9px}
.contrib select{flex:0 0 160px}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;padding:0 6px}
.linkbtn{border:0;background:none;color:var(--ink);text-decoration:underline;cursor:pointer;padding:0;font-size:14px}
.savebar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--rule);padding:10px 0;display:flex;gap:10px;align-items:center;margin-top:10px}
.msg{font-size:13px;color:var(--muted)}
.msg.err{color:var(--red)}
.hist{font-size:13px;color:var(--muted)}
.hist div{padding:6px 0;border-bottom:1px solid var(--rule);word-break:break-word}
.hist del{background:#fde2e2;color:#a40000;text-decoration:line-through}
.hist ins{background:#dcf5e3;color:#14692f;text-decoration:none}
/* inventar */
.inv li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule);list-style:none}
.inv ul{padding:0;margin:0}
.inv input[type=checkbox]{width:22px;height:22px;flex:none}
.inv img{width:40px;height:50px;object-fit:contain;flex:none}
.inv .done .t{color:var(--muted)}
.load{padding:40px 0;color:var(--muted)}
/* panouri */
.pst{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pst.on{background:#e6f5ea;color:var(--ok)}.pst.pl{background:#e7f0ff;color:#1d4fb8}.pst.off{background:#eee;color:#555}.pst.ex{background:#f5f5f6;color:#999}.pst.pr{background:#fff4e0;color:var(--warn)}
.pv{border:1px solid var(--rule);border-radius:14px;background:#eceeec;padding:22px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;margin:8px 0 4px}
.pv .k{display:inline-block;border:1px solid var(--ink);border-radius:999px;padding:2px 10px;font-size:13px;margin-right:8px}.pv .w{color:var(--muted);font-size:13px}
.pv h3{font-size:30px;line-height:1.05;font-weight:400;margin:10px 0 4px;letter-spacing:-.01em}.pv .g{color:var(--muted);font-size:18px}.pv p{margin:8px 0 0;font-size:14px}
.pv .bl{margin-top:12px;font-size:13px}.pv .bl div{margin-top:3px}.pv .cv{display:flex;gap:10px;align-items:flex-end}.pv .cv img{height:120px;max-width:110px;object-fit:contain;box-shadow:0 6px 14px -6px rgba(0,0,0,.35);background:#fff}
@media(max-width:760px){.pv{grid-template-columns:1fr}.pv .cv img{height:90px}}
tr.pr td{vertical-align:top}
.pk{font-size:12px;color:var(--muted)}
.bchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.bchip{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:10px;padding:4px 6px 4px 4px;max-width:340px;font-size:13px}
.bchip img{width:30px;height:38px;object-fit:contain;background:#fff;flex:none}
.bchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bsr{position:relative}
.bsr .dd{position:absolute;left:0;right:0;top:100%;z-index:4;background:#fff;border:1px solid var(--rule);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:320px;overflow:auto}
.bsr .dd button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:6px 10px;cursor:pointer}
.bsr .dd button:hover,.bsr .dd button:focus{background:var(--soft)}
.bsr .dd img{width:26px;height:34px;object-fit:contain;flex:none}
.quick{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<header><div class="bar"><span class="logo"></span><b>Biblioteca CdRF</b>
<nav class="tabs"><button data-view="list" aria-current="true">Cărți</button><button data-view="inv">Inventar pe raft</button><button data-view="pan">Editorial</button></nav>
<div class="who" id="who"></div></div></header>
<main id="app"><div class="load">Se încarcă…</div></main>
<div class="toast" id="toast"></div>
<script>
const S={view:'list',q:'',stare:'',raft:'',tip:'',noshelf:false,rec:null,orig:null,data:null,invRaft:''};
const STARI=['Ciornă','În lucru','Gata de publicare','Publicată'];
const stCls=s=>({'Ciornă':'c','În lucru':'l','Gata de publicare':'g','Publicată':'p'}[s]||'c');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const $=s=>document.querySelector(s);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200);}
const SKEY='bib.session';
function getSess(){try{return localStorage.getItem(SKEY)||''}catch(e){return ''}}
function setSess(v){try{v?localStorage.setItem(SKEY,v):localStorage.removeItem(SKEY)}catch(e){}}
function raw(fn,...a){return new Promise((ok,ko)=>google.script.run.withSuccessHandler(ok).withFailureHandler(ko)[fn](...a));}
function call(fn,...a){return raw(fn,getSess(),...a).catch(e=>{if(String(e&&e.message||e).indexOf('AUTH')>=0&&window.BOOT&&BOOT.google){setSess('');showLogin();return new Promise(()=>{});}throw e;});}
function showLogin(msg){
  $('#who').textContent='';
  $('#app').innerHTML=`<div style="max-width:420px;margin:60px auto;text-align:center"><h2 style="font-weight:600">Biblioteca CdRF</h2>
  <p class="sub">Intră cu contul Google pe care ți l-a adăugat Alex.</p>${msg?`<p class="msg err">${esc(msg)}</p>`:''}
  <p><a class="btn" id="gl" href="#" target="_top" style="display:inline-block;text-decoration:none;pointer-events:none;opacity:.5">Se pregătește…</a></p></div>`;
  raw('beginLogin').then(u=>{const a=$('#gl');a.href=u;a.textContent='Intră cu Google';a.style.pointerEvents='';a.style.opacity='';}).catch(e=>{$('#gl').textContent=e.message||String(e);});
}
function logout(){raw('logout',getSess()).finally(()=>{setSess('');showLogin();});}
function coverUrl(v){v=String(v||'');if(v.startsWith('covers/'))return S.data.site+v;if(v.startsWith('wix:'))return 'https://static.wixstatic.com/media/'+v.slice(4)+'/v1/fit/w_300,h_300/c.jpg';if(/^https?:/.test(v))return v;return '';}
const C=k=>S.data.cols.indexOf(k);

function start(){call('getInit').then(d=>{S.data=d;$('#who').innerHTML=esc(d.user.name)+' · '+(d.user.role==='admin'?'admin':'editor')+(window.BOOT&&BOOT.google?' · <button class="linkbtn" id="lo" style="font-size:13px">Ieși</button>':'');const lo=$('#lo');if(lo)lo.onclick=logout;route();}).catch(e=>{$('#app').innerHTML='<div class="load msg err">'+esc(e.message||e)+'</div>';});}
(function boot(){const B=window.BOOT||{};
  if(B.error)return showLogin(B.error);
  if(B.code&&B.state&&getSess())return start();
  if(B.code&&B.state){$('#app').innerHTML='<div class="load">Se verifică contul…</div>';
    raw('finishLogin',B.code,B.state).then(r=>{setSess(r.session);start();}).catch(e=>showLogin(e.message||String(e)));return;}
  if(B.google&&!getSess())return showLogin();
  start();})();
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(!b)return;if(!leaveOk())return;S.view=b.dataset.view;S.rec=null;S.pe=null;route();});
window.addEventListener('beforeunload',e=>{if(dirty()||panDirty()){e.preventDefault();e.returnValue='';}});

function route(){document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.view===S.view&&!S.rec));if(S.rec)return renderRec();if(S.view==='pan')return renderPan();if(S.view==='inv')return renderInv();renderList();}

/* ---------- listă ---------- */
function filtered(){const ws=norm(S.q).split(/\s+/).filter(Boolean);return S.data.rows.filter(r=>{
  if(S.stare&&r[C('Stare')]!==S.stare)return false;
  if(S.raft&&r[C('Raft')]!==S.raft)return false;
  if(S.tip&&r[C('Tip')]!==S.tip)return false;
  if(S.noshelf&&r[C('Verificat la raft')])return false;
  if(ws.length){const h=norm(r.join(' '));if(!ws.every(w=>h.includes(w)))return false;}
  return true;});}
function renderList(){
  const d=S.data,L=d.lists,rows=filtered();
  const cnt={};d.rows.forEach(r=>cnt[r[C('Stare')]]=(cnt[r[C('Stare')]]||0)+1);
  const opt=(arr,val,lab)=>`<option value="">${lab}</option>`+arr.map(v=>`<option ${v===val?'selected':''}>${esc(v)}</option>`).join('');
  $('#app').innerHTML=`
  <div class="stats">${STARI.map(s=>`<span data-stare="${s}" class="${S.stare===s?'on':''}">${s} · ${cnt[s]||0}</span>`).join('')}</div>
  <div class="tools"><input type="search" id="q" placeholder="Caută: titlu, autor, ISBN, ID…" value="${esc(S.q)}">
  <select id="fraft">${opt(L['Raft']||[],S.raft,'Toate rafturile')}</select>
  <select id="ftip">${opt(L['Tip']||[],S.tip,'Toate tipurile')}</select>
  <label class="sub"><input type="checkbox" id="fno" ${S.noshelf?'checked':''}> neverificate la raft</label>
  <button class="btn" id="add">+ Carte nouă</button><span class="count">${rows.length} din ${d.rows.length}</span></div>
  <table><thead><tr><th></th><th>Carte</th><th class="hide-m">An</th><th class="hide-m">Raft</th><th class="hide-m">La raft</th><th>Stare</th></tr></thead>
  <tbody>${rows.slice(0,300).map(r=>{const u=coverUrl(r[C('Copertă')]);return `<tr class="rw" data-id="${esc(r[C('ID')])}"><td class="th">${u?`<img loading="lazy" src="${esc(u)}" alt="">`:''}</td>
  <td><div class="t">${esc(r[C('Titlu')])||'<span class=sub>(fără titlu)</span>'}</div><div class="sub">${esc(r[C('Fotograf / autor')])} · ID ${esc(r[C('ID')])}${r[C('Copertă de verificat')]?' <span class=flag>copertă de verificat</span>':''}</div></td>
  <td class="hide-m">${esc(r[C('An')])}</td><td class="hide-m">${esc(r[C('Raft')])}</td><td class="hide-m">${r[C('Verificat la raft')]?'<span class=ok>✓</span>':''}</td>
  <td><span class="st ${stCls(r[C('Stare')])}">${esc(r[C('Stare')])}</span></td></tr>`}).join('')}</tbody></table>
  ${rows.length>300?'<p class="sub">Primele 300. Restrânge căutarea ca să vezi restul.</p>':''}`;
  const q=$('#q');q.addEventListener('input',()=>{S.q=q.value;const p=q.selectionStart;renderList();const n=$('#q');n.focus();n.setSelectionRange(p,p);});
  $('#fraft').onchange=e=>{S.raft=e.target.value;renderList();};
  $('#ftip').onchange=e=>{S.tip=e.target.value;renderList();};
  $('#fno').onchange=e=>{S.noshelf=e.target.checked;renderList();};
  document.querySelectorAll('[data-stare]').forEach(b=>b.onclick=()=>{S.stare=S.stare===b.dataset.stare?'':b.dataset.stare;renderList();});
  document.querySelectorAll('tr.rw').forEach(tr=>tr.onclick=()=>openRec(tr.dataset.id));
  $('#add').onclick=()=>{const t=prompt('Titlul cărții noi:');if(t==null)return;call('newRecord',t.trim()).then(rec=>{S.data.rows.push(S.data.cols.map(k=>rec[k]||''));showRec(rec);toast('Carte nouă: ID '+rec.ID);}).catch(e=>alert(e.message||e));};
}

/* ---------- fișa ---------- */
const GROUPS=[
 ['Carte',['Titlu','Subtitlu','Fotograf / autor','Editură','Loc','An','Ediție','Serie','Volum','ISBN','Tip']],
 ['Colaboratori',['Colaboratori (nume – rol)']],
 ['Limbă',['Limbă']],
 ['Clasificare',['Categorie','Teme','Raft']],
 ['Obiectul fizic',['Pagini','Dimensiuni (cm)','Legătură']],
 ['Text',['Descriere','Sursa descrierii','Linkuri surse','Video']],
 ['Imagini',['Copertă','Interioare','Copertă de verificat']],
 ['Inventar',['Intrată în bibliotecă','Verificat la raft','Note']],
 ['Sistem',['ID','Wix ID']]];
const HINT={'Video':'link YouTube sau Vimeo despre carte (interviu, răsfoire); mai multe, separate cu „; ”','Intrată în bibliotecă':'data, ex. 2026-11-03; o pune singur la „Carte nouă”','Fotograf / autor':'Doar fotograful sau autorul principal. Mai mulți: separați cu „; ”','Copertă':'calea fișierului (o completează sistemul)','Dimensiuni (cm)':'lățime x înălțime, ex. 24 x 30'};
function openRec(id){$('#app').innerHTML='<div class="load">Se deschide fișa…</div>';call('getRecord',id).then(showRec).catch(e=>alert(e.message||e));}
function showRec(rec){S.rec=JSON.parse(JSON.stringify(rec));S.orig=rec;route();window.scrollTo(0,0);}
function dirty(){if(!S.rec)return false;readForm();return Object.keys(S.rec).some(k=>String(S.rec[k])!==String(S.orig[k]));}
function leaveOk(){return !(dirty()||panDirty())||confirm('Ai modificări nesalvate. Le pierzi?');}
function parseContrib(s){return String(s||'').split(/;\s*/).filter(Boolean).map(x=>{const i=x.lastIndexOf(' – ');return i>0?{n:x.slice(0,i).trim(),r:x.slice(i+3).trim()}:{n:x.trim(),r:''};});}
function field(k,v){
  const L=S.data.lists,ro=(k==='ID'||k==='Wix ID'||(k==='Copertă'&&S.data.user.role!=='admin'));
  const ch=String(v)!==String(S.orig[k])?' chg':'';
  if(k==='Tip'||k==='Categorie'||k==='Raft'){const arr=L[k]||[];const extra=v&&arr.indexOf(v)<0?[v]:[];
    return `<label class="f">${k}<select data-k="${k}" class="${ch}"><option value=""></option>${arr.concat(extra).map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`;}
  if(k==='Copertă de verificat')return `<label class="f">${k}<select data-k="${k}" class="${ch}"><option value=""></option><option ${v==='da'?'selected':''}>da</option></select></label>`;
  if(k==='Descriere')return `<label class="f w">${k}<textarea data-k="${k}" class="${ch}">${esc(v)}</textarea></label>`;
  if(k==='Teme'){const sel=String(v||'').split(/;\s*/).filter(Boolean),all=(L['Teme']||[]).concat(sel.filter(x=>(L['Teme']||[]).indexOf(x)<0));
    return `<div class="f w" style="font-size:12px;color:var(--muted)">Teme<div class="seg" id="teme" style="margin-top:4px">${all.map(t=>`<button type="button" data-t="${esc(t)}" aria-pressed="${sel.indexOf(t)>=0}">${esc(t)}</button>`).join('')}</div></div>`;}
  if(k==='Video'||k==='Linkuri surse'||k==='Note'||k==='Titlu'||k==='Fotograf / autor')return `<label class="f w">${k}${HINT[k]?' · '+HINT[k]:''}<input data-k="${k}" class="${ch}" value="${esc(v)}" ${ro?'readonly':''}></label>`;
  return `<label class="f">${k}${HINT[k]?' · '+HINT[k]:''}<input data-k="${k}" class="${ch}" value="${esc(v)}" ${ro?'readonly':''}></label>`;
}
function renderRec(){
  const r=S.rec,L=S.data.lists,adm=S.data.user.role==='admin',u=coverUrl(r['Copertă']);
  const langs=String(r['Limbă']||'').split(/;\s*/).filter(Boolean);
  const allL=(L['Limbă']||[]).concat(langs.filter(x=>(L['Limbă']||[]).indexOf(x)<0));
  const roles=L['Rol colaborator']||[];
  const body=GROUPS.map(([g,ks])=>{
    if(g==='Colaboratori')return `<fieldset><legend>Colaboratori</legend><div class="contrib" id="contrib">${parseContrib(r['Colaboratori (nume – rol)']).map(c=>crow(c,roles)).join('')}</div><button class="linkbtn" id="addc">+ adaugă colaborator</button></fieldset>`;
    if(g==='Limbă')return `<fieldset><legend>Limbă</legend><div class="seg" id="langs">${allL.map(l=>`<button type="button" data-l="${esc(l)}" aria-pressed="${langs.indexOf(l)>=0}">${esc(l)}</button>`).join('')}</div></fieldset>`;
    return `<fieldset><legend>${g}</legend><div class="grid">${ks.map(k=>field(k,r[k]||'')).join('')}</div></fieldset>`;}).join('');
  $('#app').innerHTML=`<p><button class="linkbtn" id="back">← Înapoi la listă</button></p>
  <div class="rec"><div class="cov">${u?`<img src="${esc(u)}" alt="Coperta">`:'<div class="ph">Fără copertă</div>'}
   <p class="sub">ID ${esc(r.ID)}${r['Stare']==='Publicată'?` · <a href="${S.data.site}#carte-${esc(r.ID)}" target="_blank">vezi pe site</a>`:''}</p>
   <div class="hist" id="hist"><button class="linkbtn" id="showh">Istoric modificări</button></div></div>
  <div><fieldset><legend>Stare</legend><div class="seg" id="stare">${STARI.map(s=>`<button type="button" data-s="${s}" aria-pressed="${r['Stare']===s}" ${s==='Publicată'&&!adm?'disabled title="Doar adminul publică"':''}>${s}</button>`).join('')}</div></fieldset>
  ${body}
  <div class="savebar"><button class="btn" id="save">Salvează</button><button class="btn sec" id="cancel">Renunță</button><span class="msg" id="msg"></span></div></div></div>`;
  $('#back').onclick=()=>{if(!leaveOk())return;S.rec=null;route();};
  $('#cancel').onclick=()=>{S.rec=JSON.parse(JSON.stringify(S.orig));renderRec();};
  document.querySelectorAll('#stare button').forEach(b=>b.onclick=()=>{readForm();S.rec['Stare']=b.dataset.s;renderRec();});
  document.querySelectorAll('#langs button,#teme button').forEach(b=>b.onclick=()=>{b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');});
  $('#addc').onclick=()=>{$('#contrib').insertAdjacentHTML('beforeend',crow({n:'',r:''},roles));bindC();};bindC();
  document.querySelectorAll('[data-k]').forEach(i=>i.addEventListener('input',()=>i.classList.toggle('chg',i.value!==String(S.orig[i.dataset.k]||''))));
  $('#save').onclick=save;
  $('#showh').onclick=()=>call('getHistory',r.ID).then(h=>{$('#hist').innerHTML='<b>Istoric</b>'+(h.length?h.map(x=>`<div>${esc(x[0])} · ${esc(x[1])}<br><b>${esc(x[3])}</b><br>${diffHtml(x[4],x[5])}</div>`).join(''):'<div>Nicio modificare încă.</div>');});
}
function diffHtml(a,b){a=String(a||'');b=String(b||'');let p=0;while(p<a.length&&p<b.length&&a[p]===b[p])p++;let s=0;while(s<a.length-p&&s<b.length-p&&a[a.length-1-s]===b[b.length-1-s])s++;
  const pre=a.slice(Math.max(0,p-40),p),post=a.slice(a.length-s,a.length-s+40),del=a.slice(p,a.length-s),ins=b.slice(p,b.length-s);
  return (p>40?'…':'')+esc(pre)+(del?`<del>${esc(del)}</del>`:'')+(ins?`<ins>${esc(ins)}</ins>`:'')+esc(post)+(a.length-s+40<a.length?'…':'')+(!a?' <span class=sub>(câmp gol înainte)</span>':'')+(!b?' <span class=sub>(golit)</span>':'');}
function crow(c,roles){const rs=roles.concat(c.r&&roles.indexOf(c.r)<0?[c.r]:[]);return `<div class="r"><input placeholder="Nume" value="${esc(c.n)}"><select><option value="">rol…</option>${rs.map(x=>`<option ${x===c.r?'selected':''}>${esc(x)}</option>`).join('')}</select><button type="button" class="x" title="Șterge">×</button></div>`;}
function bindC(){document.querySelectorAll('#contrib .x').forEach(b=>b.onclick=()=>b.parentNode.remove());}
function readForm(){if(!S.rec||!$('#save'))return;
  document.querySelectorAll('[data-k]').forEach(i=>S.rec[i.dataset.k]=i.value.trim());
  S.rec['Limbă']=[...document.querySelectorAll('#langs button[aria-pressed=true]')].map(b=>b.dataset.l).join('; ');
  if($('#teme'))S.rec['Teme']=[...document.querySelectorAll('#teme button[aria-pressed=true]')].map(b=>b.dataset.t).join('; ');
  S.rec['Colaboratori (nume – rol)']=[...document.querySelectorAll('#contrib .r')].map(r=>{const n=r.querySelector('input').value.trim(),ro=r.querySelector('select').value;return n?(ro?n+' – '+ro:n):'';}).filter(Boolean).join('; ');}
function save(){
  readForm();const ch={},bf={};Object.keys(S.rec).forEach(k=>{if(String(S.rec[k])!==String(S.orig[k])){ch[k]=S.rec[k];bf[k]=S.orig[k];}});
  if(!Object.keys(ch).length){toast('Nimic de salvat');return;}
  $('#save').disabled=true;$('#msg').className='msg';$('#msg').textContent='Se salvează…';
  call('saveRecord',S.rec.ID,ch,bf).then(res=>{
    S.orig=res.record;const keep=S.rec;S.rec=JSON.parse(JSON.stringify(res.record));
    updRow(res.record);
    if(res.conflicts.length){res.conflicts.forEach(c=>S.rec[c.field]=keep[c.field]);renderRec();$('#msg').className='msg err';$('#msg').textContent='Altcineva a schimbat între timp: '+res.conflicts.map(c=>c.field).join(', ')+'. Valorile tale sunt încă în formular, marcate; verifică și salvează din nou.';}
    else{renderRec();toast(res.saved?'Salvat ('+res.saved+' câmpuri)':'Nimic de salvat');}
  }).catch(e=>{$('#save').disabled=false;$('#msg').className='msg err';$('#msg').textContent=e.message||String(e);});
}
function updRow(rec){const i=S.data.rows.findIndex(r=>r[C('ID')]===String(rec.ID));const row=S.data.cols.map(k=>rec[k]||'');if(i>=0)S.data.rows[i]=row;else S.data.rows.push(row);}

/* ---------- inventar pe raft ---------- */
function renderInv(){
  const L=S.data.lists,rf=S.invRaft;
  const rows=rf?S.data.rows.filter(r=>r[C('Raft')]===rf).sort((a,b)=>a[C('Titlu')].localeCompare(b[C('Titlu')],'ro')):[];
  const done=rows.filter(r=>r[C('Verificat la raft')]).length;
  $('#app').innerHTML=`<div class="tools"><select id="iraft"><option value="">Alege raftul…</option>${(L['Raft']||[]).map(v=>`<option ${v===rf?'selected':''}>${esc(v)}</option>`).join('')}</select>
  ${rf?`<span class="count">${done} din ${rows.length} găsite</span>`:''}</div>
  ${rf?`<p class="sub">Bifează fiecare carte pe care o găsești pe raft. Dacă găsești o carte care nu e în listă, caut-o în tabul „Cărți” și corectează-i raftul; dacă nu există deloc, adaug-o ca „Carte nouă”.</p>
  <div class="inv"><ul>${rows.map(r=>{const u=coverUrl(r[C('Copertă')]),ok=!!r[C('Verificat la raft')];return `<li class="${ok?'done':''}"><input type="checkbox" data-id="${esc(r[C('ID')])}" ${ok?'checked':''}>${u?`<img loading="lazy" src="${esc(u)}" alt="">`:'<span style="width:40px"></span>'}<div><div class="t">${esc(r[C('Titlu')])}</div><div class="sub">${esc(r[C('Fotograf / autor')])} · ID ${esc(r[C('ID')])}${ok?' · '+esc(r[C('Verificat la raft')]):''}</div></div><button class="linkbtn" style="margin-left:auto" data-open="${esc(r[C('ID')])}">fișa</button></li>`}).join('')}</ul></div>`:'<p class="sub">Alege un raft ca să vezi ce cărți ar trebui să fie pe el.</p>'}`;
  $('#iraft').onchange=e=>{S.invRaft=e.target.value;renderInv();};
  document.querySelectorAll('.inv input[type=checkbox]').forEach(cb=>cb.onchange=()=>{cb.disabled=true;
    call('markShelf',cb.dataset.id,cb.checked,null).then(res=>{updRow(res.record);renderInv();}).catch(e=>{alert(e.message||e);renderInv();});});
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openRec(b.dataset.open));
}

/* ---------- panouri pe prima pagină ---------- */
const KINDS=['Cartea săptămânii','Cărți noi','Sugestii căutare','Meet the Book','Seara de film','Curs · Bazele fotografiei','Curs · Școala de educație vizuală','Atelier','Expoziție','Lansare de carte','Târg','Eveniment'];
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const addDays=(iso,n)=>{const d=new Date((iso||today())+'T12:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};
const fmtD=iso=>iso?new Date(iso+'T12:00').toLocaleDateString('ro-RO',{day:'numeric',month:'short',year:'numeric'}):'';
const isProp=p=>!p.active&&/^propunere/i.test(p.src||'');
function pStat(p){const d=today();if(isProp(p))return['pr','Propunere'];if(!p.active)return['off','Oprit'];if(p.from&&p.from>d)return['pl','Programat'];
  if(p.to?p.to<d:(p.date&&(p.end||p.date)<d))return['ex','Expirat'];return['on','Pe site acum'];}
function pWin(p){const a=p.from?fmtD(p.from):'acum',b=p.to?fmtD(p.to):(p.end||p.date?fmtD(p.end||p.date)+' (sfârșitul evenimentului)':'fără termen');return 'pe site: '+a+' – '+b;}
const canPan=()=>['admin','editor'].indexOf(S.data.user.role)>=0;
const bookRow=id=>S.data.rows.find(r=>r[C('ID')]===String(id));
function panDirty(){if(!S.pe||!$('#psave'))return false;readPan();return JSON.stringify(S.pe)!==S.peOrig;}
function renderPan(){
  if(S.pe)return renderPanEdit();
  if(!S.panels){$('#app').innerHTML='<div class="load">Se încarcă panourile…</div>';
    call('getPanels').then(p=>{S.panels=p;renderPan();}).catch(e=>{const m=String(e.message||e);
      $('#app').innerHTML='<div class="load msg err">'+(/getPanels|not found|nu a fost găsit|Script function/i.test(m)?'Panourile cer versiunea nouă a scriptului (Code.gs). Cere-i lui Alex să o publice.':esc(m))+'</div>';});return;}
  const f=S.pf||'act',d=today();
  const groups={act:p=>['on','pl','pr'].indexOf(pStat(p)[0])>=0,pr:isProp,on:p=>pStat(p)[0]==='on',pl:p=>pStat(p)[0]==='pl',off:p=>!p.active&&!isProp(p),ex:p=>pStat(p)[0]==='ex',all:()=>true};
  const lab={act:'Pe site, programate și propuneri',pr:'Propuneri',on:'Pe site acum',pl:'Programate',off:'Oprite',ex:'Expirate',all:'Toate'};
  const L=S.panels.filter(groups[f]).sort((a,b)=>(a.from||a.date||'9').localeCompare(b.from||b.date||'9'));
  $('#app').innerHTML=`<div class="stats">${Object.keys(lab).map(k=>`<span data-pf="${k}" class="${f===k?'on':''}">${lab[k]} · ${S.panels.filter(groups[k]).length}</span>`).join('')}</div>
  <div class="tools"><span class="sub">Ce se schimbă des pe prima pagină: evenimente, cartea săptămânii, cărți noi. Apare pe site în câteva minute.</span>${canPan()?'<button class="btn" id="padd" style="margin-left:auto">+ Panou nou</button>':''}</div>
  <table><thead><tr><th>Stare</th><th>Panou</th><th class="hide-m">Când</th><th class="hide-m">Cărți</th><th></th></tr></thead><tbody>
  ${L.map(p=>{const [c,t]=pStat(p);return `<tr class="pr"><td><span class="pst ${c}">${t}</span></td>
   <td><div class="pk">${esc(p.kind)} · ${esc(p.id)}</div><div class="t">${esc(p.title||p.guest||'(fără titlu)')}</div>${p.title&&p.guest?`<div class="sub">cu ${esc(p.guest)}</div>`:''}<div class="sub">${esc(pWin(p))}</div></td>
   <td class="hide-m sub">${esc(p.when)}</td><td class="hide-m sub">${p.books.length}</td>
   <td style="white-space:nowrap;text-align:right">${canPan()&&isProp(p)?`<button class="linkbtn" data-pok="${esc(p.id)}">Aprobă</button> · <button class="linkbtn" data-pe="${esc(p.id)}">Editează</button> · <button class="linkbtn" data-pno="${esc(p.id)}">Respinge</button>`:canPan()?`<button class="linkbtn" data-pt="${esc(p.id)}">${p.active?'Oprește':'Pornește'}</button> · <button class="linkbtn" data-pe="${esc(p.id)}">Editează</button> · <button class="linkbtn" data-pd="${esc(p.id)}">Duplică</button>`:`<button class="linkbtn" data-pe="${esc(p.id)}">Vezi</button>`}</td></tr>`;}).join('')||'<tr><td colspan="5" class="sub">Niciun panou aici.</td></tr>'}</tbody></table>`;
  document.querySelectorAll('[data-pf]').forEach(b=>b.onclick=()=>{S.pf=b.dataset.pf;renderPan();});
  const P=id=>S.panels.find(p=>p.id===id);
  document.querySelectorAll('[data-pe]').forEach(b=>b.onclick=()=>openPan(JSON.parse(JSON.stringify(P(b.dataset.pe)))));
  document.querySelectorAll('[data-pd]').forEach(b=>b.onclick=()=>{const c=JSON.parse(JSON.stringify(P(b.dataset.pd)));c.id='';c.active=false;c.src='manual';openPan(c);toast('Copie: completează și salvează');});
  document.querySelectorAll('[data-pt]').forEach(b=>b.onclick=()=>{const p=JSON.parse(JSON.stringify(P(b.dataset.pt)));p.active=!p.active;b.disabled=true;
    call('savePanel',p).then(r=>{S.panels=S.panels.map(x=>x.id===r.id?r:x);renderPan();toast(r.active?'Pornit':'Oprit');}).catch(e=>{alert(e.message||e);renderPan();});});
  document.querySelectorAll('[data-pok]').forEach(b=>b.onclick=()=>{const p=JSON.parse(JSON.stringify(P(b.dataset.pok)));p.active=true;p.src=String(p.src||'').replace(/^propunere\s*·?\s*/i,'')||'manual';b.disabled=true;
    call('savePanel',p).then(r=>{S.panels=S.panels.map(x=>x.id===r.id?r:x);renderPan();toast('Aprobat · '+pStat(r)[1].toLowerCase());}).catch(e=>{alert(e.message||e);renderPan();});});
  document.querySelectorAll('[data-pno]').forEach(b=>b.onclick=()=>{if(!confirm('Respingi propunerea? Se șterge din listă.'))return;b.disabled=true;
    call('deletePanel',b.dataset.pno).then(()=>{S.panels=S.panels.filter(x=>x.id!==b.dataset.pno);renderPan();toast('Propunere respinsă');}).catch(e=>{alert(e.message||e);renderPan();});});
  const a=$('#padd');if(a)a.onclick=()=>openPan({id:'',active:true,kind:'Meet the Book',title:'',guest:'',when:'',date:'',end:'',from:'',to:'',books:[],text:'',src:'manual'});
}
function openPan(p){S.pe=p;S.peOrig=JSON.stringify(p);renderPan();window.scrollTo(0,0);}
function bchip(id){const r=bookRow(id);const u=r?coverUrl(r[C('Copertă')]):'';return `<div class="bchip" data-b="${esc(id)}">${u?`<img src="${esc(u)}" alt="">`:''}<span>${r?esc(r[C('Titlu')]):'ID '+esc(id)+' (nu există)'}${r&&r[C('Stare')]!=='Publicată'?' <span class=flag>nu e pe site</span>':''}</span>${canPan()?'<button type="button" class="x" title="Scoate">×</button>':''}</div>`;}
function renderPanEdit(){
  const p=S.pe,ro=!canPan(),dis=ro?'disabled':'',adm=S.data.user.role==='admin';
  const inp=(k,lab,type,hint)=>`<label class="f">${lab}${hint?' · '+hint:''}<input data-p="${k}" type="${type||'text'}" value="${esc(p[k]||'')}" ${dis}></label>`;
  $('#app').innerHTML=`<p><button class="linkbtn" id="pback">← Înapoi la Editorial</button></p>
  <h2 style="font-weight:600;margin:6px 0 2px">${p.id?esc(p.title||p.guest||p.kind):'Panou nou'}</h2><p class="sub">${p.id?esc(p.id)+' · ':''}<span id="pstat"></span>${isProp(p)?' · propunere ('+esc(String(p.src).replace(/^propunere\s*·?\s*/i,'')||'automată')+'): verifică textul și cărțile, apoi pune „Pornit” și salvează':''}</p>
  <div class="sub" style="margin-top:10px">Așa arată pe prima pagină:</div><div id="pview"></div>
  <fieldset><legend>Pe site</legend><div class="seg" id="pact"><button type="button" data-a="1" aria-pressed="${!!p.active}" ${dis}>Pornit</button><button type="button" data-a="0" aria-pressed="${!p.active}" ${dis}>Oprit</button></div>
   <div class="grid" style="margin-top:10px">${inp('from','Afișare de la','date','gol = de acum')}${inp('to','Afișare până la','date','gol = până la eveniment')}</div>
   ${ro?'':`<div class="quick"><button type="button" class="linkbtn" data-q="w1">o săptămână de la început</button><button type="button" class="linkbtn" data-q="w2">două săptămâni</button><button type="button" class="linkbtn" data-q="ev">cu 2 săptămâni înainte, până la eveniment</button><button type="button" class="linkbtn" data-q="clr">golește</button></div>`}</fieldset>
  <fieldset><legend>Panou</legend><div class="grid">
   <label class="f">Tip<input data-p="kind" list="kinds" value="${esc(p.kind)}" ${dis}><datalist id="kinds">${KINDS.concat((S.panels||[]).map(x=>x.kind)).filter((v,i,a)=>v&&a.indexOf(v)===i).map(k=>`<option value="${esc(k)}">`).join('')}</datalist></label>
   <label class="f w">Titlu · la Meet the Book poate rămâne gol<input data-p="title" value="${esc(p.title)}" ${dis}></label>
   ${inp('guest','Invitat','text','apare ca „cu …”')}
   <label class="f w">Când · textul afișat, ex. „Duminică, 8 noiembrie, ora 12:00”<input data-p="when" value="${esc(p.when)}" ${dis}></label>
   ${inp('date','Data evenimentului','date')}${inp('end','Ultima zi','date','dacă ține mai multe zile')}
   <label class="f w">Text scurt (opțional)<textarea data-p="text" style="min-height:80px" ${dis}>${esc(p.text)}</textarea></label></div></fieldset>
  <fieldset><legend>Cărți din bibliotecă</legend><p class="sub" style="margin:0 0 6px" id="blim"></p>
   ${ro?'':'<div class="bsr"><input type="search" id="bq" placeholder="Caută după titlu, autor sau ID…" style="width:100%;padding:8px 10px;border:1px solid var(--rule);border-radius:9px"><div class="dd" id="bdd" hidden></div></div>'}
   <div class="bchips" id="bch">${p.books.map(bchip).join('')}</div></fieldset>
  <div class="savebar">${ro?'':'<button class="btn" id="psave">Salvează</button><button class="btn sec" id="pcancel">Renunță</button>'}${adm&&p.id?'<button class="linkbtn" id="pdel" style="margin-left:auto;color:var(--red)">Șterge panoul</button>':''}<span class="msg" id="pmsg"></span></div>`;
  const upd=()=>{readPan();const [c,t]=pStat(S.pe);$('#pstat').innerHTML=`<span class="pst ${c}">${t}</span> ${esc(pWin(S.pe))}`;$('#pview').innerHTML=pView(S.pe);const bl=$('#blim');if(bl)bl.textContent=bMax(S.pe)===0?'Fără cărți: cuvintele se scriu în „Text”.':S.pe.kind==='Cărți noi'?'Până la 12 cărți, în ordinea de aici.':bMax(S.pe)===1?'O singură carte.':'Cel mult 4. Apar cu coperta, în ordinea de aici.';};upd();
  document.querySelectorAll('[data-p]').forEach(i=>i.addEventListener('input',upd));
  $('#pback').onclick=()=>{if(!leaveOk())return;S.pe=null;renderPan();};
  if(ro)return;
  document.querySelectorAll('#pact button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#pact button').forEach(x=>x.setAttribute('aria-pressed',x===b));upd();});
  document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{readPan();const P=S.pe,st=P.date||P.from||today(),q=b.dataset.q;
    if(q==='w1'){P.from=P.from||st;P.to=addDays(P.from,6);}if(q==='w2'){P.from=P.from||st;P.to=addDays(P.from,13);}
    if(q==='ev'){if(!P.date){alert('Pune întâi data evenimentului.');return;}P.from=addDays(P.date,-14);P.to=P.end||P.date;}
    if(q==='clr'){P.from='';P.to='';}
    $('[data-p=from]').value=P.from;$('[data-p=to]').value=P.to;upd();});
  const bq=$('#bq'),dd=$('#bdd');
  const pick=id=>{readPan();if(S.pe.books.indexOf(id)<0){if(S.pe.books.length>=bMax(S.pe)){alert('Cel mult '+bMax(S.pe)+(bMax(S.pe)===1?' carte.':' cărți.'));return;}S.pe.books.push(id);}$('#bch').innerHTML=S.pe.books.map(bchip).join('');bindChips();upd();bq.value='';dd.hidden=true;bq.focus();};
  bq.addEventListener('input',()=>{const ws=norm(bq.value).split(/\s+/).filter(Boolean);if(!ws.length){dd.hidden=true;return;}
    const m=S.data.rows.filter(r=>{const h=norm([r[C('ID')],r[C('Titlu')],r[C('Fotograf / autor')]].join(' '));return ws.every(w=>h.includes(w));}).slice(0,12);
    dd.innerHTML=m.map(r=>{const u=coverUrl(r[C('Copertă')]);return `<button type="button" data-id="${esc(r[C('ID')])}">${u?`<img src="${esc(u)}" alt="">`:'<span style="width:26px"></span>'}<span><b>${esc(r[C('Titlu')])}</b> <span class="sub">${esc(r[C('Fotograf / autor')])} · ID ${esc(r[C('ID')])}${r[C('Stare')]!=='Publicată'?' · nu e pe site':''}</span></span></button>`;}).join('')||'<div class="sub" style="padding:8px 10px">Nimic găsit.</div>';
    dd.hidden=false;dd.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>pick(b.dataset.id));});
  bq.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const f=dd.querySelector('[data-id]');if(f)pick(f.dataset.id);}if(e.key==='Escape')dd.hidden=true;});
  function bindChips(){document.querySelectorAll('#bch .x').forEach(x=>x.onclick=()=>{readPan();const id=x.closest('[data-b]').dataset.b;S.pe.books=S.pe.books.filter(b=>b!==id);x.closest('[data-b]').remove();upd();});}
  bindChips();
  $('#pcancel').onclick=()=>{S.pe=JSON.parse(S.peOrig);renderPanEdit();};
  $('#psave').onclick=()=>{readPan();const P=S.pe;if(P.active&&/^propunere/i.test(P.src||''))P.src=String(P.src).replace(/^propunere\s*·?\s*/i,'')||'manual';
    if(P.from&&P.to&&P.to<P.from){$('#pmsg').className='msg err';$('#pmsg').textContent='„Afișare până la” e înainte de „Afișare de la”.';return;}
    if(P.date&&P.end&&P.end<P.date){$('#pmsg').className='msg err';$('#pmsg').textContent='Ultima zi e înainte de data evenimentului.';return;}
    $('#psave').disabled=true;$('#pmsg').className='msg';$('#pmsg').textContent='Se salvează…';
    call('savePanel',P).then(r=>{const i=S.panels.findIndex(x=>x.id===r.id);if(i>=0)S.panels[i]=r;else S.panels.push(r);S.pe=null;renderPan();toast('Salvat · pe site în câteva minute');})
    .catch(e=>{$('#psave').disabled=false;$('#pmsg').className='msg err';$('#pmsg').textContent=e.message||String(e);});};
  const del=$('#pdel');if(del)del.onclick=()=>{if(!confirm('Ștergi definitiv panoul? Dacă vrei doar să nu mai apară, apasă „Oprit”.'))return;
    call('deletePanel',S.pe.id).then(()=>{S.panels=S.panels.filter(x=>x.id!==S.pe.id);S.pe=null;renderPan();toast('Panou șters');}).catch(e=>alert(e.message||e));};
}
const bMax=p=>p.kind==='Sugestii căutare'?0:p.kind==='Cărți noi'?12:(p.kind==='Meet the Book'||p.kind==='Cartea săptămânii')?1:4;
function pView(p){
  if(p.kind==='Sugestii căutare'){const w=String(p.text||'').split(/[,;\n]/).map(x=>x.trim()).filter(Boolean);
    return `<div class="pv" style="grid-template-columns:1fr;background:#fff"><div><span class="w">Încearcă:</span> ${w.map(x=>`<span style="display:inline-block;border:1px solid var(--ink);border-radius:999px;padding:3px 12px;margin:4px 4px 0 0;font-size:14px">${esc(x)}</span>`).join('')||'<span class=sub>scrie cuvintele în „Text”, despărțite prin virgulă</span>'}<p class="sub" style="font-size:13px">Apar primele în „Încearcă”, pe calculator, cât e pornit panoul. Restul se completează singur din panouri și din catalog.</p></div></div>`;}
  if(p.kind==='Cartea săptămânii'||p.kind==='Cărți noi'){const bks=(p.books||[]).map(bookRow).filter(Boolean).slice(0,bMax(p));
    return `<div class="pv" style="grid-template-columns:1fr;background:#fff"><div><div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px"><h3 style="margin:0">${esc(p.kind)}</h3><span class="w">${esc(p.when||'')}</span></div>
      ${p.text?`<p>${esc(p.text)}</p>`:''}${bks.length?'':'<div class="bl sub">Alege '+(p.kind==='Cărți noi'?'cărțile':'cartea')+'</div>'}</div>
      <div class="cv" style="flex-wrap:wrap">${bks.map(r=>{const u=coverUrl(r[C('Copertă')]);return `<div style="width:${p.kind==='Cărți noi'?96:150}px;font-size:12px">${u?`<img src="${esc(u)}" alt="" style="height:${p.kind==='Cărți noi'?120:200}px;max-width:100%">`:''}<div style="margin-top:6px">${esc(r[C('Titlu')])}</div></div>`;}).join('')}</div></div>`;}
const bks=(p.books||[]).map(bookRow).filter(Boolean).slice(0,p.kind==='Meet the Book'?1:4);
  const head=p.title||String(p.kind||'').split(' · ')[0];
  return `<div class="pv"><div><div>${p.title?`<span class="k">${esc(p.kind)}</span>`:''}<span class="w">${esc(p.when||'')}</span></div>
   <h3>${esc(head)||'<span class=sub>(titlu)</span>'}</h3>${p.guest?`<div class="g">cu ${esc(p.guest)}</div>`:''}${p.text?`<p>${esc(p.text)}</p>`:''}
   ${bks.length?`<div class="bl"><span class="sub">${p.kind==='Meet the Book'?'Cartea prezentată':'Din bibliotecă'}</span>${bks.map(r=>`<div>${esc(r[C('Titlu')])} <span class="sub">${esc(String(r[C('Fotograf / autor')]).split(';')[0])}${r[C('Raft')]?' · raft '+esc(r[C('Raft')]):''}</span></div>`).join('')}</div>`:'<div class="bl sub">Fără cărți legate</div>'}</div>
   <div class="cv">${bks.map(r=>{const u=coverUrl(r[C('Copertă')]);return u?`<img src="${esc(u)}" alt="">`:'';}).join('')}</div></div>`;}
function readPan(){if(!S.pe||!$('[data-p=kind]'))return;document.querySelectorAll('[data-p]').forEach(i=>S.pe[i.dataset.p]=i.value.trim());
  const a=document.querySelector('#pact button[aria-pressed=true]');if(a)S.pe.active=a.dataset.a==='1';
  S.pe.books=[...document.querySelectorAll('#bch [data-b]')].map(x=>x.dataset.b);}
</script>
</body>
