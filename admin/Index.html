<!DOCTYPE html>
<html lang="ro">
<head>
<base target="_top">

<meta charset="utf-8">
<style>
:root{--ink:#111;--muted:#6b6b70;--rule:#e4e4e7;--soft:#f5f5f6;--red:#dc0b1c;--ok:#1b7f3b;--warn:#b26b00;--f:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--f);color:var(--ink);background:#fff;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--rule)}
.bar{display:flex;align-items:center;gap:16px;padding:12px 18px;max-width:1280px;margin:0 auto}
.bar .logo{height:54px;width:auto;flex:none}
.bar .sep{width:1px;height:30px;background:var(--rule);flex:none}
.bar .lib{white-space:nowrap;font-size:28px;letter-spacing:-.02em;display:inline-flex;align-items:center;gap:11px;font-weight:400}
.bar .lib::before{content:"";width:.45em;height:.45em;border:.09em solid var(--red);box-sizing:border-box;flex:none}

.tabs{display:flex;gap:2px;margin-left:18px;flex-wrap:wrap}

.tabs button{border:0;background:none;padding:7px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-current=true]{color:var(--ink);font-weight:600;border-bottom-color:var(--red)}
.tabs .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;font-size:11px;background:var(--red);color:#fff;font-weight:500;text-align:center}.tabs .n:empty{display:none}
.who{margin-left:auto;color:var(--muted);font-size:13px;text-align:right}
main{max-width:1280px;margin:0 auto;padding:18px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.tools input[type=search]{flex:1 1 260px;padding:9px 12px;border:1px solid var(--rule)}
select{padding:8px 10px;border:1px solid var(--rule);background:#fff}

.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

table{width:100%;border-collapse:collapse}

tr.rw{cursor:pointer}
tr.rw:hover{background:var(--soft)}

.vtog{display:inline-flex;border:1px solid var(--rule);overflow:hidden}.vtog button{border:0;background:#fff;padding:7px 12px;cursor:pointer;font-size:13px;color:var(--muted)}.vtog button[aria-pressed=true]{background:var(--ink);color:#fff}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px 16px;margin-top:12px}
.cg{cursor:pointer}.cg .im{height:230px;display:flex;align-items:flex-end;justify-content:center;background:var(--soft);padding:12px}
.cg img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 2px 8px rgba(0,0,0,.14)}.cg .ph2{font-size:12px;color:var(--muted);align-self:center}
.cg .t{font-size:13px;font-weight:600;margin-top:7px;line-height:1.25}.cg .sub{font-size:12px;margin-top:2px}.cg:hover .t{text-decoration:underline}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ic{border:1px solid var(--rule);padding:8px;font-size:12px}.ic img{width:100%;height:120px;object-fit:contain;background:var(--soft);display:block;margin-bottom:6px}
.ic.off img{opacity:.25}.ic .mv{float:right;display:flex;gap:2px}.ic .mv button{border:1px solid var(--rule);background:#fff;font-size:11px;line-height:1;padding:3px 6px;cursor:pointer}.ic .mv button:disabled{opacity:.3;cursor:default}.ic[draggable=true]{cursor:grab}.ic.drop{outline:2px solid #000}.ic .il{font-weight:600;margin-bottom:3px}.ic label{display:block;margin-top:3px;cursor:pointer}
.sug{background:var(--ink);color:#fff;padding:1px 7px;font-size:11px;font-weight:400}
.t{font-weight:500}
.sub{color:var(--muted);font-size:13px}
.st{display:inline-block;font-size:12px;padding:2px 9px;white-space:nowrap}
.st.c{background:#eee;color:#555}.st.l{background:#fff4e0;color:var(--warn)}.st.g{background:#e7f0ff;color:#1d4fb8}.st.p{background:#e6f5ea;color:var(--ok)}
.ok{color:var(--ok);font-size:13px}
.flag{color:var(--red);font-size:12px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:28px;margin-top:18px}
.sbox h3{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;border-bottom:1px solid var(--rule);padding-bottom:6px}
.srow{display:grid;grid-template-columns:1fr auto;gap:10px;padding:6px 0;border-bottom:1px solid var(--soft);font-size:14px;align-items:center}.srow.ck{cursor:pointer}.srow.ck:hover .st1{text-decoration:underline}
.srow .n{font-variant-numeric:tabular-nums;color:var(--muted)}.srow .bar{height:4px;background:var(--ink);margin-top:4px;opacity:.75}
.sbig{display:flex;gap:28px;flex-wrap:wrap;margin:10px 0 4px}.sbig div{font-size:13px;color:var(--muted)}.sbig b{display:block;font-size:26px;color:var(--ink);font-weight:500}
.spark{display:flex;align-items:flex-end;gap:2px;height:46px;margin-top:10px}.spark i{flex:1;max-width:22px;background:var(--ink);opacity:.7;min-height:1px}

.lk{border:1px solid var(--rule);padding:12px;margin:10px 0;display:grid;grid-template-columns:70px 1fr;gap:12px}
.lk img{width:70px;height:auto;border:1px solid var(--rule)}.lk .nocov{width:70px;height:90px;border:1px dashed var(--rule)}
.lk h4{margin:0 0 2px;font-size:15px;font-weight:600}.lk table{width:100%;border-collapse:collapse;margin-top:6px}
.lk td{padding:4px 6px;border-top:1px solid var(--soft);font-size:13px;vertical-align:top}.lk td.k{color:var(--muted);width:120px}
.lk td.cur{color:var(--muted);width:30%}.lk details{margin-top:6px;font-size:13px}.lk details p{white-space:pre-wrap;max-height:260px;overflow:auto;background:var(--soft);padding:8px;margin:6px 0 0}
.lk .warn{color:var(--warn);font-size:12px}

@media(max-width:760px){.hide-m{display:none}.bar{flex-wrap:wrap}.who{width:100%;text-align:left;margin:0}.tabs{margin-left:0}}
/* fișa */
.rec{display:grid;grid-template-columns:260px 1fr;gap:28px}
@media(max-width:860px){.rec{grid-template-columns:1fr}}
.cov{position:sticky;top:76px;align-self:start}
.cov img{width:100%;max-height:360px;object-fit:contain;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.cov .ph{height:260px;border:1px dashed var(--rule);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;text-align:center;padding:12px}
fieldset{border:0;border-top:1px solid var(--rule);margin:0 0 6px;padding:14px 0 6px}
legend{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding-right:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 14px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
label.f.w,div.f.w{grid-column:1/-1}
label.f input,label.f select,label.f textarea{font-size:15px;color:var(--ink);padding:8px 10px;border:1px solid var(--rule);background:#fff;width:100%}
label.f textarea{min-height:150px;resize:vertical;line-height:1.5}
.fh .seg button{padding:5px 11px;font-size:13px}
label.f input[readonly]{background:var(--soft)}
.chg{border-color:#e8a33d!important;background:#fffaf0!important}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--rule);background:#fff;padding:6px 12px;cursor:pointer;font-size:14px}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.contrib .r{display:flex;gap:6px;margin-bottom:6px}
.contrib input{flex:1;padding:7px 10px;border:1px solid var(--rule)}
.contrib select{flex:0 0 160px}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;padding:0 6px}
.linkbtn{border:0;background:none;color:var(--ink);text-decoration:underline;cursor:pointer;padding:0;font-size:14px}
.savebar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--rule);padding:10px 0;display:flex;gap:10px;align-items:center;margin-top:10px}
.msg{font-size:13px;color:var(--muted)}
.msg.err{color:var(--red)}
.hist{font-size:13px;color:var(--muted)}
.hist div{padding:6px 0;border-bottom:1px solid var(--rule);word-break:break-word}
.hist del{background:#fde2e2;color:#a40000;text-decoration:line-through}
.hist ins{background:#dcf5e3;color:#14692f;text-decoration:none}
/* inventar */
.inv li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule);list-style:none}
.inv ul{padding:0;margin:0}
.inv input[type=checkbox]{width:22px;height:22px;flex:none}
.inv img{width:64px;height:84px;object-fit:contain;flex:none}
.inv .done .t{color:var(--muted)}
.load{padding:40px 0;color:var(--muted)}
/* panouri */
.pst{display:inline-block;font-size:12px;padding:2px 9px;white-space:nowrap}
.pst.on{background:#e6f5ea;color:var(--ok)}.pst.pl{background:#e7f0ff;color:#1d4fb8}.pst.off{background:#eee;color:#555}.pst.ex{background:#f5f5f6;color:#999}.pst.pr{background:#fff4e0;color:var(--warn)}
.pv{border:1px solid var(--rule);background:#eceeec;padding:22px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;margin:8px 0 4px}
.pv .k{display:inline-block;border:1px solid var(--ink);padding:2px 10px;font-size:13px;margin-right:8px}.pv .w{color:var(--muted);font-size:13px}
.pv h3{font-size:30px;line-height:1.05;font-weight:400;margin:10px 0 4px;letter-spacing:-.01em}.pv .g{color:var(--muted);font-size:18px}.pv p{margin:8px 0 0;font-size:14px}
.pv .bl{margin-top:12px;font-size:13px}.pv .bl div{margin-top:3px}.pv .cv{display:flex;gap:10px;align-items:flex-end}.pv .cv img{height:120px;max-width:110px;object-fit:contain;box-shadow:0 6px 14px -6px rgba(0,0,0,.35);background:#fff}
@media(max-width:760px){.pv{grid-template-columns:1fr}.pv .cv img{height:90px}}
tr.pr td{vertical-align:top}
.pk{font-size:12px;color:var(--muted)}
.bchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.bchip{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);padding:4px 6px 4px 4px;max-width:340px;font-size:13px}
.bchip img{width:40px;height:52px;object-fit:contain;background:#fff;flex:none}
.bchip .mv{display:flex;flex-direction:column;gap:2px}.bchip .mv button{border:0;background:none;cursor:pointer;font-size:11px;line-height:1;padding:1px 3px;color:#777}.bchip .mv button:hover{color:var(--ink)}
.selrow td .cv{display:flex;gap:4px}.selrow td .cv img{width:30px;height:40px;object-fit:contain;background:#f5f5f7}
.bchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bsr{position:relative}
.bsr .dd{position:absolute;left:0;right:0;top:100%;z-index:4;background:#fff;border:1px solid var(--rule);box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:320px;overflow:auto}
.bsr .dd button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:6px 10px;cursor:pointer}
.bsr .dd button:hover,.bsr .dd button:focus{background:var(--soft)}
.bsr .dd img{width:26px;height:34px;object-fit:contain;flex:none}
.quick{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
/* ---- structura nouă ---- */
h2.pg{font-size:20px;font-weight:600;margin:0 0 12px}h3.sec{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;border-bottom:1px solid var(--rule);padding-bottom:6px}
.todo{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:26px}
.card{border:1px solid var(--rule);padding:14px 16px;cursor:pointer;background:none;text-align:left;font:inherit;color:inherit}.card:hover{border-color:var(--ink)}
.card b{display:block;font-size:30px;font-weight:500;line-height:1.1}.card b.z{color:var(--muted)}.card span{display:block;margin-top:4px}.card .sub{margin-top:6px}.card.alert b{color:var(--red)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:7px 0;border-bottom:1px solid var(--soft);font-size:14px;align-items:center}.row.ck{cursor:pointer}.row.ck:hover .t{text-decoration:underline}
.lay{display:grid;grid-template-columns:210px 1fr;gap:24px;align-items:start}
.side .grp{margin-bottom:18px}.side .grp button{display:flex;width:100%;border:0;background:none;padding:5px 0;font:inherit;font-size:14px;cursor:pointer;color:var(--muted);text-align:left}.side .grp button.on{color:var(--ink)}.side .grp button.on::before{content:"";width:9px;height:9px;border:2px solid var(--red);display:inline-block;margin-right:7px;box-sizing:border-box;align-self:center;flex:none}.side .grp button span{margin-left:auto;font-variant-numeric:tabular-nums;padding-left:8px}
.side .grp button:hover{color:var(--ink)}
.vt{display:inline-flex;border:1px solid var(--rule)}.vt button{border:0;background:#fff;padding:7px 12px;cursor:pointer;font-size:13px;color:var(--muted)}.vt button[aria-pressed=true]{background:var(--ink);color:#fff}
td.ck{width:28px}td.ck input{width:15px;height:15px;margin:0;display:block}
.bulk{display:flex;gap:12px;align-items:center;background:var(--soft);padding:8px 12px;margin-bottom:10px;font-size:14px;flex-wrap:wrap}
.fh{display:flex;gap:18px;align-items:flex-start;margin-bottom:14px}.fh img{width:110px;max-height:150px;object-fit:contain;border:1px solid var(--rule);background:#fff}.fh .ph{width:110px;height:140px;border:1px dashed var(--rule)}.fh h2{margin:0;font-size:22px;font-weight:600;line-height:1.2}.fh .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flay{display:grid;grid-template-columns:1fr 290px;gap:28px;align-items:start}
details.sec{border-top:1px solid var(--rule);padding:2px 0}details.sec>summary{cursor:pointer;padding:10px 0;font-weight:600;display:flex;gap:10px;list-style:none;align-items:baseline}details.sec>summary::-webkit-details-marker{display:none}details.sec>summary::before{content:"›";display:inline-block;width:12px;transform:rotate(90deg);color:var(--muted);transition:transform .15s}details.sec:not([open])>summary::before{transform:none}details.sec>summary .sub{font-weight:400;margin-left:auto;text-align:right}
details.sec .grid{padding-bottom:12px}details.sec fieldset{border:0;padding:0 0 10px;margin:0}details.sec legend{display:none}
.sitewarn{border:1px solid var(--warn);background:#fff8ed;padding:10px 14px;margin:0 0 12px;font-size:14px}.sitewarn ul{margin:4px 0 0 18px;padding:0}.sitewarn li{margin:2px 0}
.rail .box{border:1px solid var(--rule);padding:12px 14px;margin-bottom:14px;font-size:14px}.rail .box .linkbtn{display:inline-block;margin-top:6px;font-size:13px}.rail .box .hist div{padding:5px 0}
@media(max-width:860px){.lay,.flay,.two{grid-template-columns:1fr}.side{display:flex;gap:18px;overflow-x:auto}.side .grp{min-width:150px}}
/* vedere calendar în Editorial */
.cl{display:grid;grid-template-columns:200px 1fr;border:1px solid var(--rule);margin-top:4px}
.cl-labels{position:relative;border-right:1px solid var(--rule);background:#fff}
.cl-corner{height:46px;border-bottom:1px solid var(--rule)}
.cl-lane{position:absolute;left:0;right:0;padding:6px 10px;border-bottom:1px solid var(--rule);font-size:13px;line-height:1.25;overflow:hidden}
.cl-lane b{display:block;font-weight:600}.cl-lane .sub{font-size:12px}
.cl-scroll{overflow-x:auto;position:relative}
.cl-body{position:relative}
.cl-head{position:absolute;top:0;left:0;right:0;height:46px;border-bottom:1px solid var(--rule);background:#fff}
.cl-wk{position:absolute;top:0;height:46px;padding:5px 0 0 6px;font-size:12px;color:var(--muted);border-left:1px solid var(--rule);font-variant-numeric:tabular-nums}
.cl-wk i{display:block;font-style:normal;font-size:11px;text-transform:uppercase;letter-spacing:.04em;height:14px}
.cl-wk.now{color:var(--ink);font-weight:600}
.cl-col{position:absolute;top:0;border-left:1px solid var(--rule)}
.cl-col.now{background:#fffbe8}
.cl-sep{position:absolute;left:0;right:0;height:1px;background:var(--rule)}
.cl-gap{position:absolute;background:repeating-linear-gradient(135deg,transparent 0 5px,#f1c9cc 5px 6px);opacity:.9}
.cl-bar{position:absolute;height:24px;font-size:12px;line-height:24px;padding:0 6px 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:1px solid transparent}
.cl-bar span{position:relative;z-index:1}
.cl-bar.on{background:#e6f5ea;color:var(--ok);border-color:#bfe3c9}.cl-bar.pl{background:#e7f0ff;color:#1d4fb8;border-color:#c4d6f7}
.cl-bar.pr{background:#fff4e0;color:var(--warn);border-color:#f3dcad}.cl-bar.off{background:#eee;color:#555;border-color:#ddd}.cl-bar.ex{background:#f5f5f6;color:#999;border-color:#e8e8ea}

.ovl{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:#fff;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:20px 22px;box-shadow:0 20px 50px -20px rgba(0,0,0,.5)}
.dlg h3{margin:0 0 10px;font-weight:600;font-size:17px}

.dlg .flag{display:block;margin-top:3px}
.dlg .sb{display:flex;gap:8px;align-items:center;margin-top:14px}
.cl-ev{position:absolute;bottom:-1px;height:4px;background:var(--ink);z-index:2}
.cl-leg{margin-top:10px;font-size:12px}.cl-leg .pst{font-style:normal;margin-right:2px}
@media(max-width:760px){.cl{grid-template-columns:120px 1fr}.cl-lane{padding:6px}}
</style>
</head>
<body>
<header><div class="bar"><img class="logo" id="logo" alt="Centrul de Resurse în Fotografie" width="103" height="40"><span class="sep" aria-hidden="true"></span><span class="lib">Biblioteca CdRF<small>admin</small></span>
<nav class="tabs" hidden><button data-view="home" aria-current="true">De făcut<span class="n" id="todo"></span></button><button data-view="list">Cărți</button><button data-view="sel">Selecții</button><button data-view="pan">Editorial</button><button data-view="inv">Inventar</button><button data-view="stat">Statistici</button><button data-view="users">Utilizatori</button></nav>
<div class="who" id="who"></div></div></header>
<main id="app"><div class="load">Se încarcă…</div></main>
<div class="toast" id="toast"></div>
<script>
const S={invSel:[],invMove:false,psel:[],view:'home',q:'',stare:'',raft:'',tip:'',noshelf:false,chk:false,prop:false,sel:[],rec:null,orig:null,data:null,home:null,invRaft:''};
const STARI=['Ciornă','În lucru','Gata de publicare','Publicată'];
const stCls=s=>({'Ciornă':'c','În lucru':'l','Gata de publicare':'g','Publicată':'p'}[s]||'c');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const $=(s,r)=>(r||document).querySelector(s);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200);}
const SKEY='bib.session';
const DS='/'+'/';
/* sesiunea stă în sessionStorage (se închide cu browserul); doar cu „rămân conectat” trece în localStorage */
function getSess(){try{return sessionStorage.getItem(SKEY)||localStorage.getItem(SKEY)||''}catch(e){return ''}}
function setSess(v,keep){try{sessionStorage.removeItem(SKEY);localStorage.removeItem(SKEY);if(v)(keep?localStorage:sessionStorage).setItem(SKEY,v)}catch(e){}}
function raw(fn,...a){return new Promise((ok,ko)=>google.script.run.withSuccessHandler(ok).withFailureHandler(ko)[fn](...a));}
function call(fn,...a){return raw(fn,getSess(),...a).catch(e=>{if(String(e&&e.message||e).indexOf('AUTH')>=0&&window.BOOT&&BOOT.google){setSess('');showLogin();return new Promise(()=>{});}throw e;});}
function showLogin(msg){
  $('#who').textContent='';document.querySelector('.tabs').hidden=true;$('#todo').textContent='';
  $('#app').innerHTML=`<div style="max-width:420px;margin:60px auto;text-align:center"><h2 style="font-weight:600">Biblioteca CdRF</h2>
  <p class="sub">Intră cu contul Google pe care ți l-a adăugat Alex.</p>${msg?`<p class="msg err">${esc(msg)}</p>`:''}
  <p><a class="btn" id="gl" href="#" target="_top" style="display:inline-block;text-decoration:none;pointer-events:none;opacity:.5">Se pregătește…</a></p>
  <p class="sub" style="font-size:13px"><label><input type="checkbox" id="keep"> Rămân conectat pe acest calculator (30 de zile). Nu bifa pe un calculator folosit și de alții.</label></p></div>`;
  const prep=()=>{const a=$('#gl');a.style.pointerEvents='none';a.style.opacity='.5';raw('beginLogin',$('#keep').checked).then(u=>{a.href=u;a.textContent='Intră cu Google';a.style.pointerEvents='';a.style.opacity='';}).catch(e=>{a.textContent=e.message||String(e);});};
  $('#keep').onchange=prep; prep();
}
function logout(){raw('logout',getSess()).finally(()=>{setSess('');showLogin();});}
function coverUrl(v){v=String(v||'');if(v.startsWith('covers/')||v.startsWith('pages/'))return S.data.site+v;if(v.startsWith('wix:'))return 'https://static.wixstatic.com/media/'+v.slice(4)+'/v1/fit/w_300,h_300/c.jpg';if(/^https?:/.test(v))return v;return '';}
const C=k=>S.data.cols.indexOf(k);

function start(){call('getInit').then(d=>{S.data=d;$('#who').innerHTML=esc(d.user.name)+' · '+(d.user.role==='admin'?'admin':'editor')+(window.BOOT&&BOOT.google?' · <button class="linkbtn" id="lo" style="font-size:13px">Ieși</button>':'');const lo=$('#lo');if(lo)lo.onclick=logout;brandInit(d.site);if(d.user.role!=='admin'){document.querySelectorAll('[data-view=stat],[data-view=users]').forEach(t=>t.remove());}document.querySelector('.tabs').hidden=false;route();loadHome();}).catch(e=>{$('#app').innerHTML='<div class="load msg err">'+esc(e.message||e)+'</div>';});}
(function boot(){const B=window.BOOT||{};brandInit('https:'+DS+'biblioteca.cdrf.ro/');
  if(B.error)return showLogin(B.error);
  if(B.code&&B.state&&getSess())return start();
  if(B.code&&B.state){$('#app').innerHTML='<div class="load">Se verifică contul…</div>';
    raw('finishLogin',B.code,B.state).then(r=>{setSess(r.session,!!r.keep);start();}).catch(e=>showLogin(e.message||String(e)));return;}
  if(B.google&&!getSess())return showLogin();
  start();})();
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(!b)return;if(!leaveOk())return;S.view=b.dataset.view;S.rec=null;S.pe=null;S.se=null;if(S.view==='home'&&S.data)loadHome();route();});
window.addEventListener('beforeunload',e=>{if(dirty()||panDirty()||selDirty()){e.preventDefault();e.returnValue='';}});

function route(){document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.view===S.view&&!S.rec));if(S.rec)return renderRec();if(S.view==='home')return renderHome();if(S.view==='pan')return renderPan();if(S.view==='sel')return renderSel();if(S.view==='inv')return renderInv();if(S.view==='stat'&&S.data.user.role==='admin')return renderStat();if(S.view==='users'&&S.data.user.role==='admin')return renderUsers();renderList();}

/* ---------- listă ---------- */
function filtered(){const ws=norm(S.q).split(/\s+/).filter(Boolean);return S.data.rows.filter(r=>{
  if(S.stare&&r[C('Stare')]!==S.stare)return false;
  if(S.raft&&r[C('Raft')]!==S.raft)return false;
  if(S.tip&&r[C('Tip')]!==S.tip)return false;
  if(S.noshelf&&r[C('Verificat la raft')])return false;
  if(S.chk&&!r[C('Copertă de verificat')])return false;
  if(S.unp&&r[C('Stare')]==='Publicată')return false;
  if(S.pend&&!(S.home&&S.home.pending.indexOf(r[C('ID')])>=0))return false;
  if(S.miss&&!(C('Situație')>=0&&r[C('Situație')]))return false;
  if(S.prop&&!(S.home&&S.home.proposed.indexOf(r[C('ID')])>=0))return false;
  if(ws.length){const h=norm(r.join(' '));if(!ws.every(w=>h.includes(w)))return false;}
  return true;});}
function cnt(f){return S.data.rows.filter(f).length;}
function renderList(){
  if(S.grid===undefined){try{S.grid=!!localStorage.getItem('adm_grid')}catch(e){S.grid=false}}
  const d=S.data,L=d.lists,rows=filtered(),adm=d.user.role==='admin',mod=(S.home&&S.home.mod)||{};
  const fb=(on,lab,n,attr)=>`<button type="button" class="${on?'on':''}" ${attr}>${esc(lab)}<span>${n}</span></button>`;
  const stB=STARI.map(st=>fb(S.stare===st&&!S.chk&&!S.prop,st,cnt(r=>r[C('Stare')]===st),`data-stare="${esc(st)}"`)).join('');
  const side=`<aside class="side"><div class="grp"><h3 class="sec">Stare</h3>${fb(!S.stare&&!S.chk&&!S.prop&&!S.noshelf&&!S.unp&&!S.pend&&!S.miss,'Toate',d.rows.length,'data-stare=""')}${S.home&&S.home.pending.length?fb(S.pend,adm?'Modificări propuse':'Propuse de mine',cnt(r=>S.home.pending.indexOf(r[C('ID')])>=0),'data-pend="1"'):''}${fb(S.unp,'Nepublicate',cnt(r=>r[C('Stare')]!=='Publicată'),'data-unp="1"')}${fb(S.chk,'Copertă de verificat',cnt(r=>r[C('Copertă de verificat')]),'data-chk="1"')}${stB}${S.home&&S.home.proposed.length?fb(S.prop,'Propuse de colegi',cnt(r=>S.home.proposed.indexOf(r[C('ID')])>=0),'data-prop="1"'):''}${fb(S.noshelf,'Neverificate la raft',cnt(r=>!r[C('Verificat la raft')]),'data-noshelf="1"')}${fb(S.miss,'Lipsă / împrumutate',cnt(r=>C('Situație')>=0&&r[C('Situație')]),'data-miss="1"')}</div>
   <div class="grp"><h3 class="sec">Tip</h3>${fb(!S.tip,'Toate',d.rows.length,'data-tip=""')}${(L['Tip']||[]).map(t=>fb(S.tip===t,t,cnt(r=>r[C('Tip')]===t),`data-tip="${esc(t)}"`)).join('')}</div>
   <div class="grp"><h3 class="sec">Raft</h3>${fb(!S.raft,'Toate',d.rows.length,'data-raft=""')}${(L['Raft']||[]).map(t=>fb(S.raft===t,t,cnt(r=>r[C('Raft')]===t),`data-raft="${esc(t)}"`)).join('')}</div></aside>`;
  const sel=S.sel.filter(id=>rows.some(r=>r[C('ID')]===id));S.sel=sel;
  const bulk=sel.length?`<div class="bulk"><label><input type="checkbox" id="bulkall" checked> ${sel.length} selectate</label> · ${adm?'<button class="linkbtn" data-bulk="pub">Publică</button> ':''}<button class="linkbtn" data-bulk="gata">Pune „Gata de publicare”</button> <button class="linkbtn" data-bulk="raft">Schimbă raftul</button> <button class="linkbtn" data-bulk="sel">Adaugă într-o selecție</button> <button class="linkbtn" data-bulk="none" style="margin-left:auto">Deselectează</button></div>`:'';
  $('#app').innerHTML=`<div class="lay">${side}<div>
  <div class="tools"><input type="search" id="q" placeholder="Caută: titlu, autor, ISBN, ID…" value="${esc(S.q)}">
  <span class="vt"><button data-v="l" aria-pressed="${!S.grid}">Listă</button><button data-v="g" aria-pressed="${!!S.grid}">Coperți</button></span>
  ${canW()?'<button class="btn" id="add">+ Carte nouă</button>':'<span class="sub">Cont de vizitator: doar citire</span>'}</div>${canW()?bulk:''}
  ${S.grid?`<div class="cgrid">${rows.slice(0,300).map(r=>{const u=coverUrl(r[C('Copertă')]);return `<div class="cg rw" data-id="${esc(r[C('ID')])}"><div class="im">${u?`<img loading="lazy" src="${esc(u)}" alt="">`:'<span class="ph2">fără copertă</span>'}</div><div class="t">${esc(r[C('Titlu')])||'(fără titlu)'}</div><div class="sub">${esc(r[C('Fotograf / autor')])}</div><div class="sub"><span class="st ${stCls(r[C('Stare')])}">${esc(r[C('Stare')])}</span>${r[C('Copertă de verificat')]?' <span class=flag>copertă de verificat</span>':''}</div></div>`}).join('')}</div>`:
  `<table><thead><tr><th></th><th></th><th>Carte</th><th class="hide-m">An</th><th class="hide-m">Raft</th><th class="hide-m" title="verificată la raft">Raft ✓</th><th>Stare</th><th class="hide-m">Modificată</th></tr></thead>
  <tbody>${rows.slice(0,300).map(r=>{const id=r[C('ID')],u=coverUrl(r[C('Copertă')]);return `<tr class="rw" data-id="${esc(id)}"><td class="ck"><input type="checkbox" data-sel="${esc(id)}" ${sel.indexOf(id)>=0?'checked':''}></td><td class="th">${u?`<img loading="lazy" src="${esc(u)}" alt="">`:''}</td>
  <td><div class="t">${esc(r[C('Titlu')])||'<span class=sub>(fără titlu)</span>'}</div><div class="sub">${esc(r[C('Fotograf / autor')])} · ID ${esc(id)}${r[C('Copertă de verificat')]?' <span class=flag>copertă de verificat</span>':''}${C('Situație')>=0&&r[C('Situație')]?' <span class=flag>'+esc(r[C('Situație')].replace(/\s*\(.*\)$/,''))+(r[C('La cine / unde')]?' · '+esc(r[C('La cine / unde')]):'')+'</span>':''}</div></td>
  <td class="hide-m sub">${esc(r[C('An')])}</td><td class="hide-m sub">${esc(r[C('Raft')])}</td><td class="hide-m">${r[C('Verificat la raft')]?'<span class=ok>✓</span>':''}</td>
  <td><span class="st ${stCls(r[C('Stare')])}">${esc(r[C('Stare')])}</span></td><td class="hide-m sub">${esc((mod[id]||'').slice(0,10))}</td></tr>`}).join('')}</tbody></table>`}
  <p class="sub">${rows.length>300?'Primele 300 din '+rows.length+'. Restrânge căutarea ca să vezi restul.':rows.length+' din '+d.rows.length}</p></div></div>`;
  const q=$('#q');q.addEventListener('input',()=>{S.q=q.value;const p=q.selectionStart;renderList();const n=$('#q');n.focus();n.setSelectionRange(p,p);});
  const reset=()=>{S.stare='';S.chk=false;S.prop=false;S.noshelf=false;S.unp=false;S.pend=false;S.miss=false;};
  document.querySelectorAll('[data-stare]').forEach(b=>b.onclick=()=>{const v=b.dataset.stare;reset();S.stare=v;renderList();});
  document.querySelectorAll('[data-pend]').forEach(b=>b.onclick=()=>{const v=!S.pend;reset();S.pend=v;renderList();});
  document.querySelectorAll('[data-miss]').forEach(b=>b.onclick=()=>{const v=!S.miss;reset();S.miss=v;renderList();});
  document.querySelectorAll('[data-unp]').forEach(b=>b.onclick=()=>{const v=!S.unp;reset();S.unp=v;renderList();});
  document.querySelectorAll('[data-chk]').forEach(b=>b.onclick=()=>{const v=!S.chk;reset();S.chk=v;renderList();});
  document.querySelectorAll('[data-prop]').forEach(b=>b.onclick=()=>{const v=!S.prop;reset();S.prop=v;renderList();});
  document.querySelectorAll('[data-noshelf]').forEach(b=>b.onclick=()=>{const v=!S.noshelf;reset();S.noshelf=v;renderList();});
  document.querySelectorAll('[data-tip]').forEach(b=>b.onclick=()=>{S.tip=b.dataset.tip;renderList();});
  document.querySelectorAll('[data-raft]').forEach(b=>b.onclick=()=>{S.raft=b.dataset.raft;renderList();});
  document.querySelectorAll('.rw').forEach(tr=>tr.onclick=e=>{if(e.target.closest('input'))return;openRec(tr.dataset.id);});
  document.querySelectorAll('[data-sel]').forEach(c=>c.onchange=()=>{const id=c.dataset.sel;if(c.checked){if(S.sel.indexOf(id)<0)S.sel.push(id);}else S.sel=S.sel.filter(x=>x!==id);renderList();});
  const ba=$('#bulkall');if(ba)ba.onchange=()=>{S.sel=[];renderList();};
  document.querySelectorAll('[data-bulk]').forEach(b=>b.onclick=()=>bulkAct(b.dataset.bulk));
  document.querySelectorAll('.vtog button,.vt button').forEach(b=>b.onclick=()=>{S.grid=b.dataset.v==='g';try{localStorage.setItem('adm_grid',S.grid?'1':'')}catch(e){}renderList();});
  if($('#add'))$('#add').onclick=()=>{const t=prompt('Titlul cărții noi:');if(t==null)return;call('newRecord',t.trim()).then(rec=>{S.data.rows.push(S.data.cols.map(k=>rec[k]||''));showRec(rec);toast('Carte nouă: ID '+rec.ID);}).catch(e=>alert(e.message||e));};
}
function bulkAct(k){const ids=S.sel.slice();if(!ids.length)return;
  const run=(ch,msg)=>{toast('Se salvează…');call('bulkUpdate',ids,ch).then(r=>{return call('getInit').then(d=>{S.data=d;S.sel=[];renderList();toast(msg+': '+r.saved+(r.errors.length?' · erori: '+r.errors.length:''));if(r.errors.length)alert(r.errors.join('\n'));});}).catch(e=>alert(e.message||e));};
  if(k==='none'){S.sel=[];renderList();return;}
  if(k==='pub'){if(!confirm('Publici '+ids.length+' cărți pe site?'))return;run({'Stare':'Publicată'},'Publicate');}
  if(k==='gata')run({'Stare':'Gata de publicare'},'Puse „Gata de publicare”');
  if(k==='raft'){const L=S.data.lists['Raft']||[];const v=prompt('Raftul nou pentru '+ids.length+' cărți ('+L.join(', ')+'):');if(v==null)return;if(L.indexOf(v.trim())<0){alert('Raft necunoscut: '+v);return;}run({'Raft':v.trim()},'Raft schimbat');}
  if(k==='sel'){const go=()=>{const names=S.sels.map((x,i)=>(i+1)+'. '+x.title).join('\n');const v=prompt('În ce selecție? Scrie numărul:\n'+names);if(v==null)return;const x=S.sels[parseInt(v,10)-1];if(!x){alert('Număr greșit.');return;}
      call('addToSelection',x.id,ids).then(r=>{S.sels=S.sels.map(y=>y.id===r.id?r:y);S.sel=[];renderList();toast('Adăugate în „'+r.title+'”');}).catch(e=>alert(e.message||e));};
    if(S.sels)go();else call('getSelections').then(p=>{S.sels=p;go();}).catch(e=>alert(e.message||e));}
}

/* ---------- ce poate face fiecare rol ---------- */
const ROLE_CAN={
 admin:['Vezi tot, inclusiv Statistici și Utilizatori.','Adaugi, editezi și publici cărți; doar tu pui „Publicată”.','Aprobi sau respingi modificările propuse de editori la cărțile publicate (le vezi pe „De făcut” și în fișa cărții, în dreapta).','Ascunzi sau retragi cărți de pe site.','Faci și ordonezi selecțiile și panourile; aprobi propunerile de panouri.','Dai și iei accesul colegilor (admin, editor, vizitator).'],
 editor:['§Catalogul de cărți','Vezi catalogul complet, cu toate câmpurile fiecărei cărți, și inventarul.','Adaugi cărți noi din „Cărți” → „+ Carte nouă”; cartea intră ca „Ciornă” și o completezi.','În fișa cărții, butonul verde „Caută date online” aduce automat date din Open Library, Google Books și bibliotecile naționale (LoC, DNB, BnF): bifezi ce preiei, apoi salvezi.','Completezi câmpurile pe secțiuni: Carte, Colaboratori, Limbă, Clasificare, Obiectul fizic, Text, Imagini, Inventar. La Imagini alegi ce poze de interior apar pe site și care apare la hover (când treci cu mouse-ul peste copertă).','Când înregistrarea unei cărți noi e gata, pui „Gata de publicare”; adminul o verifică și o publică.','Pentru siguranță și pentru o verificare dublă, la o carte deja publicată ce modifici ajunge la admin ca propunere și intră pe site după ce o aprobă; până atunci site-ul rămâne cum e.','La Inventar bifezi cărțile pe care le găsești pe raft.','§Prima pagină a site-ului','Panourile sunt ce se schimbă des pe prima pagină: evenimente (Meet the Book, seara de film, cursuri, ateliere, expoziții, lansări), cartea săptămânii, cărți noi. Un panou are tip, titlu, invitat, data și ora, o perioadă de afișare (de la – până la) și până la patru cărți din bibliotecă; vezi pe loc cum arată. Îl pornești sau îl oprești oricând; apare pe site în câteva minute, fără aprobare.','Propunerile de panouri (luate automat din calendarul CdRF) le verifici, le completezi și le aprobi sau le respingi.','Selecțiile sunt grupurile de cărți de pe prima pagină („Portretul”, „Fotografie românească”…): le faci, le ordonezi, le ascunzi; primele trei cărți dau coperta selecției.'],
 vizitator:['Vezi catalogul complet, cu toate câmpurile fiecărei cărți, selecțiile, panourile și inventarul.','Poți căuta după titlu, autor, ISBN sau ID și poți filtra după stare, tip și raft.']};
const roleLines=L=>L.map(x=>x.charAt(0)==='§'?`<li style="list-style:none;margin:10px 0 3px -18px;font-weight:600">${esc(x.slice(1))}</li>`:`<li style="margin:3px 0">${esc(x)}</li>`).join('');
function roleBox(){const r=S.data.user.role,L=ROLE_CAN[r]||ROLE_CAN.vizitator;let open=false;try{open=!localStorage.getItem('adm_rolebox')}catch(e){}
  return `<details class="sec" id="rolebox" ${open?'open':''} style="border:1px solid var(--rule);padding:0 14px;margin-bottom:18px"><summary>Contul tău: ${esc(r)}<span class="sub">ce poți face aici</span></summary><ul style="margin:0 0 12px;padding-left:18px;font-size:14px">${roleLines(L)}</ul></details>`;}
/* ---------- pagina de start: de făcut ---------- */
function loadHome(){call('getHome').then(h=>{S.home=h;todoBadge();if(S.view==='home'&&!S.rec)renderHome();if(S.view==='list'&&!S.rec)renderList();}).catch(()=>{S.home={log:[],mod:{},proposed:[],stat:null};});
  if(!S.panels)call('getPanels').then(p=>{S.panels=p;todoBadge();if(S.view==='home'&&!S.rec)renderHome();}).catch(()=>{});}
function todoN(){const c=(S.home?new Set(S.home.pending).size:0)+cnt(r=>r[C('Copertă de verificat')])+((S.panels||[]).filter(isPropOpen).length)+(S.home?cnt(r=>S.home.proposed.indexOf(r[C('ID')])>=0&&r[C('Stare')]!=='Publicată'):0);return c;}
function todoBadge(){const b=$('#todo');if(b)b.textContent=S.data?(todoN()||''):'';}
function renderHome(){
  const d=S.data,H=S.home,P=S.panels||[],adm=d.user.role==='admin';
  const card=(n,lab,sub,go,alert)=>`<button class="card${alert&&n?' alert':''}" data-go="${go}"><b class="${n?'':'z'}">${n}</b><span>${lab}</span><div class="sub">${sub}</div></button>`;
  const nPend=H?new Set(H.pending).size:0;
  const nChk=cnt(r=>r[C('Copertă de verificat')]),nGata=cnt(r=>r[C('Stare')]==='Gata de publicare'),nProp=H?cnt(r=>H.proposed.indexOf(r[C('ID')])>=0&&r[C('Stare')]!=='Publicată'):0,nPan=P.filter(isPropOpen).length,nUnp=cnt(r=>r[C('Stare')]!=='Publicată'),nShelf=cnt(r=>!r[C('Verificat la raft')]),nPub=cnt(r=>r[C('Stare')]==='Publicată');
  const when=s=>String(s||'').slice(0,16);
  const logRow=r=>{const id=String(r[2]),bk=/^\d+$/.test(id)?bookRow(id):null,what=r[3]==='Carte nouă'?'carte nouă':r[3]==='Modificare propusă'?'modificare propusă: '+r[5]:/^Panou|^Selecție/.test(r[3])?r[3].toLowerCase():'câmpul „'+r[3]+'”';
    const name=bk?esc(bk[C('Titlu')]):/^panou|^selecție/.test(id)?esc(id):esc(r[5]||id);return `<div class="row${bk?' ck':''}" ${bk?`data-id="${esc(id)}"`:''}><span><span class="t">${name}</span> · ${esc(what)}</span><span class="sub">${esc(when(r[0]))} · ${esc(r[1])}</span></div>`;};

function openRec(id){$('#app').innerHTML='<div class="load">Se deschide fișa…</div>';call('getRecord',id).then(showRec).catch(e=>alert(e.message||e));}

function field(k,v){

  if(k==='Tip'||k==='Categorie'||k==='Raft'){const arr=L[k]||[];const extra=v&&arr.indexOf(v)<0?[v]:[];

  if(k==='Copertă de verificat')return `<label class="f">${k}<select data-k="${k}" class="${ch}"><option value=""></option><option ${v==='da'?'selected':''}>da</option></select></label>`;

  if(k==='Sursa descrierii')return `<label class="f w">${k} · de unde vine textul (sursă, autor, „DE RESCRIS”…)<textarea data-k="${k}" class="${ch}" style="min-height:70px">${esc(v)}</textarea></label>`;

function siteIssues(r){const out=[];const cov=String(r['Copertă']||'').trim();
  if(r['Stare']!=='Publicată') out.push('Starea e „'+(r['Stare']||'—')+'”. Pe site intră doar cărțile Publicate.');
  if(!cov) out.push('Nu are copertă. Fără copertă cartea nu are imagine pe site.');
  else if(/^wix:/.test(cov)) out.push('Coperta e doar o referință veche din Wix (imagine mică, 240 px). Trebuie o copertă nouă, în folderul covers/ al site-ului.');
  else if(!/^(covers|pages)\/[\w.-]+\.(webp|jpe?g|png)$/i.test(cov)) out.push('Coperta are o cale neașteptată („'+cov.slice(0,40)+'”). Site-ul acceptă doar imagini din covers/ sau pages/.');
  if(/^(da|1|true)$/i.test(String(r['Copertă de verificat']||''))) out.push('E bifat „Copertă de verificat”: cartea e ascunsă pe site până se scoate bifa.');

  return out;}

const WC_URL='https:'+DS+'search.worldcat.org/search?q=';
const LK_MAP={en:'Engleză',ro:'Română',fr:'Franceză',de:'Germană',it:'Italiană',pl:'Polonă',ja:'Japoneză',nl:'Neerlandeză',es:'Spaniolă',sv:'Suedeză',sl:'Slovenă'};
const LK_F=[['Titlu','title'],['Subtitlu','subtitle'],['Fotograf / autor','authors'],['Editură','publisher'],['Loc','place'],['An','year'],['Pagini','pages'],['ISBN','isbn'],['Limbă','lang'],['Dimensiuni (cm)','dims'],['Descriere','desc']];
function lkVal(c,f){if(f==='authors')return (c.authors||[]).join('; ');if(f==='lang')return (c.lang||[]).map(x=>LK_MAP[x]||'').filter(Boolean).join('; ');if(f==='isbn')return String(c.isbn||'');if(f==='dims'){const m=String(c.dims||'').match(/^([\d.,]+(?: x [\d.,]+)?) cm$/);return m?m[1]:'';}return String(c[f]||'');}
function lkBox(){const r=S.rec,L=S.look&&S.look.id===r.ID?S.look:null;
  let h=`<p class="sub" style="margin:0 0 8px">Apasă „Caută date online” (butonul verde de sus). Caută după ISBN sau, dacă lipsește, după titlu și autor, în Open Library, Google Books, Library of Congress, Biblioteca Națională a Germaniei și Biblioteca Națională a Franței. Nu se schimbă nimic până nu bifezi, preiei și apeși Salvează.</p><span class="msg" id="lkmsg"></span>`;
  if(L){h+=(L.notes||[]).map(n=>`<div class="sub">${esc(n)}</div>`).join('');
    {const q=encodeURIComponent(String(L.isbn||L.title||''));if(q)h+=`<p class="sub" style="margin:8px 0 0">Caută și manual: <a href="${BNR_URL}${q}&find_code=${L.isbn?'ISN':'WRD'}" target="_blank" rel="noopener">Biblioteca Națională a României</a> · <a href="${WC_URL}${q}" target="_blank" rel="noopener">WorldCat</a>${L.ro?' <br>Cărțile românești rar apar în bazele de mai sus; bibliotecile din România nu permit căutare automată, așa că verifică în catalogul BNR.':''}</p>`;}
    if(!L.cands.length)h+='<p class="sub">Nu am găsit nimic. Încearcă cu ISBN-ul de pe carte sau cu titlul original.</p>';
    h+=L.cands.map((c,ci)=>{const rows=LK_F.map(([k,f])=>{const v=lkVal(c,f);if(!v)return '';const cur=String(r[k]||'');if(cur.replace(/[-\s]/g,'')===v.replace(/[-\s]/g,''))return '';
      const def=!cur&&f!=='authors'&&f!=='desc';const dis=f==='desc'&&cur;
      const note=f==='authors'?'<div class="warn">Atenție: sursele trec uneori și autorii de texte sau instituții. Aici rămâne doar fotograful / autorul principal.</div>':f==='desc'?'<div class="warn">Textul sursei, ca punct de plecare. Se rescrie înainte de publicare.'+(dis?' (Câmpul are deja o descriere.)':'')+'</div>':'';
      const show=f==='desc'?esc(v.slice(0,220))+(v.length>220?'…':''):esc(v);
      return `<tr><td class="k"><label><input type="checkbox" data-lk="${ci}" data-f="${k}" ${def?'checked':''} ${dis?'disabled':''}> ${esc(k)}</label></td><td class="cur">${cur?esc(cur.slice(0,80)):'<i>gol</i>'}</td><td>${show}${note}</td></tr>`;}).join('');
      return `<div class="lk">${c.cover?`<img src="${esc(c.cover)}" alt="">`:'<div class="nocov"></div>'}<div><h4>${esc(c.title)}${c.subtitle?': '+esc(c.subtitle):''}</h4>
      <div class="sub">${esc(c.src)} · <a href="${esc(c.url)}" target="_blank" rel="noopener">deschide sursa</a>${c.dims?' · dimensiuni: '+esc(c.dims):''}${c.binding?' · '+esc(c.binding):''}</div>
      ${rows?`<table><tr><td class="k sub">câmp</td><td class="cur sub">acum în fișă</td><td class="sub">găsit</td></tr>${rows}</table><p style="margin:8px 0 0"><button class="btn" data-lktake="${ci}">Preia ce am bifat</button></p>`:'<p class="sub">Nimic nou față de fișă.</p>'}
      ${c.desc?`<details><summary>Textul brut al sursei</summary><p>${esc(c.desc)}</p></details>`:''}
      ${c.others&&c.others.length?`<div class="sub" style="margin-top:6px">Alți colaboratori în sursă: ${esc(c.others.join('; '))}</div>`:''}
      ${c.subjects&&c.subjects.length?`<div class="sub" style="margin-top:6px">Subiecte în sursă: ${esc(c.subjects.join(', '))}</div>`:''}</div></div>`;}).join('');}
  return h;}
function lkBind(){const go=$('#lkgo');if(!go)return;
  go.onclick=()=>{readForm();const r=S.rec;go.disabled=true;const sec=$('#lksec');if(sec){sec.open=true;sec.scrollIntoView({behavior:'smooth',block:'start'});}$('#lkmsg').className='msg';$('#lkmsg').textContent='Caut…';
    call('lookupBook',{isbn:r['ISBN'],title:r['Titlu'],author:r['Fotograf / autor'],publisher:r['Editură'],year:r['An']})
     .then(res=>{const isb=String(r['ISBN']||'').replace(/[^0-9Xx]/g,'');S.look={id:r.ID,cands:res.cands,notes:res.notes,isbn:isb,title:r['Titlu'],ro:/^(978606|978973|973)/.test(isb)||/ă|ș|ț|â|î/i.test(r['Titlu']||'')};renderRec();})
     .catch(e=>{go.disabled=false;$('#lkmsg').className='msg err';$('#lkmsg').textContent=e.message||String(e);});};
  document.querySelectorAll('[data-lktake]').forEach(b=>b.onclick=()=>{readForm();const ci=+b.dataset.lktake,c=S.look.cands[ci];
    const fs=[...document.querySelectorAll(`[data-lk="${ci}"]:checked`)].map(i=>i.dataset.f);if(!fs.length){toast('Nu ai bifat nimic');return;}
    fs.forEach(k=>{const f=LK_F.find(x=>x[0]===k)[1];S.rec[k]=lkVal(c,f);});if(fs.indexOf('Descriere')>=0&&!S.rec['Sursa descrierii'])S.rec['Sursa descrierii']='DE RESCRIS: text brut din '+c.src;
    const ls=String(S.rec['Linkuri surse']||'');if(ls.indexOf(c.url)<0)S.rec['Linkuri surse']=(ls?ls+' | ':'')+c.src+': '+c.url;
    b.disabled=true;call('saveRawSource',S.rec.ID,c).catch(()=>{});renderRec();toast('Preluat. Verifică și apasă Salvează.');});}
/* ---------- imaginile de pe site: ce se vede și ce apare la mouse ---------- */
let IMGS=null;
function loadImgs(){if(IMGS)return Promise.resolve(IMGS);return fetch(S.data.site+'imagini.json?v='+Math.floor(Date.now()/6e5)).then(r=>r.ok?r.json():{}).then(j=>IMGS=j).catch(()=>({}));}
function imgBox(r){return `<fieldset><legend>Imagini pe site</legend><div id="imgs"><span class="sub">Se încarcă imaginile…</span></div><input type="hidden" data-k="Imagini ascunse" value="${esc(r['Imagini ascunse']||'')}"><input type="hidden" data-k="Imagine la mouse" value="${esc(r['Imagine la mouse']||'')}"><input type="hidden" data-k="Imagine în grilă" value="${esc(r['Imagine în grilă']||'')}"><input type="hidden" data-k="Ordine imagini" value="${esc(r['Ordine imagini']||'')}"></fieldset>`;}
function imgFill(){const box=$('#imgs');if(!box)return;const id=String(S.rec.ID);
  loadImgs().then(J=>{const b2=$('#imgs');if(!b2||!S.rec||String(S.rec.ID)!==id)return;const d=J[id];
    if(!d||!d.i||!d.i.length){b2.innerHTML='<span class="sub">Cartea nu are încă imagini pe site.</span>';return;}
    const hide=String(S.rec['Imagini ascunse']||'').split(/\s*;\s*/).filter(Boolean),hov=String(S.rec['Imagine la mouse']||''),grd=String(S.rec['Imagine în grilă']||'');
    const covSet=String(S.rec['Copertă']||''),cov=d.i.some(y=>y[0]===covSet)?covSet:d.i[0][0];
    const sug=d.i[d.h]&&d.h>0?d.i[d.h][0]:'',site=S.data.site;
    /* ordinea: coperta prima, apoi „Ordine imagini” din tabel, apoi restul în ordinea de pe site */
    const ordS=String(S.rec['Ordine imagini']||'').split(/\s*;\s*/).filter(Boolean),rest=d.i.filter(y=>y[0]!==cov);
    const list=[d.i.find(y=>y[0]===cov)].concat(ordS.map(s=>rest.find(y=>y[0]===s)).filter(Boolean),rest.filter(y=>ordS.indexOf(y[0])<0));
    b2.innerHTML=`<p class="sub" style="margin:0 0 8px">Alege coperta (prima imagine de pe fișa cărții și cea din previzualizarea linkului), imaginea din grilă (implicit coperta) și pe cea de la hover. Debifează ce nu vrei să apară pe site; coperta rămâne mereu prima. Ordinea celorlalte o schimbi cu ◀ ▶ sau trăgând imaginea. „Sugerat” e alegerea automată pentru hover.</p>
    <label class="sub" style="display:block;margin-bottom:8px"><input type="radio" name="hov" value="" ${hov?'':'checked'}> Hover: automat (cea sugerată)</label><div class="igrid">`+
    list.map((x,i)=>{const src=x[0],ext=!!x[1],cap=x[2]||'',isCov=src===cov,isInt=!isCov&&!ext,lab=isCov?'Coperta':ext?'Exterior':cap==='Coperta'?'Coperta anterioară':/^Interior · /.test(cap)?'Interior':(cap||'Interior');
      return `<div class="ic${hide.indexOf(src)>=0&&!isCov?' off':''}"${isCov?'':` draggable="true" data-src="${esc(src)}"`}><img loading="lazy" src="${esc(site+src)}" alt="" draggable="false"><div class="il">${isCov?'':`<span class="mv"><button type="button" data-mv="-1" title="Mai în față" ${i<2?'disabled':''}>◀</button><button type="button" data-mv="1" title="Mai în spate" ${i===list.length-1?'disabled':''}>▶</button></span>`}${esc(lab)}${src===sug&&!isCov?' <span class="sug">sugerat</span>':''}</div>`+
      (ext?'':`<label><input type="radio" name="cov" value="${esc(src)}" ${isCov?'checked':''}> copertă</label>`)+
      (isCov?'<div class="sub">rămâne mereu</div>':`<label><input type="checkbox" data-img="${esc(src)}" ${hide.indexOf(src)>=0?'':'checked'}> pe site</label>`)+
      `<label><input type="radio" name="grd" value="${isCov?'':esc(src)}" ${(isCov?!grd||grd===cov||!d.i.some(y=>y[0]===grd):grd===src)?'checked':''}> în grilă</label>`+
      (isInt?`<label><input type="radio" name="hov" value="${esc(src)}" ${hov===src?'checked':''}> la hover</label>`:'')+'</div>';}).join('')+'</div>';
    const upd=e=>{const cv=(b2.querySelector('input[name=cov]:checked')||{}).value||cov;
      if(cv!==cov){const ci=$('[data-k="Copertă"]');if(ci)ci.value=cv;S.rec['Copertă']=cv;
        const h0=[...b2.querySelectorAll('[data-img]')].filter(c=>!c.checked).map(c=>c.dataset.img).filter(x=>x!==cv);$('[data-k="Imagini ascunse"]').value=h0.join('; ');S.rec['Imagini ascunse']=h0.join('; ');
        if(String(S.rec['Imagine în grilă']||'')===cv){$('[data-k="Imagine în grilă"]').value='';S.rec['Imagine în grilă']='';}
        if(String(S.rec['Imagine la mouse']||'')===cv){$('[data-k="Imagine la mouse"]').value='';S.rec['Imagine la mouse']='';}
        toast('Coperta nouă: apasă Salvează ca să apară pe site.');imgFill();return;}
      const h=[...b2.querySelectorAll('[data-img]')].filter(c=>!c.checked).map(c=>c.dataset.img);
      let hv=(b2.querySelector('input[name=hov]:checked')||{}).value||'';
      if(hv&&h.indexOf(hv)>=0){hv='';b2.querySelector('input[name=hov][value=""]').checked=true;toast('Imaginea ascunsă nu poate apărea la hover; am pus „automat”.');}
      let gv=(b2.querySelector('input[name=grd]:checked')||{}).value||'';
      if(gv&&h.indexOf(gv)>=0){gv='';b2.querySelector('input[name=grd][value=""]').checked=true;toast('Imaginea ascunsă nu poate apărea în grilă; am pus coperta.');}
      if(gv&&hv===gv){hv='';b2.querySelector('input[name=hov][value=""]').checked=true;toast('Aceeași imagine nu poate fi și în grilă, și la hover; la hover am pus „automat”.');}
      b2.querySelectorAll('[data-img]').forEach(c=>c.closest('.ic').classList.toggle('off',!c.checked));
      $('[data-k="Imagini ascunse"]').value=h.join('; ');$('[data-k="Imagine la mouse"]').value=hv;$('[data-k="Imagine în grilă"]').value=gv;};
    b2.querySelectorAll('input').forEach(i=>i.onchange=upd);
    /* mutare: ◀ ▶ sau drag & drop; ordinea nouă se scrie în „Ordine imagini” și se salvează cu „Salvează” */
    const setOrd=a=>{['Imagini ascunse','Imagine la mouse','Imagine în grilă'].forEach(k=>{const e=$(`[data-k="${k}"]`);if(e)S.rec[k]=e.value;});
      const v=a.join('; ');$('[data-k="Ordine imagini"]').value=v;S.rec['Ordine imagini']=v;imgFill();};
    const cur=()=>list.slice(1).map(y=>y[0]);
    b2.querySelectorAll('[data-mv]').forEach(bt=>bt.onclick=()=>{const a=cur(),src=bt.closest('.ic').dataset.src,k=a.indexOf(src),j=k+(+bt.dataset.mv);if(j<0||j>=a.length)return;a.splice(k,1);a.splice(j,0,src);setOrd(a);});
    let drag=null;b2.querySelectorAll('.ic[draggable=true]').forEach(c=>{
      c.ondragstart=e=>{drag=c.dataset.src;e.dataTransfer.effectAllowed='move';};
      c.ondragover=e=>{if(drag&&drag!==c.dataset.src){e.preventDefault();c.classList.add('drop');}};
      c.ondragleave=()=>c.classList.remove('drop');
      c.ondrop=e=>{e.preventDefault();c.classList.remove('drop');const a=cur(),t=c.dataset.src;if(!drag||drag===t)return;const k=a.indexOf(drag);a.splice(k,1);a.splice(a.indexOf(t)+(k<=a.indexOf(t)?1:0),0,drag);drag=null;setOrd(a);};
      c.ondragend=()=>{drag=null;};});});}

function renderStat(){const d=S.sdays||30;
  $('#app').innerHTML=`<div class="tools"><h2 class="pg" style="margin:0">Statistici</h2><span class="sub">Doar numărători, fără date despre vizitatori. Vizitatori, țări, surse și dispozitive: <a href="https:${DS}analytics.google.com" target="_blank" rel="noopener">Google Analytics</a> · <a href="https:${DS}dash.cloudflare.com" target="_blank" rel="noopener">Cloudflare Web Analytics</a></span><span class="vt" id="sdays" style="margin-left:auto">${[7,30,90].map(n=>`<button type="button" data-d="${n}" aria-pressed="${n===d}">${n} zile</button>`).join('')}</span></div><div id="sbody" class="load">Se încarcă…</div>`;
  document.querySelectorAll('#sdays button').forEach(b=>b.onclick=()=>{S.sdays=+b.dataset.d;renderStat();});
  call('getStats',d).then(r=>{if(S.view!=='stat'||S.rec)return;const mx=a=>Math.max(1,...a.map(x=>x[1]));
    const books=(a,empty)=>a.length?a.map(x=>`<div class="srow ck" data-id="${esc(x[0])}"><div><div class="st1">${esc(x[2])}</div><div class="sub">${esc(x[3])}</div><div class="bar" style="width:${Math.round(x[1]/mx(a)*100)}%"></div></div><span class="n">${x[1]}</span></div>`).join(''):`<p class="sub">${empty}</p>`;
    const terms=(a,empty)=>a.length?a.map(x=>`<div class="srow"><div>${esc(x[0])}<div class="bar" style="width:${Math.round(x[1]/mx(a)*100)}%"></div></div><span class="n">${x[1]}</span></div>`).join(''):`<p class="sub">${empty}</p>`;
    const pd=r.perDay,pm=mx(pd);
    $('#sbody').className='';
    $('#sbody').innerHTML=`<div class="todo" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))"><div class="card" style="cursor:default"><b>${r.total.carte}</b><span>fișe de carte deschise</span></div><div class="card" style="cursor:default"><b>${r.total.cautare}</b><span>căutări</span><div class="sub">${r.total.cautare?Math.round(r.total.zero/r.total.cautare*100)+'% fără rezultat':''}</div></div><div class="card" style="cursor:default"><b>${r.total.zero}</b><span>căutări fără rezultat</span></div><div class="card" style="cursor:default"><b>${r.total.lista}</b><span>puse în „Lista mea”</span></div></div>
    ${pd.length?`<div class="spark" title="activitate pe zile">${pd.map(x=>`<i style="height:${Math.round(x[1]/pm*100)}%" title="${esc(x[0])}: ${x[1]}"></i>`).join('')}</div>`:''}
    <div class="sgrid"><div class="sbox"><h3>Cele mai deschise cărți</h3>${books(r.open,'Încă nimic în perioada asta.')}</div>
    <div class="sbox"><h3>Ce caută oamenii și nu găsesc</h3>${terms(r.zero,'Nicio căutare fără rezultat.')}<h3 style="margin-top:22px">Toate căutările</h3>${terms(r.search,'Încă nicio căutare.')}</div>
    <div class="sbox"><h3>Puse în „Lista mea”</h3>${books(r.list,'Încă nimic.')}</div></div>`;
    document.querySelectorAll('#sbody .srow.ck').forEach(x=>x.onclick=()=>openRec(x.dataset.id));
  }).catch(e=>{$('#sbody').className='load msg err';$('#sbody').textContent=e.message||String(e);});}
function diffHtml(a,b){a=String(a||'');b=String(b||'');let p=0;while(p<a.length&&p<b.length&&a[p]===b[p])p++;let s=0;while(s<a.length-p&&s<b.length-p&&a[a.length-1-s]===b[b.length-1-s])s++;
  const pre=a.slice(Math.max(0,p-40),p),post=a.slice(a.length-s,a.length-s+40),del=a.slice(p,a.length-s),ins=b.slice(p,b.length-s);
  return (p>40?'…':'')+esc(pre)+(del?`<del>${esc(del)}</del>`:'')+(ins?`<ins>${esc(ins)}</ins>`:'')+esc(post)+(a.length-s+40<a.length?'…':'')+(!a?' <span class=sub>(câmp gol înainte)</span>':'')+(!b?' <span class=sub>(golit)</span>':'');}
function crow(c,roles){const rs=roles.concat(c.r&&roles.indexOf(c.r)<0?[c.r]:[]);return `<div class="r"><input placeholder="Nume" value="${esc(c.n)}"><select><option value="">rol…</option>${rs.map(x=>`<option ${x===c.r?'selected':''}>${esc(x)}</option>`).join('')}</select><button type="button" class="x" title="Șterge">×</button></div>`;}
function bindC(){document.querySelectorAll('#contrib .x').forEach(b=>b.onclick=()=>b.parentNode.remove());}
function readForm(){if(!S.rec||!$('#save'))return;
  document.querySelectorAll('[data-k]').forEach(i=>S.rec[i.dataset.k]=i.value.trim());
  S.rec['Limbă']=[...document.querySelectorAll('#langs button[aria-pressed=true]')].map(b=>b.dataset.l).join('; ');
  if($('#teme'))S.rec['Teme']=[...document.querySelectorAll('#teme button[aria-pressed=true]')].map(b=>b.dataset.t).join('; ');
  S.rec['Colaboratori (nume – rol)']=[...document.querySelectorAll('#contrib .r')].map(r=>{const n=r.querySelector('input').value.trim(),ro=r.querySelector('select').value;return n?(ro?n+' – '+ro:n):'';}).filter(Boolean).join('; ');}
function save(){
  readForm();const ch={},bf={};Object.keys(S.rec).forEach(k=>{if(String(S.rec[k])!==String(S.orig[k])){ch[k]=S.rec[k];bf[k]=S.orig[k];}});
  if(!Object.keys(ch).length){toast('Nimic de salvat');return;}
  $('#save').disabled=true;$('#msg').className='msg';$('#msg').textContent='Se salvează…';
  call('saveRecord',S.rec.ID,ch,bf).then(res=>{
    S.orig=res.record;const keep=S.rec;S.rec=JSON.parse(JSON.stringify(res.record));
    updRow(res.record);
    if(res.conflicts.length){res.conflicts.forEach(c=>S.rec[c.field]=keep[c.field]);renderRec();$('#msg').className='msg err';$('#msg').textContent='Altcineva a schimbat între timp: '+res.conflicts.map(c=>c.field).join(', ')+'. Valorile tale sunt încă în formular, marcate; verifică și salvează din nou.';}
    else if(res.proposed){renderRec();toast('Trimis spre aprobare ('+res.proposed+' câmpuri)');if(S.home)S.home.pending.push(String(S.rec.ID));todoBadge();}
    else{renderRec();toast(res.saved?'Salvat ('+res.saved+' câmpuri)':'Nimic de salvat');}
  }).catch(e=>{$('#save').disabled=false;$('#msg').className='msg err';$('#msg').textContent=e.message||String(e);});
}
function updRow(rec){const i=S.data.rows.findIndex(r=>r[C('ID')]===String(rec.ID));const row=S.data.cols.map(k=>rec[k]||'');if(i>=0)S.data.rows[i]=row;else S.data.rows.push(row);}

/* ---------- panouri pe prima pagină ---------- */
const KINDS=['Cartea săptămânii','Cărți noi','Sugestii căutare','Meet the Book','Seara de film','Curs · Bazele fotografiei','Curs · Școala de educație vizuală','Atelier','Expoziție','Lansare de carte','Târg','Eveniment'];
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const addDays=(iso,n)=>{const d=new Date((iso||today())+'T12:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};
const fmtD=iso=>iso?new Date(iso+'T12:00').toLocaleDateString('ro-RO',{day:'numeric',month:'short',year:'numeric'}):'';
const isProp=p=>!p.active&&/^propunere/i.test(p.src||'');
const pPast=p=>{const d=today();return p.to?p.to<d:!!(p.date&&(p.end||p.date)<d);};
const isPropOpen=p=>isProp(p)&&!pPast(p);
function pStat(p){const d=today();if(isProp(p))return pPast(p)?['ex','Expirat']:['pr','Propunere'];if(!p.active)return['off','Oprit'];if(p.from&&p.from>d)return['pl','Programat'];
  if(p.to?p.to<d:(p.date&&(p.end||p.date)<d))return['ex','Expirat'];return['on','Pe site acum'];}
function pWin(p){const a=p.from?fmtD(p.from):'acum',b=p.to?fmtD(p.to):(p.end||p.date?fmtD(p.end||p.date)+' (sfârșitul evenimentului)':'fără termen');return 'pe site: '+a+' – '+b;}
/* ---------- Editorial: vedere calendar (cronologie pe săptămâni) ----------
 * Fiecare panou e o bară de la „Afișare de la” până la „Afișare până la”.
 * Când lipsesc: începutul = data din „Actualizat” (de când e în tabel), marcat cu margine punctată;
 * sfârșitul = „Până la” sau „Data”; fără niciuna = bară deschisă (săgeată).
 * Punctul negru = ziua evenimentului („Data”, și până la „Până la” când are mai multe zile).
 * Benzile sunt pe tipuri; într-o bandă, panourile care se suprapun în timp merg pe rânduri separate.
 * La tipurile săptămânale (3+ panouri la ≤ 8 zile distanță), săptămânile viitoare fără panou sunt marcate.
 */
const isoDay=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dOf=iso=>new Date(iso+'T12:00');
const monday=iso=>{const d=dOf(iso);d.setDate(d.getDate()-((d.getDay()+6)%7));return isoDay(d);};
const dayDiff=(a,b)=>Math.round((dOf(b)-dOf(a))/864e5);
const updIso=p=>{const m=String(p.updated||'').match(/(\d{2})\.(\d{2})\.(\d{4})/);return m?m[3]+'-'+m[2]+'-'+m[1]:'';};
function pSpan(p){const start=p.from||updIso(p)||today(),end=p.to||p.end||p.date||'';return{start,end,guessed:!p.from,open:!end};}
function renderPanCal(L){
  const d=today(),W=56;                       // lățimea unei săptămâni, în px
  if(!L.length)return '<div class="load">Niciun panou aici.</div>';
  const spans=L.map(p=>Object.assign({p},pSpan(p)));
  let min=monday(d),max=addDays(monday(d),7*8-1);
  spans.forEach(s=>{if(s.start<min)min=s.start;const e=s.open?addDays(s.start,21):s.end;if(e>max)max=e;});
  min=monday(addDays(min,-7));max=addDays(monday(max),13);
  const weeks=[];for(let w=min;w<=max;w=addDays(w,7))weeks.push(w);
  const x=iso=>Math.max(0,Math.min(weeks.length*W,dayDiff(min,iso)/7*W));
  // benzi pe tip, în ordinea KINDS, apoi restul alfabetic
  const kinds=[...new Set(spans.map(s=>s.p.kind||'(fără tip)'))].sort((a,b)=>{const i=KINDS.indexOf(a),j=KINDS.indexOf(b);return (i<0?99:i)-(j<0?99:j)||a.localeCompare(b,'ro');});
  const lanes=kinds.map(k=>{
    const ss=spans.filter(s=>(s.p.kind||'(fără tip)')===k).sort((a,b)=>a.start.localeCompare(b.start));
    const rows=[];ss.forEach(s=>{const e=s.open?addDays(s.start,21):s.end;let r=rows.findIndex(last=>last<s.start);if(r<0){r=rows.length;rows.push(e);}else rows[r]=e;s.row=r;});
    const dates=ss.map(s=>s.p.date||s.p.from).filter(Boolean).sort();const gaps=dates.slice(1).map((v,i)=>dayDiff(dates[i],v)).sort((a,b)=>a-b);
    const weekly=dates.length>=3&&gaps[Math.floor(gaps.length/2)]<=8;
    return{k,ss,n:rows.length,weekly};});
  const RH=30,TOP=46;let y=TOP;
  const lab=lanes.map(l=>{const h=l.n*RH+10,o=`<div class="cl-lane" style="top:${y}px;height:${h}px"><b>${esc(l.k)}</b><span class="sub">${l.ss.length}${l.weekly?' · săptămânal':''}</span></div>`;l.y=y;l.h=h;y+=h;return o;}).join('');
  const H=y;
  const head=weeks.map((w,i)=>{const m=dOf(w),first=i===0||m.getDate()<=7;return `<div class="cl-wk${w===monday(d)?' now':''}" style="left:${i*W}px;width:${W}px"><i>${first?m.toLocaleDateString('ro-RO',{month:'short'}):''}</i>${m.getDate()}</div>`;}).join('');
  const grid=weeks.map((w,i)=>`<div class="cl-col${w===monday(d)?' now':''}" style="left:${i*W}px;width:${W}px;height:${H}px"></div>`).join('');
  const sep=lanes.map(l=>`<div class="cl-sep" style="top:${l.y+l.h}px"></div>`).join('');
  const horizon=addDays(monday(d),7*8);const gapsHtml=lanes.filter(l=>l.weekly).map(l=>weeks.filter(w=>w>=monday(d)&&w<horizon).filter(w=>!l.ss.some(s=>s.start<=addDays(w,6)&&(s.open||s.end>=w)))
    .map(w=>`<div class="cl-gap" style="left:${x(w)}px;width:${W}px;top:${l.y+4}px;height:${l.h-8}px" title="Săptămâna de la ${fmtD(w)}: niciun panou „${esc(l.k)}”"></div>`).join('')).join('');
  const bars=lanes.map(l=>l.ss.map(s=>{const p=s.p,[c,t]=pStat(p),x1=x(s.start),x2=s.open?x(addDays(s.start,21)):x(addDays(s.end,1)),top=l.y+5+s.row*RH;
    const ev=p.date?`<i class="cl-ev" style="left:${x(p.date)-x1}px;width:${Math.max(8,x(addDays(p.end||p.date,1))-x(p.date))}px" title="Eveniment: ${esc(p.when||fmtD(p.date))}"></i>`:'';
    const name=p.title||p.guest||((p.books||[]).length&&typeof bookRow==='function'&&bookRow(p.books[0])?bookRow(p.books[0])[C('Titlu')]:(p.books||[]).length?'cartea '+p.books[0]:'(fără titlu)');
    return `<div class="cl-bar ${c}${s.guessed?' guess':''}${s.open?' open':''}" data-pe="${esc(p.id)}" style="left:${x1}px;width:${Math.max(10,x2-x1)}px;top:${top}px" title="${esc(p.id+' · '+name+'\n'+t+' · '+pWin(p)+(p.when?'\n'+p.when:'')+(s.guessed?'\nFără „Afișare de la”: începutul e data din Actualizat':''))}">${ev}<span>${esc(name)}</span></div>`;}).join('')).join('');
  const warn=spans.filter(s=>s.p.date&&s.end&&s.end<s.p.date).map(s=>`<div class="sub flag">${esc(s.p.id)} · ${esc(s.p.title||s.p.guest||'')}: fereastra de afișare se închide pe ${fmtD(s.end)}, înainte de eveniment (${fmtD(s.p.date)}).</div>`).join('');
  return `<div class="cl"><div class="cl-labels" style="height:${H}px"><div class="cl-corner"></div>${lab}</div>
   <div class="cl-scroll"><div class="cl-body" style="width:${weeks.length*W}px;height:${H}px">${grid}${sep}<div class="cl-head">${head}</div>${gapsHtml}${bars}</div></div></div>
   <div class="cl-leg sub"><i class="pst on">Pe site acum</i> <i class="pst pl">Programat</i> <i class="pst pr">Propunere</i> <i class="pst off">Oprit</i> <i class="pst ex">Expirat</i> · punctul negru = ziua evenimentului · margine punctată = fără „Afișare de la” · hașurat = săptămână fără panou la un tip săptămânal, pe următoarele 8 săptămâni · clic pe bară = deschide panoul${canPan()?' · trage bara = mută panoul în timp (cu confirmare)':''}</div>${warn}`;
}

/* ---------- mutarea panourilor în timp (tragere pe calendar, „Mută cu…” la selecție) ----------
 * Panoul e un bloc: Data, Până la, Afișare de la și Afișare până la se mută toate cu același număr de zile; durata rămâne.
 * „Când” e text liber: se rescrie doar când conține o singură dată, în forma standard („Joi, 24 decembrie, ora 19:00”,
 * cu sau fără ziua săptămânii și anul) și acea dată e chiar Data panoului. Altfel rămâne și panoul e marcat „de verificat Când”.
 */
const RO_DOW=['duminică','luni','marți','miercuri','joi','vineri','sâmbătă'];
const RO_MON=['ianuarie','februarie','martie','aprilie','mai','iunie','iulie','august','septembrie','octombrie','noiembrie','decembrie'];
const shiftIso=(iso,n)=>iso?addDays(iso,n):'';
function whenShift(p,n){
  const w=String(p.when||'');
  if(!p.date){ // fără Data (cartea săptămânii): „2–8 noiembrie” sau „30 noiembrie – 6 decembrie”, dacă e chiar fereastra de afișare
    const r=w.match(/^(\d{1,2})(?:\s+([a-zăâîșț]+))?\s*[–-]\s*(\d{1,2})\s+([a-zăâîșț]+)(?:\s+(\d{4}))?$/i);
    if(r&&p.from&&p.to){const a=dOf(p.from),b=dOf(p.to),mA=RO_MON.indexOf((r[2]||r[4]).toLowerCase()),mB=RO_MON.indexOf(r[4].toLowerCase());
      if(+r[1]===a.getDate()&&mA===a.getMonth()&&+r[3]===b.getDate()&&mB===b.getMonth()){const na=dOf(addDays(p.from,n)),nb=dOf(addDays(p.to,n));
        const yr=r[5]||nb.getFullYear()!==b.getFullYear()?' '+nb.getFullYear():'';
        return{when:na.getMonth()===nb.getMonth()?na.getDate()+'–'+nb.getDate()+' '+RO_MON[nb.getMonth()]+yr:na.getDate()+' '+RO_MON[na.getMonth()]+' – '+nb.getDate()+' '+RO_MON[nb.getMonth()]+yr,ok:true};}}
    return{when:w,ok:!w};}
  const re=/(?:(luni|mar[țt]i|miercuri|joi|vineri|s[âa]mb[ăa]t[ăa]|duminic[ăa])\s*,?\s*)?(\d{1,2})\s+(ianuarie|februarie|martie|aprilie|mai|iunie|iulie|august|septembrie|octombrie|noiembrie|decembrie)(?:\s+(\d{4}))?/gi;
  const ms=[...w.matchAll(re)];if(ms.length!==1)return{when:w,ok:!w};
  const m=ms[0],d=dOf(p.date);
  if(+m[2]!==d.getDate()||RO_MON.indexOf(m[3].toLowerCase())!==d.getMonth())return{when:w,ok:false};
  const nd=dOf(addDays(p.date,n)),cap=s=>m[1]&&m[1][0]===m[1][0].toUpperCase()?s[0].toUpperCase()+s.slice(1):s;
  const yr=m[4]||nd.getFullYear()!==d.getFullYear()?' '+nd.getFullYear():'';
  const txt=(m[1]?cap(RO_DOW[nd.getDay()])+(/,\s*$/.test(m[0].slice(0,m[0].indexOf(m[2])))?', ':' '):'')+nd.getDate()+' '+RO_MON[nd.getMonth()]+yr;
  return{when:w.slice(0,m.index)+txt+w.slice(m.index+m[0].length),ok:true};
}
function pShift(p,n){const q=JSON.parse(JSON.stringify(p));['date','end','from','to'].forEach(k=>q[k]=shiftIso(p[k],n));const ws=whenShift(p,n);q.when=ws.when;q._whenOk=ws.ok;return q;}
const fmtN=n=>(n>0?'+':'')+n+(Math.abs(n)===1?' zi':' zile')+(n%7===0&&n!==0?' ('+(n>0?'+':'')+(n/7)+(Math.abs(n)===7?' săptămână':' săptămâni')+')':'');
/** Dialog de confirmare: lista de panouri mutate cu n zile; „Când” editabil. */
function shiftDialog(ps,n){
  const rows=ps.map(p=>({p,q:pShift(p,n)}));
  const cell=(a,b)=>a===b?esc(fmtD(a)||'–'):`<s class="sub">${esc(fmtD(a)||'–')}</s> → <b>${esc(fmtD(b)||'–')}</b>`;
  const el=document.createElement('div');el.className='ovl';el.innerHTML=`<div class="dlg"><h3>Muți ${rows.length===1?'panoul':rows.length+' panouri'} cu ${esc(fmtN(n))}</h3>
   <p class="sub" style="margin:0 0 8px">Se mută toate datele panoului, durata rămâne. Verifică textul „Când” înainte să salvezi.</p>
   ${rows.map(({p,q},i)=>`<div class="mv"><b>${esc(p.id)} · ${esc(p.title||p.guest||p.kind)}</b></div><table>
    <tr><td>Data</td><td>${cell(p.date,q.date)}${p.end?' – '+cell(p.end,q.end):''}</td></tr>
    <tr><td>Pe site</td><td>${cell(p.from,q.from)} – ${cell(p.to,q.to)}${!p.from&&!p.to?' <span class="sub">(fără fereastră: de acum până la eveniment)</span>':''}</td></tr>
    <tr><td>Când</td><td><input class="when" data-i="${i}" value="${esc(q.when)}">${q._whenOk?'':'<span class="flag">Nu am putut rescrie textul; scrie-l tu sau lasă-l și îl corectezi din fișă.</span>'}</td></tr></table>`).join('')}
   <div class="sb"><button class="btn" id="shok">Salvează</button><button class="btn sec" id="shno">Renunță</button><span class="msg" id="shmsg"></span></div></div>`;
  document.body.appendChild(el);
  const close=()=>el.remove();el.onclick=e=>{if(e.target===el)close();};$('#shno',el).onclick=close;
  $('#shok',el).onclick=()=>{el.querySelectorAll('input.when').forEach(i=>{rows[+i.dataset.i].q.when=i.value.trim();});
    $('#shok',el).disabled=true;$('#shmsg',el).textContent='Se salvează…';
    Promise.all(rows.map(({q})=>{delete q._whenOk;return call('savePanel',q);})).then(rs=>{rs.forEach(r=>{S.panels=S.panels.map(x=>x.id===r.id?r:x);});close();S.psel=[];renderPan();toast((rs.length===1?'Panou mutat':'Mutate: '+rs.length)+' · pe site în câteva minute');})
    .catch(e=>{$('#shok',el).disabled=false;$('#shmsg',el).textContent=String(e.message||e);});};
}
/** Tragerea barelor din calendar: la eliberare, dacă s-a mutat cel puțin o zi, deschide dialogul. */
function calDrag(W){
  const DAY=W/7;
  document.querySelectorAll('.cl-bar').forEach(b=>{b.classList.add('can');
    b.addEventListener('pointerdown',e=>{if(e.button)return;const x0=e.clientX,left0=parseFloat(b.style.left);let moved=false,days=0;
      b.setPointerCapture(e.pointerId);
      const mv=ev=>{const dx=ev.clientX-x0;if(!moved&&Math.abs(dx)<4)return;moved=true;b.classList.add('drag');days=Math.round(dx/DAY);b.style.left=(left0+days*DAY)+'px';b.title=days?fmtN(days):'';};
      const up=()=>{b.removeEventListener('pointermove',mv);b.removeEventListener('pointerup',up);b.removeEventListener('pointercancel',up);b.classList.remove('drag');
        if(moved){b._drag=true;setTimeout(()=>{b._drag=false;},0);if(days)shiftDialog([S.panels.find(p=>p.id===b.dataset.pe)],days);else b.style.left=left0+'px';}};
      b.addEventListener('pointermove',mv);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);});});
}
const canPan=()=>['admin','editor'].indexOf(S.data.user.role)>=0;
const canW=()=>S.data.user.role!=='vizitator';
const bookRow=id=>S.data.rows.find(r=>r[C('ID')]===String(id));
function panDirty(){if(!S.pe||!$('#psave'))return false;readPan();return JSON.stringify(S.pe)!==S.peOrig;}
function renderPan(){
