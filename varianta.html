/* Font: Inter, găzduit odată cu pagina; desenează ș, ț, ă, â, î la fel de gros ca restul literelor. Direcție vizuală: după MEP (Maison Européenne de la Photographie). O singură greutate de font, mărimi mari, litere strânse, al doilea rând în gri; coperțile stau mici, în cutii pătrate gri, cu mult aer în jur. */
:root{
  --paper:#ffffff; --ink:#000000; --muted:#86868b; --faint:#b0b0b5;
  --rule:#e3e3e6; --stage:#f5f5f7; --stage-h:#ececef; --band:#e7eae8; --chip:#f0f0f2; --accent:#dc0b1c; --focus:#2a5bd7; --logo-l:block; --logo-d:none;
  --shadow:0 1px 2px rgba(0,0,0,.10),0 8px 18px -10px rgba(0,0,0,.30);
  /* umbră în straturi: contact strâns + umbră moale, ca de carte așezată pe masă */
  --vol:0 1px 1px rgba(0,0,0,.10),0 2px 3px rgba(0,0,0,.08),0 10px 16px -6px rgba(0,0,0,.20),0 26px 38px -18px rgba(0,0,0,.38);
  --vol-h:0 1px 1px rgba(0,0,0,.08),0 4px 6px rgba(0,0,0,.08),0 18px 26px -8px rgba(0,0,0,.22),0 44px 60px -24px rgba(0,0,0,.42);
  --ease:cubic-bezier(.2,.7,.2,1);
  --f:"Inter",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-display:var(--f); --f-ui:var(--f); --f-mono:var(--f);
}
:root{color-scheme:light}

*{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:clip;scrollbar-color:#d4d4d8 transparent}
*{scrollbar-color:#dcdce0 transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#dcdce0;border-radius:6px;border:2px solid #fff}::-webkit-scrollbar-thumb:hover{background:#c4c4ca}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5;font-weight:400;font-optical-sizing:auto;-webkit-font-smoothing:antialiased;
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
a{color:inherit}
button{font:inherit;color:inherit}
b,strong{font-weight:500}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:2px}
.wrap{max-width:1880px;margin:0 auto}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.band{background:var(--band);box-shadow:0 0 0 100vmax var(--band);clip-path:inset(0 -100vmax)}
.hero.hgrad{background:none;box-shadow:none;clip-path:none;position:relative;isolation:isolate}
.hero.hgrad::before{content:'';position:absolute;top:0;bottom:0;left:calc(50% - 50vw);width:100vw;z-index:-1;background:linear-gradient(90deg,var(--band) 0,var(--band) 18%,#fff 45%)}
@media (max-width:1100px){.hero.hgrad::before{background:linear-gradient(180deg,var(--band) 0,var(--band) 90px,#fff 300px)}}


.proto{font-size:11.5px;color:var(--muted);padding-block:6px;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
.proto b{color:var(--accent);font-weight:400}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);box-shadow:0 0 0 100vmax var(--paper);clip-path:inset(0 -100vmax)}
.top .wrap{display:grid;grid-template-columns:minmax(max-content,1fr) minmax(0,640px) minmax(max-content,1fr);align-items:center;gap:24px;padding-block:14px}
.brand{display:flex;align-items:center;gap:16px;cursor:pointer;background:none;border:0;padding:0;justify-self:start}
.brand .logo{height:54px;width:auto}
.brand .logo-l{display:var(--logo-l)}.brand .logo-d{display:var(--logo-d)}
.brand .sep{width:1px;height:30px;background:var(--rule)}
.brand .lib{white-space:nowrap;font-size:28px;letter-spacing:-.02em;display:inline-flex;align-items:center;gap:11px}
.brand .lib::before{content:"";width:12px;height:12px;border:2px solid var(--accent);flex:none}
/* pătratul roșu = punctul de clar din vizor, semnul bibliotecii */
.sec-head h2{display:flex;align-items:center;gap:.36em}
.sec-head h2::before{content:"";width:.3em;height:.3em;border:max(2px,.06em) solid var(--accent);flex:none;box-sizing:border-box;transform:translateY(.04em)}
footer .flogo{height:36px;width:auto;margin-bottom:14px}

.right{justify-self:end;display:flex;align-items:center;gap:22px;min-width:0;font-size:15px}

.ptitle{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22vw;opacity:0;transition:opacity .2s}

.field{position:relative}
.field input{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--faint);border-radius:999px}
.field input::placeholder{color:var(--muted)}

.field svg{position:absolute;top:50%;transform:translateY(-50%);pointer-events:none}
.hsearch input{font-size:16px;padding:12px 18px 12px 46px}
.hsearch svg{left:17px;width:18px;height:18px;stroke:var(--ink)}

.intro{display:flex;gap:10px 22px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:4px 18px}
.intro .facts{font-size:14px;color:var(--muted);display:flex;gap:18px;flex-wrap:wrap}

body.vb .dd>button:hover,body.vb .fbtn:hover{border-color:var(--muted)}
body.vb .right .nav[aria-current="page"]{text-decoration:none}
body.vb .right .nav[aria-current="page"]::before{content:"";display:inline-block;width:9px;height:9px;border:2px solid var(--accent);box-sizing:border-box;margin-right:7px;vertical-align:1px}
body.vb .mdot{width:8px;height:8px}

body.vb .marr{border:0;width:30px}
body.vb .marr:hover{background:none;color:var(--accent)}
body.vb .bnav{margin-left:auto;display:flex;gap:26px}
body.vb .bnav button,body.vb .booknav button{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:4px 0;cursor:pointer;font-size:15px;color:var(--ink)}

body.vb{--stage:#fff}
body.vb .meet.band{background:none;box-shadow:none;clip-path:none;isolation:isolate}
body.vb .meet.band::before{content:'';position:absolute;top:0;bottom:0;left:calc(50% - 50vw);width:100vw;z-index:-1;background:linear-gradient(90deg,var(--band) 0,var(--band) 28%,#fff 52%)}
@media (max-width:1100px){body.vb .meet.band::before{background:linear-gradient(180deg,var(--band) 0,var(--band) 60px,#fff 320px)}}
body.vb .hero.hgrad::before{background:#fff}
body.vb .mnav{justify-content:center}
body.vb .dd .menu label:hover{background:#f5f5f7}
body.vb .sel-covers{background:#f5f5f7}
body.vb .sel:hover .sel-covers{background:var(--stage-h)}
body.vb .savebig{border:0;padding-left:0}

body.vb span.n{background:var(--stage-h)!important;color:var(--ink)!important}
body.vb .right .nav span.n{background:var(--accent)!important;color:#fff!important;font-weight:500}
body.vb .save{width:30px;height:30px;top:8px;right:8px;box-shadow:0 1px 3px rgba(0,0,0,.14)}
body.vb .save svg,body.vb .savebig svg{display:none}
body.vb .save::before,body.vb .savebig::before{content:"";width:12px;height:12px;border:1.5px solid #a9a9af;box-sizing:border-box;flex:none}
body.vb .save:hover::before,body.vb .savebig:hover::before{border-color:#6e6e74}
body.vb .save[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
body.vb .save[aria-pressed="true"]::before,body.vb .savebig[aria-pressed="true"]::before{border:2.5px solid var(--accent)}
body.vb .savebig[aria-pressed="true"]{background:var(--stage-h);color:var(--ink);border-color:var(--faint)}
body.vb .toast{background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-left:3px solid var(--accent);box-shadow:0 10px 28px -12px rgba(0,0,0,.25)}
body.vb .toast button{background:var(--accent);border:0;color:#fff}
body.vb .toast button:hover{background:#b80916}
body.vb .list .acts .pbtn{background:var(--accent);color:#fff;border:0}
body.vb .list .acts .pbtn:hover{background:#b80916}
.linkbtn{background:none;border:0;padding:0;cursor:pointer;font-size:15px;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--faint)}
.linkbtn:hover{text-decoration-color:var(--ink)}

.selrow{position:relative}
.selrow .tsc{top:calc(var(--selh,180px)/2)}
.sel-grid{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 72px) / 4);gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.sel-grid::-webkit-scrollbar{display:none}
.sel{scroll-snap-align:start;-webkit-user-drag:none}
.sel-grid{cursor:grab;user-select:none;padding-bottom:4px;-webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 48px),transparent)}
.sel-grid img{-webkit-user-drag:none}
.sel-grid.dragging{cursor:grabbing;scroll-snap-type:none}
.sel-grid.dragging .sel{pointer-events:none}
.selrow .scrollbar{height:22px;margin-top:4px;position:relative;cursor:pointer;touch-action:none}
.selrow .scrollbar::before{content:"";position:absolute;left:0;right:0;top:10px;height:2px;background:var(--rule);border-radius:1px}
.selrow .scrollbar i{position:absolute;top:8px;height:6px;background:#c9c9ce;border-radius:3px;cursor:grab;transition:height .15s,top .15s}
.selrow .scrollbar:hover i,.selrow .scrollbar.drag i{top:7px;height:8px;background:#a9a9b0}
.selrow .scrollbar.drag i{cursor:grabbing}
.sel{background:none;border:0;text-align:left;cursor:pointer;padding:0;display:flex;flex-direction:column;gap:14px;min-width:0}
.sel-covers{background:var(--stage);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;gap:14px;padding:0 9%;overflow:hidden;transition:background .2s}
.sel-covers img{height:auto;width:auto;max-height:58%;max-width:calc((100% - 28px) / 3);object-fit:contain;flex:0 1 auto;min-width:0;box-shadow:var(--vol);background:var(--paper);transition:transform .5s var(--ease),box-shadow .5s var(--ease)}
@media (hover:hover){.sel:hover .sel-covers{background:var(--stage-h)}.sel:hover .sel-covers img{transform:scale(1.06);box-shadow:var(--vol-h)}.sel:hover .sel-title{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}}
.sel-title{font-size:22px;line-height:1.25;letter-spacing:-.015em}
.sel-sub{font-size:18px;line-height:1.3;color:var(--muted);letter-spacing:-.01em}

.fstick{position:sticky;top:var(--hh,80px);background:var(--paper);z-index:10}
.fstick:has(.active:not(:empty)){padding-bottom:12px;border-bottom:1px solid var(--rule)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-block:14px}
.filters::before{content:"";position:absolute;inset:0;background:var(--paper);box-shadow:0 0 0 100vmax var(--paper);clip-path:inset(0 -100vmax);z-index:-1;pointer-events:none}
.dd{position:relative}
.dd>button{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--faint);background:var(--paper);padding:7px 15px;border-radius:999px;cursor:pointer;font-size:15px}
.dd>button[aria-expanded="true"],.dd>button.on{border-color:var(--ink)}
.dd>button .n{font-size:11.5px;background:var(--ink);color:var(--paper);border-radius:999px;padding:0 6px}
.dd .menu{position:absolute;top:calc(100% + 6px);left:0;min-width:250px;max-height:360px;overflow:auto;background:var(--paper);border:1px solid var(--rule);box-shadow:0 14px 40px -12px rgba(0,0,0,.22);padding:8px;z-index:40;border-radius:8px}

.dd .menu label:hover{background:var(--stage)}

.filters .spacer{flex:1}
.fbtn{display:none;align-items:center;gap:8px;border:1px solid var(--faint);background:var(--paper);padding:9px 15px;border-radius:999px;cursor:pointer;font-size:15px}
.fbtn .n{font-size:11px;background:var(--ink);color:var(--paper);border-radius:999px;padding:0 6px}
.fpanel{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(0,0,0,.35)}
.fpanel .sheet{background:var(--paper);border-radius:16px 16px 0 0;max-height:86vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.fpanel .sh{display:flex;justify-content:space-between;align-items:center;padding:16px max(18px,env(safe-area-inset-left,0px)) 12px;border-bottom:1px solid var(--rule)}
.fpanel .sh b{font-size:20px;font-weight:400}
.fpanel .x{width:38px;height:38px;border-radius:50%;border:1px solid var(--rule);background:var(--paper);display:grid;place-items:center;cursor:pointer}
.fpanel .body{overflow:auto;padding:6px max(18px,env(safe-area-inset-left,0px)) 12px;-webkit-overflow-scrolling:touch}
.fpanel fieldset{border:0;padding:12px 0;margin:0;border-bottom:1px solid var(--rule)}
.fpanel legend{font-size:17px;padding:0;margin-bottom:6px}

.fpanel label input{width:20px;height:20px;accent-color:var(--ink)}
.fpanel label .c{margin-left:auto;color:var(--muted);font-size:14px}
.fpanel .ft{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px max(18px,env(safe-area-inset-left,0px));border-top:1px solid var(--rule)}
.fpanel .apply{flex:1;max-width:260px;background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:14px 18px;font-size:16px;cursor:pointer}

.count{font-size:14px;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:56px 24px;padding-block:28px 12px}

.card.chk .shelf img.c1{outline:3px solid var(--accent);outline-offset:3px}
.card.chk .shelf::before{content:"Copertă de verificat";position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:3;background:var(--accent);color:#fff;font-size:11px;font-weight:600;letter-spacing:.02em;padding:4px 9px;white-space:nowrap;pointer-events:none}
.stage.chk #mainimg:not(.cut){outline:4px solid var(--accent);outline-offset:4px}
.chkb{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:3;background:var(--accent);color:#fff;font-size:13px;font-weight:600;padding:6px 12px;white-space:nowrap;pointer-events:none}
.card .shelf img.c2{position:absolute;top:auto;bottom:6%;left:50%;max-width:92%;transform:translateX(-50%) scale(.98);transform-origin:50% 100%;opacity:0;pointer-events:none}

ar. Titlul vine de la Muzeul Revoluției de pe Avenida 24 Julho din Maputo. Pentru Tillim, străzile botezate și rebotezate sunt martorii a două schimbări: de la colonie la statul postcolonial, apoi de la naționalismul african la capitalism. Proiectul a câștigat Premiul HCB în 2017. Albumul, bilingv englez-francez, cu 65 de fotografii și fragmente dintr-un eseu al lui Achille Mbembe, a însoțit expoziția de la Fundația Henri Cartier-Bresson din Paris (februarie–iunie 2019).","cover":"covers/275.webp","cw":741,"ch":696,"related":["538","518","500","141","169","13"],"images":[{"src":"covers/275.webp","w":741,"h":696,"cap":"Coperta"},{"src":"pages/275_g01.webp","w":1598,"h":784,"cap":"Interior · 1 din 6","cut":true},{"src":"pages/275_g02.webp","w":1599,"h":782,"cap":"Interior · 2 din 6","cut":true},{"src":"pages/275_g03c.webp","w":1590,"h":772,"cap":"Interior · 3 din 6","cut":true},{"src":"pages/275_g04.webp","w":1600,"h":783,"cap":"Interior · 4 din 6","cut":true},{"src":"pages/275_g05.webp","w":1597,"h":779,"cap":"Interior · 5 din 6","cut":true},{"src":"pages/275_g06.webp","w":1600,"h":782,"cap":"Interior · 6 din 6","cut":true}],"series":"","vol":"","edition":"","pages":"","dim":[],"binding":"","contrib":[]},{"id":"395","title":"The Adventures of Guille and Belinda and The Illusion of an Everlasting Summer","subtitle":"","people":["Alessandra Sanguinetti"],"publisher":"MACK","year":"2020","place":"","lang":[],"isbn":"","editor":"","shelf":"D1","category":"Monografii","tags":["Portret"],"type":"Album foto","desc":"Guillermina și Belinda sunt verișoare și cresc la țară, în Argentina. Alessandra Sanguinetti le fotografiază de când erau copii. Al doilea volum al seriei le urmărește de la 14 la 24 de ani: prima iubire, apoi Belinda devine mamă la 16 ani, iar Guille puțin după ea. Cartea e și despre fotografă: complicitatea din copilărie devine relația dintre trei femei ale căror vieți se despart.","cover":"covers/395.webp","cw":739,"ch":738,"related":["398","72","332","278"," ","tags":["Tehnică și practică"],"type":"Carte","desc":"Culoarea ca subiect în sine, nu doar ca parte a imaginii: de aici pornește Michael Freeman în al treilea volum din seria «Michael Freeman On…». Ideea de bază e că o culoare e interpretată de minte, nu de ochi, deci e personală, și că stârnește reacții pe care alte elemente ale fotografiei le produc rar. Freeman pleacă de la coloriști ca Outerbridge, Haas, Gruyaert, Leiter, Eggleston și Porter, iar sfaturile practice vin din cariera lui de fotograf și editor, din vremea filmului și din cea digitală. A semnat peste 40 de reportaje pentru Smithsonian Magazine și peste 60 de cărți despre practica fotografiei.","cover":"covers/101.webp","cw":587,"ch":720,"related":["266","185","415","241","104","418"],"images":[{"src":"covers/101.webp","w":587,"h":720,"cap":"Coperta"}],"series":"Michael Freeman On…","vol":"","edition":"","pages":"","dim":[],"binding":"","contrib":[]},{"id":"107","title":"Composition & Photography: Working with Photography Using Design Concepts","subtitle":"","people":["Harold Davis"],"publisher":"Rocky Nook","year":"2022","place":"","lang":["Engleză"],"isbn":"9781681987439","editor":"","shelf":"A2","category":"Educațional","tags":["Tehnică și practică"],"type":"Carte","desc":"Carte pentru începători despre compoziție, scrisă de un fotograf care nu crede în reguli fixe: pentru Harold Davis, singurul principiu sigur e să fii deschis la neprevăzut. Zece capitole iau pe rând linia, cercul, dreptunghiul și cadrul, tiparele și repetiția, spiralele și fractalii, intrarea și ieșirea din cadru, punctele de fugă și perspectiva, simetria și asimetria, spațiul pozitiv și negativ, abstracția. Fiecare idee e arătată pe fotografiile autorului și vine cu exerciții. Davis e cunoscut mai ales pentru fotografiile de flori; în 2022, două dintre ele au devenit timbre poștale în SUA.","cover":"covers/107.webp","cw":720,"ch":720,"related":["266","106","415","421","2","393"],"images":[{"src":"covers/107.webp","w":720,"h":7 care, textile și pantofi. Ultimele capitole tratează compoziția și culoarea și analizează fotografii terminate împreună cu schemele lor de lumină. Cartea își propune să explice de ce funcționează lumina, nu să dea rețete.","cover":"covers/336.webp","cw":625,"ch":720,"related":["335","384","428","106","422","266"],"images":[{"src":"covers/336.webp","w":625,"h":720,"cap":"Coperta"}],"series":"","vol":"","edition":"","pages":"","dim":[],"binding":"","contrib":[]},{"id":"345","title":"RAW Pipeline: Revolutionary Techniques to Streamline Digital Photo Workflow (A Lark Photography Book)","subtitle":"","people":["Ted Dillard"],"publisher":"Lark Books","year":"2008","place":"","lang":["Engleză"],"isbn":"9781600592799","editor":"","shelf":"A2","category":"Educațional","tags":["Tehnică și practică"],"type":"Carte","desc":"Carte de lucru pentru fotografii care fotografiază în RAW și prelucrează imaginile în Photoshop. Ted Dillard explică ce sunt fișierele RAW, cum se prelucrează și cum fotografiezi gândindu-te deja la prelucrare. Arată apoi cum combini straturile, măștile și Smart Objects din Photoshop ca să ai mai mult control asupra imaginii. Ultima parte urmărește tot fluxul de lucru până la o printare fine art.","cover":"covers/345.webp","cw":612,"ch":720,"related":["132","131","2","384","436","60"],"images":[{"src":"covers/345.webp","w":612,"h":720,"cap":"Coperta"}],"series":"","vol":"","edition":"","pages":"","dim":[],"binding":"","contrib":[]},{"id":"348","title":"Richard Avedon: Relationships","subtitle":"","people":["Richard Avedon"],"publisher":"Skira","year":"2023","place":"","lang":[],"isbn":"9788857248400","editor":"Rebecca A. Senf","shelf":"J1","category":"Monografii","tags":["Modă"],"type":"Catalog expoziție","desc":"Catalogul expoziției de la Palazzo Reale din Milano (septembrie 2022 – ianuarie 2023) pornește de la oamenii la care Richard Avedon s-a întors de mai multe ori de-a lungul a șase decenii: Jasper Johns, Carson McCullers, formația Beatles, Andy Warhol hy in Fashion Magazines","subtitle":"","people":["Vince Aletti"],"publisher":"Phaidon","year":"2019","place":"","lang":[],"isbn":"9780714876788","editor":"","shelf":"J1","category":"Artă contemporană","tags":["Modă","Istoria fotografiei"],"type":"Carte","desc":"Istoria fotografiei de modă spusă prin reviste. Vince Aletti a ales din arhiva lui 100 de numere, de la un Harper's Bazaar din 1925 până în 2018, și le arată așa cum au apărut, cu coperte și pagini duble, nu ca imagini scoase din context; fiecare număr are un scurt text. Aletti, critic și curator, a fost editor de artă și critic de fotografie la Village Voice între 1994 și 2005 și a scris despre expozițiile de fotografie pentru The New Yorker între 2005 și 2016. Cartea are 468 de pagini și în jur de 670 de reproduceri.","cover":"covers/225.webp","cw":402,"ch":500,"related":["199","404","249","304","306","196"],"images":[{"src":"covers/225.webp","w":402,"h":500,"cap":"Coperta"}],"series":"","vol":"","edition":"","pages":"","dim":[],"binding":"","contrib":[]},{"id":"234","title":"Beyond the Shadows: The Holocaust and the Danish Exception","subtitle":"","people":["Judy Glickman Lauder"],"publisher":"Aperture","year":"2018","place":"","lang":[],"isbn":"","editor":"","shelf":"B1","category":"Fotojurnalism","tags":["Conflict, război, memorie"],"type":"Album foto","desc":"În 1943, sub ocupație, cetățenii și conducătorii Danemarcei i-au trecut pe aproape toți evreii țării în siguranță, în Suedia. Judy Glickman Lauder pune alături fotografii întunecate, expresive, din lagărele morții și portrete ale evreilor danezi supraviețuitori și ale celor care i-au salvat. Textele sunt semnate de Michael Berenbaum, unul dintre cei care au creat Muzeul Memorial al Holocaustului din SUA, și de istoricul Judith S. Goldstein, fondatoarea Humanity in Action, iar Elie Wiesel răspunde fotografiilor într-un text nepublicat până atunci. Albumul are 85 de imagini, pe 160 de pagini.","cover":"covers/234.webp","cw":419,"ch":500,"related":["2 function gaGet(){try{return localStorage.getItem('cdrf_stat')||''}catch(e){return ''}}
function gaSet(v){try{localStorage.setItem('cdrf_stat',v)}catch(e){}}
function gaLoad(){
  if(gaReady||!gaOn()) return; gaReady=true; window['ga-disable-'+GA_ID]=false;
  window.dataLayer=window.dataLayer||[]; window.gtag=function(){dataLayer.push(arguments);};
  gtag('js',new Date()); gtag('config',GA_ID,{send_page_view:false});
  const s=document.createElement('script'); s.async=true; s.src='https://www.googletagmanager.com/gtag/js?id='+GA_ID; document.head.appendChild(s);
  gaPage();
}
function gaPage(){
  if(!gaReady||window['ga-disable-'+GA_ID]) return;
  const h=location.hash.slice(1); if(h===gaLast) return; gaLast=h;
  let title='Biblioteca CdRF', path=location.pathname.replace(/[^/]*$/,'');
  if(h.startsWith('carte-')){const b=byId[h.slice(6)]; title=b?(b.full||b.title):'Carte'; path+='carte/'+h.slice(6);}
  else if(h==='despre'){title='Despre bibliotecă'; path+='despre';}
  else if(h==='lista'){title='Lista mea'; path+='lista';}
  gtag('event','page_view',{page_title:title,page_location:location.origin+path});
}
function gaSearch(v){
  clearTimeout(gaQT);
  gaQT=setTimeout(()=>{const q=String(v||'').trim().slice(0,80); if(q.length<3||q===gaLastQ) return; gaLastQ=q;
    let n=0; try{n=filtered().length}catch(e){}
    if(gaReady&&!window['ga-disable-'+GA_ID]) gtag('event','search',{search_term:q,nr_rezultate:n});
    stat('cautare',{q:q,n:n});},1500);
}
/* Statistica proprie a bibliotecii: doar numărători (ce carte s-a deschis, ce s-a căutat), fără cookie-uri și fără date despre vizitator. */
const pubHost=()=>/(github\.io|cdrf\.ro)$/.test(location.hostname);
let statLastH='';
function stat(t,o){
  if(!pubHost()||!/^https:/.test(PANELS_API)) return;
  try{ const u=PANELS_API+'?api=stat&t='+t+Object.keys(o).map(k=>'&'+k+'='+encodeURIComponent(o[k])).join('');
    fetch(u,{mode:'no-cors',keepalive:true,credentials:'omit'}).catch(()=>{}); }catch(e){}
}
function statPage(){ const h=location.hash.slice(1); if(h===statLastH) return; statLastH=h; if(h.startsWith('carte-')&&byId[h.slice(6)]) stat('carte',{id:h.slice(6)}); }
/* Cloudflare Web Analytics: fără cookie-uri, deci fără acord; doar pe site-ul public */
const CF_TOKEN='f44006c6040f4a51b455d77179d36fac';
function cfInit(){ if(!pubHost()||!/^[0-9a-f]{32}$/.test(CF_TOKEN)) return;
  const s=document.createElement('script'); s.defer=true; s.src='https://static.cloudflareinsights.com/beacon.min.js'; s.setAttribute('data-cf-beacon',JSON.stringify({token:CF_TOKEN,spa:true})); document.head.appendChild(s); }
function gaBanner(){
  if(document.getElementById('consent')) return;
  const d=document.createElement('div'); d.id='consent'; d.setAttribute('role','dialog'); d.setAttribute('aria-label','Statistici și cookie-uri');
  d.innerHTML='<p>Vrem să știm ce cărți și ce căutări îi interesează pe vizitatori, ca să îmbunătățim catalogul. Pentru asta folosim Google Analytics, care pune cookie-uri. Îl pornim doar dacă ești de acord.</p><div><button class="cbtn" data-consent="y">Sunt de acord</button><button class="cbtn sec" data-consent="n">Nu, mulțumesc</button></div>';
  document.body.appendChild(d);
  d.addEventListener('click',e=>{const b=e.target.closest('[data-consent]'); if(!b) return; const v=b.dataset.consent; gaSet(v); d.remove();
    if(v==='y') gaLoad();
    else { window['ga-disable-'+GA_ID]=true; document.cookie.split(';').map(c=>c.split('=')[0].trim()).filter(n=>/^_ga/.test(n)).forEach(n=>{
      [location.hostname,'.'+location.hostname.split('.').slice(-2).join('.'),''].forEach(dm=>{document.cookie=n+'=; Max-Age=0; path=/'+(dm?'; domain='+dm:'');});}); }
  });
}
function gaInit(){
  if(!gaOn()) return;
  const c=document.getElementById('cset'); if(c){c.hidden=false; c.onclick=gaBanner;}
  const v=gaGet(); if(v==='y') gaLoad(); else if(v!=='n') gaBanner();
}
function setQuery(v){
  st.q=v; const q2=document.getElementById('q2'); if(q2.value!==v) q2.value=v; gaSearch(v);
  if(v.trim()&&!st.userSort) st.sort='relevanta';
  if(!v.trim()&&st.sort==='relevanta') st.sort='aleator';
  if(location.hash.startsWith('#carte-')){goHomeWith(()=>{}); window.scrollTo(0,0); return;}
  refreshList(true);
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-sscroll],[data-mstep],[data-mgo],[data-meetadd],[data-meetrm],[data-fh],[data-side],[data-fclr],[data-tscroll],[data-login],[data-logout],[data-save],[data-list],[data-group],[data-print],[data-clearlist],[data-about],[data-scroll],[data-id],[data-sel],[data-rm],[data-dd],[data-person],[data-tag],[data-series],[data-pub],[data-cat],[data-back],[data-go],[data-open-cur],[data-img],[data-thumb],[data-try],[data-fpanel],#home');
  if(!t){document.querySelectorAll('.dd .menu').forEach(m=>{if(!m.contains(e.target)){m.hidden=true;m.previousElementSibling.setAttribute('aria-expanded','false')}});return;}
  if(t.matches('[data-mstep]')){meetShow(meetIdx+(+t.dataset.mstep)); return;}
  if(t.matches('[data-mgo]')){meetShow(+t.dataset.mgo); return;}
  if(t.matches('[data-fh]')){const k=t.dataset.fh; st.open[k]=!(st.open[k]||st[k].size>0); renderHome(window.scrollY); return;}
  if(t.matches('[data-side]')){st.side=!st.side; renderHome(window.scrollY); return;}
  if(t.matches('[data-fclr]')){st[t.dataset.fclr].clear(); renderHome(window.scrollY); return;}
  if(t.matches('[data-sscroll]')){const s=t.parentElement.querySelector('.sel-grid'); s.scrollBy({left:(+t.dataset.sscroll)*s.clientWidth,behavior:'smooth'}); return;}
  if(t.matches('[data-tscroll]')){const s=t.parentElement.querySelector('.gthumbs'); s.scrollBy({left:(+t.dataset.tscroll)*s.clientWidth*0.8,behavior:'smooth'}); return;}
  if(t.matches('[data-save]')){e.preventDefault();e.stopPropagation();toggleMine(t.dataset.save);return;}
  if(t.matches('[data-list]')){const tt=document.getElementById('toast'); if(tt) tt.classList.remove('on'); location.hash='lista';return;}
  if(t.matches('[data-group]')){st.group=t.dataset.group; FACETS.forEach(f=>st[f.key].clear()); refreshList(); return;}
  if(t.matches('[data-print]')){try{window.print();}catch(err){} return;}
  if(t.matches('[data-clearlist]')){mine=[]; saveMine(); renderList(); return;}
  if(t.matches('[data-about]')){location.hash='despre';return;}
  if(t.matches('[data-scroll]')){const el=document.getElementById(t.dataset.scroll); if(el) el.scrollIntoView({behavior:'smooth'});return;}
  if(t.matches('[data-id]')){e.preventDefault();openBook(t.dataset.id);return;}
  /* sigla = acasă de la zero: fără căutare, filtre, serie sau editură, ordinea implicită, sus pe pagină */
  if(t.id==='home'){clearAll(); st.sort='aleator'; st.userSort=false; lastScroll=0; if(location.hash){history.replaceState(null,'',location.pathname+location.search);} renderHome(); window.scrollTo(0,0); return;}
  if(t.matches('[data-back]')){if(location.hash){location.hash='';}else window.scrollTo({top:0,behavior:'smooth'});return;}
  if(t.matches('[data-go]')){location.hash='carte-'+t.dataset.go;return;}
  if(t.matches('[data-open-cur]')){lightbox(byId[location.hash.slice(7)],galIdx);return;}
  if(t.matches('[data-img]')){setImg(galIdx+(+t.dataset.img));return;}
  if(t.matches('[data-thumb]')){setImg(+t.dataset.thumb);return;}
  if(t.matches('[data-fpanel]')){openPanel();return;}
  if(t.matches('[data-sel]')){goHomeWith(()=>{clearAll();st.sel=t.dataset.sel;});return;}
  if(t.matches('[data-person]')){goHomeWith(()=>{clearAll();st.person=t.dataset.person;});return;}
  if(t.matches('[data-tag]')){goHomeWith(()=>{clearAll();st.tag=t.dataset.tag;});return;}
  if(t.matches('[data-series]')){goHomeWith(()=>{clearAll();st.series=t.dataset.series;});return;}
  if(t.matches('[data-pub]')){goHomeWith(()=>{clearAll();st.publisher=t.dataset.pub;});return;}
  if(t.matches('[data-cat]')){goHomeWith(()=>{clearAll();st.category.add(t.dataset.cat);});return;}
  if(t.matches('[data-rm]')){const k=t.dataset.rm,v=t.dataset.v;
    if(k==='all') clearAll(); else if(k==='q'){setQuery('',false);return;} else if(st[k] instanceof Set) st[k].delete(v); else st[k]=null;
    refreshList(); return;}
  if(t.matches('[data-dd]')){const m=t.nextElementSibling; if(!m.hidden&&Date.now()-ddHoverAt<600) return; const open=m.hidden; document.querySelectorAll('.dd .menu').forEach(x=>{x.hidden=true;x.previousElementSibling.setAttribute('aria-expanded','false')}); m.hidden=!open; t.setAttribute('aria-expanded',String(open)); return;}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('[data-f]')){const s=st[t.dataset.f]; t.checked?s.add(t.value):s.delete(t.value);
    renderHome(window.scrollY);
    const btn=document.querySelector(`[data-dd="${t.dataset.f}"]`); if(btn){btn.nextElementSibling.hidden=false;btn.setAttribute('aria-expanded','true');ddHoverAt=Date.now();}
    return;}
  if(t.id==='sort'||t.name==='sortr'){st.sort=t.value; st.userSort=true; refreshList();}
});
let qTimer=null;
document.addEventListener('input',e=>{
  if(e.target.matches('[data-fsq]')){st.fsq[e.target.dataset.fsq]=e.target.value; const q=norm(e.target.value); e.target.parentElement.querySelectorAll('.fl label').forEach(l=>l.hidden=q&&!l.dataset.n.includes(q)); return;}
  if(e.target.id!=='q2') return;
  const v=e.target.value;
  clearTimeout(qTimer); qTimer=setTimeout(()=>setQuery(v),220);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='q2'){clearTimeout(qTimer); setQuery(e.target.value);}
  if(e.key==='Escape'&&document.querySelector('.fpanel')){document.querySelector('.fpanel [data-pclose]').click();return;}
  if(e.key==='Escape'){const m=[...document.querySelectorAll('.dd .menu')].find(x=>!x.hidden); if(m){m.hidden=true;return;} if(location.hash.startsWith('#carte-')) location.hash='';}
  if(location.hash.startsWith('#carte-') && !e.target.matches('input,select') && (e.key==='ArrowLeft'||e.key==='ArrowRight')){const d=e.key==='ArrowLeft'?-1:1; if(document.getElementById('counter')) setImg(galIdx+d); else {const b=document.querySelector(`.booknav [data-go]:${d<0?'first':'last'}-child`); if(b) b.click();}}
});
let sw=null;
document.addEventListener('touchstart',e=>{const z=e.target.closest('.stage,.lb .view,.meet'); if(!z||e.touches.length!==1) return; sw={z,x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
document.addEventListener('touchend',e=>{if(!sw) return; const t=e.changedTouches[0], dx=t.clientX-sw.x, dy=t.clientY-sw.y, z=sw.z; sw=null; if(Math.abs(dx)<40||Math.abs(dx)<Math.abs(dy)*1.3) return;
  const d=dx<0?1:-1; if(z.classList.contains('meet')){meetShow(meetIdx+d);return;} if(z.classList.contains('view')){const btn=z.querySelector(d>0?'.next':'.prev'); if(btn) btn.click(); else {const lb=z.closest('.lb'); lb&&lb.dispatchEvent(new CustomEvent('swipe',{detail:d}));}} else if(document.getElementById('counter')) setImg(galIdx+d);},{passive:true});
/* video: se încarcă abia la click, din youtube-nocookie */
document.addEventListener('click',e=>{const m=e.target.closest('.nmorebtn'); if(!m) return; const s=m.previousElementSibling; if(s){s.hidden=false;} m.remove();});
document.addEventListener('click',e=>{const b=e.target.closest('.vplay'); if(!b) return; const id=b.dataset.yt; if(!/^[\w-]{11}$/.test(id)) return;
  const f=document.createElement('iframe'); f.className='vframe'; f.src='https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&rel=0'; f.title=b.getAttribute('aria-label')||'Video';
  f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen'; f.setAttribute('allowfullscreen',''); b.replaceWith(f);});
/* în panou, coperta peste care treci cu mausul devine cea mare */
document.addEventListener('mouseover',e=>{const im=e.target.closest('.meet .cv.many img'); if(!im||im.classList.contains('big')||!window.matchMedia('(hover:hover)').matches) return; im.parentElement.querySelectorAll('img.big').forEach(x=>x.classList.remove('big')); im.classList.add('big');});
/* caruselul de sus: tras cu mouse-ul, săgeți din tastatură */
let mdrag=null, mdragged=false;
document.addEventListener('pointerdown',e=>{const tr=e.target.closest('.mtrack'); if(!tr||e.pointerType!=='mouse'||e.button!==0) return; mdrag={x:e.clientX,y:e.clientY,tr}; mdragged=false;});
document.addEventListener('pointermove',e=>{if(!mdrag) return; if(!mdragged&&Math.abs(e.clientX-mdrag.x)>8){mdragged=true; mdrag.tr.classList.add('drag');} if(mdragged) e.preventDefault();});
document.addEventListener('pointerup',e=>{if(!mdrag) return; const dx=e.clientX-mdrag.x; mdrag.tr.classList.remove('drag'); mdrag=null; if(mdragged&&Math.abs(dx)>50) meetShow(meetIdx+(dx<0?1:-1)); setTimeout(()=>{mdragged=false;},0);});
document.addEventListener('click',e=>{if(mdragged&&e.target.closest('.mtrack')){e.preventDefault();e.stopPropagation();mdragged=false;}},true);
document.addEventListener('dragstart',e=>{if(e.target.closest('.mtrack')) e.preventDefault();});
document.addEventListener('keydown',e=>{const m=document.querySelector('.meet'); if(!m||!m.contains(document.activeElement)||(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')) return; e.preventDefault(); meetShow(meetIdx+(e.key==='ArrowRight'?1:-1));});
let drag=null;
document.addEventListener('pointerdown',e=>{const s=e.target.closest('.gthumbs,.sel-grid'); if(!s||e.pointerType!=='mouse'||e.button!==0) return; drag={s,x:e.clientX,left:s.scrollLeft,moved:false,id:e.pointerId};});
document.addEventListener('pointermove',e=>{if(!drag) return; const dx=e.clientX-drag.x; if(!drag.moved&&Math.abs(dx)>5){drag.moved=true; drag.s.classList.add('dragging');} if(drag.moved){drag.s.scrollLeft=drag.left-dx; e.preventDefault();}});
document.addEventListener('pointerup',e=>{if(!drag) return; const d=drag; drag=null; if(d.moved){setTimeout(()=>d.s.classList.remove('dragging'),0);} });
document.addEventListener('wheel',e=>{const s=e.target.closest(VARB?'.gthumbs':'.gthumbs,.sel-grid'); if(!s||s.scrollWidth<=s.clientWidth||Math.abs(e.deltaX)>Math.abs(e.deltaY)) return; s.scrollLeft+=e.deltaY; e.preventDefault();},{passive:false});
window.addEventListener('hashchange',()=>{route(); gaPage(); statPage();});
setTimeout(panelsLive,50); setTimeout(selectionsLive,80);
setTimeout(booksLive,60);
if(VARB){document.body.classList.add('vb');const pr=document.querySelector('.proto span');if(pr)pr.innerHTML+=' · <b>varianta B</b> (ovale mici, bife pentru Lista mea, roșu în loc de negru) · <a href="./">vezi varianta de acum</a>';}
setTimeout(gaInit,400); setTimeout(()=>{statPage(); cfInit();},500);
updNav();
route();
})();
</script>
</body></html>
